  sections:
  - kind: context
    kicker: السياق الحالي
    title: نظرة عامة على الوضع
    text: تواصل بنغلادش استضافة ما يقارب 1.2 مليون لاجئ من الروهينغا، يتركزون بصورة رئيسية في كوكس بازار وبهاسان شار، في واحدة من أكبر وأطول حالات اللجوء في العالم. ولا يزال اللاجئون يعتمدون بدرجة كبيرة على المساعدات الإنسانية ويواجهون انعدامًا مستمرًا للأمن الغذائي ومخاطر الحماية والاكتظاظ ومحدودية فرص كسب العيش والضغط على خدمات الصحة والتغذية والمياه والصرف الصحي. كما تهدد فجوات التمويل بصورة متزايدة استمرارية المساعدات الأساسية ووظائف الصحة العامة.
  - kind: needs
    kicker: الاحتياجات الإنسانية
    title: الاحتياجات الإنسانية ذات الأولوية
    text: تشمل الاحتياجات ذات الأولوية المساعدات الغذائية والتغذوية الكافية، والرعاية الصحية الأساسية، والمياه الآمنة والصرف الصحي، وصيانة المآوي، وخدمات الحماية، والتعليم، ودعم الأطفال والفئات الأكثر هشاشة. كما يعد الحفاظ على مراقبة الأمراض والاستعداد للطوارئ أمرًا بالغ الأهمية في المخيمات ذات الكثافة السكانية العالية.
  - kind: priorities
    kicker: أولويات الاستجابة
    title: أولويات الاستجابة الرئيسية
    text: تشمل أولويات الاستجابة استمرار المساعدات الغذائية القائمة على مستوى الاحتياج، وحماية خدمات الصحة والتغذية الأساسية، والحفاظ على أنظمة المياه الآمنة والصرف الصحي، وتعزيز الحماية والتعليم، وضمان الاستعداد لمخاطر الرياح الموسمية والأعاصير وتفشي الأمراض. ويظل استمرار التمويل الدولي ضروريًا لمنع مزيد من التدهور في الظروف المعيشية.
  note: تعكس الأرقام أحدث البيانات الإنسانية المتاحة لفترة التقرير. وتشمل المصادر تحديثات الوضع الإنساني الرسمية والتقارير القطاعية الصادرة عن مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية وبرنامج الأغذية العالمي ومنظمة الصحة العالمية واليونيسف.

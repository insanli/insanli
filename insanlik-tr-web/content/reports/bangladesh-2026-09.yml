  country_name: بنغلاديش
  title: بنغلادش — نظرة عامة على الوضع الإنساني
  summary: تواصل بنغلادش استضافة ما يقارب 1.2 مليون لاجئ من الروهينغا، يتركزون بصورة رئيسية في كوكس بازار وبهاسان شار، في واحدة من أكبر وأطول حالات اللجوء في العالم. ولا يزال اللاجئون يعتمدون بدرجة كبيرة على المساعدات الإنسانية ويواجهون انعدامًا مستمرًا للأمن الغذائي…

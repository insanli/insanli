  sections:
  - kind: context
    kicker: CURRENT CONTEXT
    title: Situation Overview
    text: Bangladesh continues to host nearly 1.2 million Rohingya refugees, primarily in Cox’s Bazar and Bhasan Char, in one of the world’s largest and most protracted refugee situations. Refugees remain highly dependent on humanitarian assistance and face persistent food insecurity, protection risks, overcrowding, limited livelihood opportunities and pressure on health, nutrition, water and sanitation services. Funding shortfalls are increasingly threatening the continuity of essential assistance and public-health functions.
  - kind: needs
    kicker: HUMANITARIAN NEEDS
    title: Priority Humanitarian Needs
    text: Priority needs include adequate food and nutrition assistance, essential healthcare, safe water and sanitation, shelter maintenance, protection services, education and support for children and other vulnerable groups. Maintaining disease surveillance and emergency preparedness is also critical in the densely populated camps.
  - kind: priorities
    kicker: RESPONSE FOCUS
    title: Key Response Priorities
    text: Response priorities include sustaining needs-based food assistance, protecting essential health and nutrition services, maintaining safe water and sanitation systems, strengthening protection and education, and ensuring preparedness for monsoon, cyclone and disease-outbreak risks. Continued international funding is essential to prevent further deterioration in living conditions.
  note: Figures reflect the latest available humanitarian data for the reporting period. Sources include official humanitarian situation updates and sector-specific reporting from UN OCHA, WFP, WHO and UNICEF.

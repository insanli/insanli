  sections:
  - kind: context
    kicker: MEVCUT DURUM
    title: Durum Genel Görünümü
    text: Bangladeş, başta Cox’s Bazar ve Bhasan Char olmak üzere yaklaşık 1,2 milyon Rohingya mülteciye ev sahipliği yapmaya devam etmekte ve bu durum dünyanın en büyük ve en uzun süreli mülteci krizlerinden birini oluşturmaktadır. Mülteciler insani yardıma büyük ölçüde bağımlı olmaya devam ederken kalıcı gıda güvensizliği, koruma riskleri, aşırı kalabalık, sınırlı geçim imkânları ve sağlık, beslenme, su ve sanitasyon hizmetleri üzerindeki baskıyla karşı karşıyadır. Finansman açıkları, temel yardımın ve halk sağlığı işlevlerinin sürekliliğini giderek daha fazla tehdit etmektedir.
  - kind: needs
    kicker: İNSANİ İHTİYAÇLAR
    title: Öncelikli İnsani İhtiyaçlar
    text: Öncelikli ihtiyaçlar arasında yeterli gıda ve beslenme desteği, temel sağlık hizmetleri, güvenli su ve sanitasyon, barınakların bakımı, koruma hizmetleri, eğitim ve çocuklar ile diğer kırılgan gruplara destek bulunmaktadır. Yoğun nüfuslu kamplarda hastalık sürveyansının ve acil durum hazırlığının sürdürülmesi de kritik önemdedir.
  - kind: priorities
    kicker: MÜDAHALE ODAĞI
    title: Temel Müdahale Öncelikleri
    text: Müdahale öncelikleri; ihtiyaca dayalı gıda yardımının sürdürülmesi, temel sağlık ve beslenme hizmetlerinin korunması, güvenli su ve sanitasyon sistemlerinin devam ettirilmesi, koruma ve eğitimin güçlendirilmesi ve muson, siklon ve hastalık salgını risklerine karşı hazırlığın sağlanmasıdır. Yaşam koşullarının daha da kötüleşmesini önlemek için sürekli uluslararası finansman hayati önem taşımaktadır.
  note: Rakamlar, raporlama dönemi için mevcut en güncel insani verileri yansıtmaktadır. Kaynaklar; UN OCHA, WFP, WHO ve UNICEF'in resmi insani durum güncellemeleri ile sektörel raporlarını içermektedir.

  - title: 4. Sudan’da İnsani Yardım Çalışmaları
    toc: SUDAN’DA İNSANİ YARDIM ÇALIŞMALARI
    blocks:
    - h: A. Nisan 2023 – Ağustos 2026 Döneminde Sudan’a Yönelik Uluslararası İnsani Yardımın Genel Durumu
      toc: A. Nisan 2023 – Ağustos 2026 Döneminde Sudan’a Yönelik Uluslararası İnsani Yardımın Genel Durumu
      level: 1
      id: s4-1
    - p: Sudan’da savaşın başlamasının ardından ilk aylarda insani yardım faaliyetleri yaklaşık %80 oranında azalmış, ülkede faaliyet gösteren Birleşmiş Milletler kuruluşları ile uluslararası, bölgesel ve yabancı yardım kuruluşlarının müdahale kapasitesi yaklaşık %20’ye düşmüştür.
    - p: Devletin sağladığı kolaylıklar ve yapılan düzenlemeler sayesinde bu kuruluşlar, krizin farklı alanlarında ihtiyaç sahiplerine ulaşmak için önemli çalışmalar yürütmüştür. Ancak bu çabalar, özellikle Büyük Darfur ve Büyük Kordofan bölgelerinde ağırlaşan ve kapsamlı bir müdahale gerektiren insani krizin ihtiyaçlarını karşılamaya yetmemiştir.
    - p: Bu durumun başlıca nedenlerinden biri, Sudan’a yönelik uluslararası insani yardım finansmanının yetersiz kalmasıdır. Nitekim 2025 yılında finansman açığı yaklaşık %60’a ulaşmış ve ülkeye sağlanan uluslararası desteğin en düşük seviyelerinden biri kaydedilmiştir.
    - p: Aşağıdaki tablo, 2023–2026 yılları arasında insani yardım planları için talep edilen ve sağlanan finansman miktarlarını göstermektedir.

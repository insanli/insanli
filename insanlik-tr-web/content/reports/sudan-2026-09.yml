  - kind: priorities
    kicker: أولويات الاستجابة
    title: الوضع العام للاستجابة الإنسانية الدولية
    text: 'تراجعت أنشطة العمل الإنساني بنحو 80% خلال الأشهر الأولى بعد اندلاع الحرب، وانخفضت القدرة على الاستجابة لدى وكالات الأمم المتحدة والمنظمات الدولية والإقليمية والأجنبية العاملة في البلاد إلى نحو 20%. وبفضل التسهيلات والترتيبات التي قدمتها الدولة، نفذت هذه المنظمات أعمالًا مهمة للوصول إلى المحتاجين، إلا أن هذه الجهود لم تكن كافية لتلبية احتياجات الأزمة الإنسانية المتفاقمة، ولا سيما في إقليمي دارفور الكبرى وكردفان الكبرى. ومن أبرز أسباب ذلك عدم كفاية التمويل الإنساني الدولي للسودان، إذ بلغت فجوة التمويل نحو 60% وتجاوزت هذه النسبة في بعض القطاعات. ونتيجة لذلك، لم يتمكن نحو 15.8 مليون شخص من الاستفادة من المساعدات الإنسانية متعددة القطاعات. ورغم ذلك، تحقق تقدم مهم بفضل جهود الدولة في توسيع مناطق الحماية والمناطق الآمنة، والمبادرات التي سهّلت إيصال المساعدات، والتنسيق بين المؤسسات؛ وبمساهمة وكالات الأمم المتحدة والشركاء الإنسانيين والدول الصديقة والشقيقة، وصلت المساعدات الإنسانية إلى أكثر من 11.5 مليون شخص. كما تم إيصال نحو 325,000 طن متري من المساعدات الإنسانية في مجالات الأمن الغذائي والصحة والتعليم والمياه والإغاثة الطارئة، وبلغت القيمة الإجمالية لأنشطة الأمم المتحدة الإنسانية 1.17 مليار دولار.


      تحملت حكومة السودان مسؤوليتها في تقليص فجوة التمويل في المجال الإنساني وتلبية احتياجات مواطنيها المتأثرين بالأزمة التي خلفتها الحرب. وفي هذا الإطار، تمت تلبية أكثر من 52% من احتياجات النازحين والعائدين إلى مناطقهم وغيرهم من المتأثرين بالحرب. وقد وصلت المساعدات عبر مبادرة رئيس مجلس السيادة، ووزارة المالية الاتحادية، والمؤسسات الحكومية على المستويين الاتحادي والولائي، والمبادرات المجتمعية المحلية، والسودانيين المقيمين في الخارج، والشركات الوطنية التي قدمت الدعم في إطار المسؤولية الاجتماعية للشركات. وفي هذا السياق، تم إيصال ما مجموعه 2,585,500 طن متري من المساعدات الإنسانية في مختلف القطاعات إلى أكثر من 6.9 مليون شخص يعيشون في المناطق ذات الاحتياجات الإنسانية المرتفعة. وأُعطيت الأولوية بشكل خاص للنازحين من إقليمي دارفور الكبرى وكردفان الكبرى.'

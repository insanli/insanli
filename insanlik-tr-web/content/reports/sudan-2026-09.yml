    - p: Dönem boyunca insani yardım için ayrılan kaynaklarla farklı sektörlerdeki ihtiyaçlar arasında ciddi bir finansman açığı oluşmuş, kaynak metne göre bu açık bazı alanlarda %60’ı aşmıştır. Bunun sonucunda, Ocak–Ağustos 2026 döneminde yaklaşık 15,8 milyon kişi birden fazla sektörü kapsayan insani yardım çalışmalarından yararlanamamıştır.
    - p: Buna rağmen devletin koruma alanlarını ve güvenli bölgeleri genişletmeye yönelik çalışmaları, insani yardımların ihtiyaç sahiplerine ulaştırılmasını kolaylaştıran girişimleri ve kurumlar arasındaki koordinasyon sayesinde önemli ilerleme kaydedilmiştir. Birleşmiş Milletler kuruluşları, yardım ortakları ve dost ve kardeş ülkelerin katkılarıyla söz konusu dönemde 11,5 milyondan fazla kişiye insani yardım ulaştırılmıştır.
    - p: Aynı dönemde gıda güvenliği, sağlık, eğitim, su ve acil yardım alanlarında yaklaşık 325.000 metrik ton insani yardım ulaştırıldığı kaydedilmiştir. Birleşmiş Milletlerin insani yardım faaliyetleri kapsamında yürüttüğü çalışmaların toplam tutarı ise 1,17 milyar dolara ulaşmıştır. Sektörlere göre sağlanan finansman ve karşılanma oranları aşağıdaki tabloda sunulmaktadır.

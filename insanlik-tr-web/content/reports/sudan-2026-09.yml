tr:
  country_name: Sudan
  title: Sudan — İnsani Durum Genel Görünümü
  summary: Sudan, uzun süren çatışmalar, kitlesel yerinden edilme, akut gıda güvensizliği, hastalık salgınları ve temel hizmetlerdeki aksaklıklar nedeniyle dünyanın en ağır insani krizlerinden biriyle karşı karşıya kalmaya devam etmektedir. İnsani ihtiyaçlar son derece…
  figures:

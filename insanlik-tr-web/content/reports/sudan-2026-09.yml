  - title: إيصال المساعدات الإنسانية وتسهيلات الوصول
    blocks:
    - h: جهود السودان لتسهيل إيصال المساعدات الإنسانية
      toc: جهود السودان لتسهيل إيصال المساعدات الإنسانية
      level: 1
      id: s6-1
    - p: يناير – أغسطس 2026
    - p: اتخذت حكومة السودان، انطلاقًا من واجباتها الدستورية ومسؤولياتها تجاه مواطنيها، وفي إطار قانون تنظيم العمل الطوعي والإنساني لسنة 2006 ومبادئ القانون الدولي الإنساني والقانون الدولي لحقوق الإنسان، الخطوات اللازمة لمعالجة الآثار السلبية للأزمة الإنسانية في البلاد.
    - p: وقد وفّرت الحكومة التسهيلات اللازمة لوصول المنظمات الإنسانية إلى المحتاجين، ووسّعت نطاق المناطق الآمنة، واتخذت تدابير لحماية المدنيين، ودعمت العودة الطوعية للنازحين واللاجئين. وفي هذا الإطار، سُجّلت عودة نحو 5.8 مليون شخص إلى مناطقهم حتى نهاية يونيو 2026، ومن المتوقع أن يصل هذا العدد إلى نحو 7.9 مليون بحلول نهاية ديسمبر 2026.
    - p: وفيما يلي ملخص لجهود الحكومة في تسهيل إيصال المساعدات الإنسانية.
    - h: أ. الإجراءات الميسِّرة لإيصال المساعدات الإنسانية
      toc: أ. الإجراءات الميسِّرة لإيصال المساعدات الإنسانية
      level: 1
      id: s6-2
    - p: '1. الإعفاءات الجمركية والضريبية: أُعفيت جميع المواد التي أُدخلت إلى البلاد في إطار الأنشطة الإنسانية من الرسوم الجمركية والضرائب الأخرى والرسوم ذات الصلة، ويُذكر أن إجمالي قيمة هذه الإعفاءات الممنوحة حتى يونيو 2027 بلغ نحو 7.5 مليون دولار.'
    - p: '2. تغطية تكاليف نقل المساعدات: جرت تغطية تكاليف نقل المساعدات الواردة من الدول الصديقة وبعض المنظمات الإنسانية إلى جميع ولايات السودان، ويُذكر أن النفقات المخصصة لهذا الغرض حتى يونيو 2026 بلغت نحو 1.8 مليون دولار.'
    - p: '3. تنفيذ الإجراءات الإدارية والفنية: حتى يونيو 2026، نُفذ أكثر من 35,500 إجراء إداري وفني على المستويين الاتحادي والولائي لتسهيل إيصال المساعدات الإنسانية، شملت إصدار تأشيرات الدخول، ومنح الإعفاءات الجمركية والضريبية، وإصدار أذونات التنقل للعاملين في المجال الإنساني، والموافقة على شحنات المساعدات، وتجديد تسجيل المنظمات، وفتح حسابات مصرفية باسم المنظمات. وبلغت نسبة الموافقة الإجمالية على هذه الإجراءات 99.6%.'
    - p: '4. زيادة نقاط العبور: رُفع عدد نقاط العبور البرية والجوية والبحرية والنهرية المستخدمة في إيصال المساعدات الإنسانية من 2 إلى 14، والتزمت حكومة السودان بتحديد مواعيد فتح معبر أدري الحدودي، وهو أحد هذه النقاط، بصورة منتظمة.'
    - p: '5. مواءمة خطط الأمم المتحدة الإنسانية مع الأولويات الوطنية: بُذلت جهود لضمان اتساق خطط الاحتياجات والاستجابة الإنسانية للأمم المتحدة لعام 2026 مع الأولويات الوطنية للسودان وسيادته، وفي هذا الإطار ترأست المفوضية الآلية الوطنية للتنسيق الفني الخاصة بخطط الأمم المتحدة الإنسانية.'
    - p: '6. التقييمات الميدانية: نُفذت 8 دراسات ميدانية في 10 ولايات لتحديد الاحتياجات الإنسانية.'
    - p: '7. تنظيم الأوضاع القانونية للمنظمات الإنسانية: نُفذت الأعمال اللازمة لمواءمة الأوضاع القانونية للمنظمات العاملة في الأنشطة الإنسانية مع التشريعات.'
    - h: جدول متابعة إجراءات تسهيل الوصول الإنساني (حتى أغسطس 2026)
      toc: جدول متابعة إجراءات تسهيل الوصول الإنساني (حتى أغسطس 2026)
      level: 1
      id: s6-3
    - p: EKLENECEK
    - h: المعابر الحدودية المعتمدة للوصول الإنساني في السودان
      toc: المعابر الحدودية المعتمدة للوصول الإنساني في السودان
      level: 1
      id: s6-4
    - p: EKLENECEK
    - p: تماشيًا مع قرار مجلس السيادة الانتقالي، ومبادئ إعلان جدة الصادر في مايو 2023، والسياسة الوطنية للنزوح الداخلي لسنة 2009، وموجهات وإجراءات العمل الإنساني لسنة 2016، اعتمدت حكومة السودان ما مجموعه 14 معبرًا حدوديًا ونقطة دخول برية وجوية ونهرية لاستخدامها في شحنات المساعدات الإنسانية، وذلك للوفاء بمسؤولياتها تجاه النازحين والعائدين والمجتمعات المضيفة المتأثرة بالحرب. وبذلك زاد عدد النقاط المعتمدة بمقدار 12 نقطة. وسُجّلت النقاط من 1 إلى 7 بوصفها نقاط العبور المستخدمة فعليًا لدخول المساعدات الإنسانية إلى البلاد خلال الفترة من يناير إلى أغسطس 2026.
    - p: إضافة إلى ذلك، توجد نحو 6,000 طريق داخلي تُستخدم في شحنات المساعدات الإنسانية، تغطي 773 وحدة إدارية في 18 ولاية، وتسهّل إيصال المساعدات الإنسانية إلى المناطق المحتاجة إليها. وتشمل هذه المساعدات أيضًا الإمدادات الإنسانية في مجالات الصحة والتعليم والمياه وصحة البيئة. وفيما يلي المعابر الحدودية ونقاط الدخول المعتمدة.

  - title: Humanitarian Aid Operations in Sudan
    blocks:
    - h: A. Overall Status of International Humanitarian Aid to Sudan (April 2023 – August 2026)
      toc: A. Overall Status of International Humanitarian Aid to Sudan (April 2023 – August 2026)
      level: 1
      id: s4-1
    - p: In the first months after the outbreak of the war in Sudan, humanitarian activities fell by around 80%, and the response capacity of UN agencies and international, regional and foreign aid organisations operating in the country dropped to around 20%.
    - p: Thanks to the facilitation and arrangements provided by the state, these organisations carried out important work to reach people in need across the different areas of the crisis. However, these efforts were not enough to meet the needs of the humanitarian crisis, which has worsened and requires a comprehensive response, especially in the Greater Darfur and Greater Kordofan regions.
    - p: One of the main reasons for this is the insufficient international humanitarian funding for Sudan. In 2025 the funding gap reached around 60%, one of the lowest levels of international support recorded for the country.
    - p: The table below shows the amounts of funding requested and received for the humanitarian plans between 2023 and 2026.

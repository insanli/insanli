    - h: ب. ملخص جهود المساعدات الإنسانية الوطنية في السودان (يناير – أغسطس 2026)
      toc: ب. ملخص جهود المساعدات الإنسانية الوطنية في السودان (يناير – أغسطس 2026)
      level: 1
      id: s4-4
    - p: تحملت حكومة السودان مسؤولية تقليص فجوة التمويل الإنساني وتلبية احتياجات مواطنيها المتأثرين بالأزمة الناجمة عن الحرب، وبناءً على ذلك جرت تلبية أكثر من 52% من احتياجات النازحين والعائدين إلى مناطقهم وغيرهم من المتأثرين بالحرب.
    - p: وقد قُدّمت المساعدات عبر مبادرة رئيس مجلس السيادة، ووزارة المالية الاتحادية، والمؤسسات الحكومية على المستويين الاتحادي والولائي، والمبادرات المجتمعية المحلية، والسودانيين المقيمين بالخارج، والشركات الوطنية في إطار المسؤولية الاجتماعية للشركات.
    - p: ونُفذت هذه الجهود وفقًا للبند (د) من المادة 6 من قانون تنظيم العمل الطوعي والإنساني لسنة 2006، والمادتين 3 و5 من السياسة الوطنية للنازحين داخليًا لسنة 2009، كما استندت إلى المبدأين 25 و1 من المبادئ التوجيهية للأمم المتحدة بشأن التشريد الداخلي لسنة 1998.
    - p: وفي هذا الإطار، جرى إيصال ما مجموعه 2,585,500 طن متري من المساعدات الإنسانية التي تغطي قطاعات مختلفة إلى أكثر من 6.9 مليون شخص يعيشون في مناطق تشتد فيها الاحتياجات الإنسانية، مع إعطاء الأولوية بشكل خاص للنازحين من إقليمي دارفور الكبرى وكردفان الكبرى. وترد تفاصيل مصادر المساعدات وتوزيعها في الجدول أدناه.

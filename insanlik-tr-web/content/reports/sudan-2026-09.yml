    - h: B. Sudan’ın Ulusal İnsani Yardım Çalışmalarının Özeti (Ocak–Ağustos 2026)
      toc: B. Sudan’ın Ocak–Ağustos 2026 Dönemindeki Ulusal İnsani Yardım Çalışmalarının Özeti
      level: 1
      id: s4-4
    - p: Sudan hükümeti, insani yardım alanındaki finansman açığını azaltmak ve savaşın yol açtığı krizden etkilenen vatandaşlarının ihtiyaçlarını karşılamak amacıyla sorumluluk üstlenmiştir. Bu doğrultuda, yerinden edilenlerin, yaşadıkları bölgelere geri dönenlerin ve savaştan etkilenen diğer kişilerin ihtiyaçlarının %52’sinden fazlası karşılanmıştır.
    - p: Yardımlar; Egemenlik Konseyi Başkanı’nın girişimi, Federal Maliye Bakanlığı, federal ve eyalet düzeyindeki kamu kurumları, yerel toplumsal girişimler, yurt dışında yaşayan Sudanlılar ve kurumsal sosyal sorumluluk kapsamında destek sağlayan ulusal şirketler aracılığıyla ulaştırılmıştır.
    - p: Bu çalışmalar, 2006 tarihli Gönüllü ve İnsani Yardım Faaliyetlerini Düzenleme Kanunu’nun 6. maddesinin (d) bendi ile 2009 tarihli Ulusal Yerinden Edilmiş Kişiler Politikası’nın 3. ve 5. maddeleri doğrultusunda yürütülmüştür. Ayrıca, Birleşmiş Milletler’in 1998 tarihli Ülke İçinde Yerinden Edilmeye İlişkin Yol Gösterici İlkeleri’nin 25. ve 1. ilkeleri esas alınmıştır.
    - p: Bu kapsamda, insani ihtiyaçların yoğun olduğu bölgelerde yaşayan 6,9 milyondan fazla kişiye, farklı sektörleri kapsayan toplam 2.585.500 metrik ton insani yardım ulaştırılmıştır. Yardımlarda özellikle Büyük Darfur ve Büyük Kurdufan bölgelerinden yerinden edilenlere öncelik verilmiştir. Yardım kaynakları ve dağılımına ilişkin ayrıntılar aşağıdaki tabloda yer almaktadır.
    - h: Sağlanan Ulusal İnsani Yardımlar (Ağustos 2026’ya Kadar)
      toc: Ağustos 2026’ya Kadar Sağlanan Ulusal İnsani Yardımlar
      level: 1

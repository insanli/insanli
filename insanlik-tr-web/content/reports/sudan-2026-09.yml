  sections:
  - kind: context
    kicker: السياق الحالي
    title: نظرة عامة على الوضع
    text: لا يزال السودان يواجه واحدة من أشد الأزمات الإنسانية في العالم، نتيجة النزاع الممتد والنزوح الواسع وانعدام الأمن الغذائي الحاد وتفشي الأمراض وتعطل الخدمات الأساسية. وتبقى الاحتياجات الإنسانية مرتفعة بصورة استثنائية، فيما تحدّ الأوضاع الأمنية وصعوبات الوصول من إيصال المساعدات إلى المناطق المتأثرة بالنزاع والمناطق التي يصعب الوصول إليها. وتواجه الأسر في دارفور وكردفان وغيرها من المناطق المتضررة مخاطر شديدة مرتبطة بالجوع وتعطل النظام الصحي ونقص المياه الآمنة والمأوى غير الملائم.
  - kind: needs
    kicker: الاحتياجات الإنسانية
    title: الاحتياجات الإنسانية ذات الأولوية
    text: تشمل الاحتياجات ذات الأولوية المساعدات الغذائية والتغذوية الطارئة، ومياه الشرب الآمنة وخدمات الصرف الصحي، والرعاية الصحية الأساسية والأدوية، والمأوى الطارئ، وخدمات الحماية، والمواد غير الغذائية الأساسية. وتحتاج الأسر النازحة والأطفال والمجتمعات في المناطق المتأثرة بالنزاع والتي يصعب الوصول إليها إلى دعم مستمر ومرن.
  - kind: priorities
    kicker: أولويات الاستجابة
    title: أولويات الاستجابة الرئيسية
    text: تشمل أولويات الاستجابة الفورية استمرار المساعدات المنقذة للحياة في مجالي الغذاء والتغذية، واستعادة الوصول إلى المياه الآمنة والخدمات الصحية الأساسية، وتوفير المأوى الطارئ ومواد الإغاثة، وتعزيز الحماية للأسر النازحة والأكثر هشاشة. وينبغي إعطاء الأولوية للمناطق التي تواجه مستويات شديدة من انعدام الأمن الغذائي وتفشي الأمراض والقيود الكبيرة على الوصول.
  note: تعكس الأرقام أحدث البيانات الإنسانية المتاحة لفترة التقرير. وتشمل المصادر تحديثات الوضع الإنساني الرسمية والتقارير القطاعية الصادرة عن مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية وبرنامج الأغذية العالمي ومنظمة الصحة العالمية واليونيسف.

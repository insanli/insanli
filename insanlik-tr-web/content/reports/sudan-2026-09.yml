  - title: Delivery of Humanitarian Aid and Access Facilitation
    blocks:
    - h: Sudan’s Efforts to Facilitate the Delivery of Humanitarian Aid
      toc: Sudan’s Efforts to Facilitate the Delivery of Humanitarian Aid
      level: 1
      id: s6-1
    - p: January–August 2026
    - p: In line with its constitutional duties and its responsibilities towards its citizens, and within the framework of the Voluntary and Humanitarian Work (Organisation) Act of 2006 and the principles of international humanitarian law and international human rights law, the Government of Sudan has taken the necessary steps to address the adverse effects of the humanitarian crisis in the country.
    - p: The government has provided the facilities needed for humanitarian organisations to reach people in need, expanded the scope of safe zones, taken measures to protect civilians and supported the voluntary return of displaced persons and refugees. In this context, around 5.8 million people were recorded as having returned to their home areas by the end of June 2026. This number is expected to reach around 7.9 million by the end of December 2026.
    - p: The government’s efforts to facilitate the delivery of humanitarian aid are summarised below.
    - h: A. Procedures Facilitating the Delivery of Humanitarian Aid
      toc: A. Procedures Facilitating the Delivery of Humanitarian Aid
      level: 1
      id: s6-2
    - p: '1. Customs and tax exemptions: All materials brought into the country for humanitarian activities have been exempted from customs duties, other taxes and related fees. The total value of these exemptions granted up to June 2027 is stated to be around $7.5 million.'
    - p: '2. Covering the transport costs of aid: Transport costs were covered to deliver aid from friendly countries and some humanitarian organisations to all states of Sudan. Expenditure for this purpose up to June 2026 is stated to be around $1.8 million.'
    - p: '3. Administrative and technical procedures: Up to June 2026, more than 35,500 administrative and technical procedures were carried out at federal and state level to facilitate the delivery of humanitarian aid. These included issuing entry visas, granting customs and tax exemptions, issuing travel permits to humanitarian workers, approving aid shipments, renewing organisations’ registrations and opening bank accounts on behalf of organisations. The overall approval rate for these procedures was 99.6%.'
    - p: '4. Increasing the number of crossing points: The number of land, air, sea and river crossing points used to deliver humanitarian aid was increased from 2 to 14. The Government of Sudan has committed to regularly setting the opening dates of the Adre border crossing, one of these points.'
    - p: '5. Aligning UN humanitarian plans with national priorities: Work was carried out to ensure that the United Nations’ 2026 humanitarian needs and response plans are consistent with Sudan’s national priorities and sovereignty. In this context, the Commission chaired the national technical coordination mechanism for the UN humanitarian plans.'
    - p: '6. Field assessments: 8 field studies were carried out in 10 states to identify humanitarian needs.'
    - p: '7. Regularising the legal status of humanitarian organisations: The necessary work was carried out to bring the legal status of organisations engaged in humanitarian activities into line with the legislation.'
    - h: Tracking Table of Procedures to Facilitate Humanitarian Access (up to August 2026)
      toc: Tracking Table of Procedures to Facilitate Humanitarian Access (up to August 2026)
      level: 1
      id: s6-3
    - p: EKLENECEK
    - h: Border Crossings Approved for Humanitarian Access in Sudan
      toc: Border Crossings Approved for Humanitarian Access in Sudan
      level: 1
      id: s6-4
    - p: EKLENECEK
    - p: In line with the decision of the Transitional Sovereignty Council, the principles of the Jeddah Declaration issued in May 2023, the National Policy on Internal Displacement of 2009 and the Humanitarian Work Guidelines and Procedures of 2016, the Government of Sudan approved a total of 14 land, air and river border crossings and entry points for humanitarian aid shipments in order to fulfil its responsibilities towards displaced persons, returnees and war-affected host communities. This increased the number of approved points by 12. Points 1–7 were recorded as crossing points actively used for the entry of humanitarian aid into the country in January–August 2026.
    - p: In addition, there are around 6,000 internal routes used for humanitarian aid shipments. These routes cover 773 administrative units in 18 states and facilitate the delivery of humanitarian aid to the areas where it is needed. This aid also includes humanitarian supplies in the areas of health, education, water and environmental health. The approved border crossings and entry points are listed below.
    - h: Approved Border Crossings and Entry Points
      toc: Approved Border Crossings and Entry Points
      level: 1
      id: s6-5

    - p: وطوال هذه الفترة نشأت فجوة تمويلية كبيرة بين الموارد المخصصة للمساعدات الإنسانية واحتياجات القطاعات المختلفة، وبحسب النص المصدر تجاوزت هذه الفجوة 60% في بعض المجالات. ونتيجة لذلك، لم يتمكن نحو 15.8 مليون شخص من الاستفادة من المساعدات الإنسانية متعددة القطاعات خلال الفترة من يناير إلى أغسطس 2026.
    - p: ورغم ذلك، أُحرز تقدم ملموس بفضل جهود الدولة لتوسيع مناطق الحماية والمناطق الآمنة، ومبادراتها لتسهيل إيصال المساعدات الإنسانية إلى المحتاجين، والتنسيق بين المؤسسات. وبمساهمة وكالات الأمم المتحدة والشركاء الإنسانيين والدول الشقيقة والصديقة، وصلت المساعدات الإنسانية خلال هذه الفترة إلى أكثر من 11.5 مليون شخص.
    - p: وخلال الفترة نفسها، سُجّل إيصال نحو 325,000 طن متري من المساعدات الإنسانية في مجالات الأمن الغذائي والصحة والتعليم والمياه والإغاثة العاجلة. وبلغ إجمالي قيمة الأعمال المنفذة ضمن الأنشطة الإنسانية للأمم المتحدة 1.17 مليار دولار. ويعرض الجدول أدناه التمويل المقدَّم ونسب التغطية حسب القطاع.

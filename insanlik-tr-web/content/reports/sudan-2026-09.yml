    - h: B. Summary of Sudan’s National Humanitarian Aid Efforts (January–August 2026)
      toc: B. Summary of Sudan’s National Humanitarian Aid Efforts (January–August 2026)
      level: 1
      id: s4-4
    - p: The Government of Sudan has taken responsibility for reducing the humanitarian funding gap and meeting the needs of its citizens affected by the war-induced crisis. Accordingly, more than 52% of the needs of the displaced, those returning to their home areas and others affected by the war have been met.
    - p: Aid was delivered through the initiative of the President of the Sovereignty Council, the Federal Ministry of Finance, public institutions at federal and state level, local community initiatives, Sudanese living abroad and national companies providing support as part of corporate social responsibility.
    - p: These efforts were carried out in line with Article 6(d) of the Voluntary and Humanitarian Work (Organisation) Act of 2006 and Articles 3 and 5 of the National Policy for Internally Displaced Persons of 2009. They were also based on Principles 25 and 1 of the UN Guiding Principles on Internal Displacement of 1998.
    - p: In this context, a total of 2,585,500 metric tonnes of humanitarian aid covering different sectors was delivered to more than 6.9 million people living in areas with acute humanitarian needs. Priority was given in particular to those displaced from the Greater Darfur and Greater Kordofan regions. Details of the aid sources and their distribution are given in the table below.

  sections:
  - kind: context
    kicker: MEVCUT DURUM
    title: "Sudan’daki İnsani Duruma Genel Bakış"
    text: "Sudan’da 15 Nisan 2023’ten bu yana devam eden savaş ve isyancı milislerin sivillere yönelik yaygın ihlalleri, ülkeyi son derece ağır ve çok boyutlu bir insani krize sürüklemiştir. İsyancı milisler, ülke genelindeki altyapının yaklaşık yüzde 55’ini sistematik biçimde tahrip etmiştir. Hastaneler, okullar, içme suyu kaynakları, enerji tesisleri ve kanalizasyon şebekeleri başta olmak üzere, temel hizmetlerin sunulduğu çok sayıda tesis yakılmış veya kullanılamaz hâle getirilmiştir. Uluslararası toplumun sivilleri isyancı milislerin saldırılarından korumakta yetersiz kalması, Sudan’daki insani krizin daha da derinleşmesine yol açmıştır. Bilinen bazı ülkeler tarafından desteklenen isyancı milislerin saldırıları sonucunda yaklaşık 13,8 milyon kişi, yani Sudan nüfusunun %32’si, uluslararası insancıl hukuk kapsamında suç teşkil eden eylemlere maruz kalmıştır. Büyük Darfur ve Büyük Kordofan bölgelerindeki eyaletler ile Mavi Nil Bölgesi’nin bazı kesimlerinde yaşayan her beş kişiden üçü, uluslararası insan hakları hukukuna göre suç sayılan en az bir eylemin mağduru olmuştur. Raporda toplam 16 tür ihlal ve suçtan söz edilmektedir. Bunlar arasında sivillerin zorla yerinden edilmesi, bir savaş yöntemi olarak aç bırakılması, keyfî biçimde gözaltına alınması ve infaz edilmesi, canlı kalkan olarak kullanılması, mallarının yağmalanması, cinsel köleleştirme, savaş silahı olarak tecavüz ve diğer ağır ihlaller yer almaktadır."
    tables:
    - title: "Ağustos 2026 İtibarıyla Kuzey Kordofan Eyaleti’nde Sivillere Yönelik İhlaller"
      head: ["No.", "Bölge", "Gerçekleştirilen İhlaller", "Etkilenen Aile Sayısı"]
      rows:
      - ["1", "Şeykan", "29 köyde yağma ve talan yaşanmış; aralarında kadın ve çocukların da bulunduğu 55 sivil öldürülmüş, 200’den fazla zorla kaybetme vakası kaydedilmiş ve yüzlerce kişi yaralanmıştır.", "60.000 aile"]
      - ["2", "Cebra eş-Şeyh", "En-Nedirâbe, Cebra el-Medîne, Hamrat el-Vez, el-Hicâb ve Kejmer olmak üzere beş idari birimde halk zorla yerinden edilmiştir. Yedi su istasyonu tahrip edilmiş, 100 binden fazla büyükbaş ve küçükbaş hayvan yağmalanmış ve 220 sivil öldürülmüştür.", "38.000 aile"]
      - ["3", "Bârâ", "Ümmü Kurfa, Ümmü Siyâle, Cüreych ve diğer bölgeleri kapsayan beş idari birimde siviller zorla yerinden edilmiştir. 22 su kaynağı tahrip edilmiş, aralarında kadınların, çocukların ve yaşlıların da bulunduğu 88 sivil öldürülmüş, ayrıca halkın malları yağmalanmıştır.", "58.000 aile"]
      - ["4", "Batı Bârâ", "Ümmü Sa‘dûn, Ümmü Kureydim, Demîre et-Tûm ve el-Mezrûb başta olmak üzere çeşitli idari birimlerde siviller zorla yerinden edilmiştir. Mallar, 30 bin baş hayvan ve araçlar yağmalanmış, tarım ürünleri tahrip edilmiş ve aralarında 53 kadın, 28 yaşlı kadın ve 16 çocuğun bulunduğu siviller öldürülmüştür.", "12.000 aile"]
      - ["5", "Sûdrî", "Köyler işgal edilmiş, yerel halk zorla yerinden edilmiş ve bölgeye yabancı paralı savaşçılar yerleştirilmiştir. Halkın malları ve tarım ürünleri yağmalanmıştır.", "7.000 aile"]
    - title: "Ağustos 2026 İtibarıyla Sudan Genelinde Sivillere Yönelik İhlaller"
      head: ["İhlal Türü", "Kaynakta Belirtilen Hukuki Dayanak", "Tahmini Etkilenen Kişi Sayısı"]
      rows:
      - ["Sivillerin canlı kalkan olarak kullanılması", "Sudan’da Sivillerin Korunmasına İlişkin Cidde Taahhüt Bildirgesi, Madde 2(C)", "3.600.000"]
      - ["Keyfî gözaltı", "Sudan’da Sivillerin Korunmasına İlişkin Cidde Taahhüt Bildirgesi, Madde 2(M)", "1.200.000"]

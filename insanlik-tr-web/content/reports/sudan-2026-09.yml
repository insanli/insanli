  sections:
  - kind: context
    kicker: السياق الحالي
    title: نظرة عامة على الوضع الإنساني في السودان
    text: 'تفاقمت الكارثة الإنسانية في السودان عقب التمرد المسلح الذي أطلقته قوات الدعم السريع ضد القوات المسلحة السودانية في منتصف أبريل 2023. وبعد أن عجزت القوات المتمردة عن تحقيق أهدافها العسكرية، وجّهت أكثر من 90 في المئة من هجماتها المسلحة نحو ملايين المدنيين العزّل.


      وأدى عجز المجتمع الدولي عن إلزام القوات المتمردة والدول الداعمة لها بتنفيذ قراري مجلس الأمن الدولي رقم 2736 و1591 وغيرهما من القرارات ذات الصلة بحماية المدنيين إلى بلوغ الأزمة الإنسانية أبعادًا غير مسبوقة. وخلال الأشهر الثمانية الماضية، تدهورت الأوضاع الإنسانية بشكل خطير، ولا سيما في إقليمي كردفان ودارفور وفي أجزاء من إقليم النيل الأزرق.


      وقد زاد صمت الرأي العام الدولي إزاء ما يجري، وتزويد إدارة أبوظبي للمرتزقة بالأسلحة الفتاكة، والهجمات الوحشية للميليشيات المتمردة، من حدة الكارثة الإنسانية في السودان (منحنى المأساة الإنسانية). وفي هذا الأسبوع، بلغت أبعاد الأزمة الإنسانية والانتهاكات التي يتعرض لها المدنيون أخطر مستوياتها. وتُعد هجمات الميليشيات المدججة بالأسلحة الثقيلة التي تهدد أكثر من 3.8 مليون مدني أعزل في ولايات إقليم كردفان الكبرى وفي إقليم النيل الأزرق، وما تخلقه من مخاطر متعددة، أفعالًا ترقى إلى جرائم بموجب القانون الدولي الإنساني والقانون الدولي لحقوق الإنسان.


      ويُظهر كل ذلك أن الكارثة الإنسانية في السودان هي نتيجة نزاع يتسم باختلال شديد في موازين القوة بين أطرافه؛ إذ تقف في جانب ميليشيا عسكرية متمردة، وفي الجانب الآخر النساء والأطفال وكبار السن والمدنيون العزّل.


      ولذلك، من الأهمية بمكان أن يقيّم المجتمع الدولي الكارثة من منظور محايد وموضوعي، وأن يصف الأحداث وفق طبيعتها الحقيقية، وأن يميّز بين مسؤوليات الأطراف. ولا ينبغي التعامل مع ميليشيا متمردة تنتهك القانون الدولي بشكل ممنهج بالطريقة نفسها التي يُتعامل بها مع القوات المسلحة السودانية الملزمة بحماية مواطنيها وصون كرامتهم والدفاع عن بلدها. وتؤدي القوات المسلحة السودانية هذه المهام في إطار قواعد القانون الدولي ذات الصلة، ولا سيما البروتوكول الإضافي الثاني لاتفاقيات جنيف لعام 1977.


      لمحة عن الوضع الإنساني في السودان، أغسطس 2026


      أ. ملخص الوضع الإنساني


      أدت الحرب المستمرة في السودان منذ 15 أبريل 2023 والانتهاكات الواسعة التي ترتكبها الميليشيات المتمردة بحق المدنيين إلى إغراق البلاد في أزمة إنسانية بالغة الشدة ومتعددة الأبعاد. ووفقًا للأمم المتحدة، أدى ذلك إلى تهجير قسري لعدد غير مسبوق من الناس في تاريخ الأزمات الإنسانية.


      ونتيجة للأزمة، أصبح أكثر من 25 مليون شخص كانوا يعتمدون على أنفسهم في السابق بحاجة إلى المساعدات الإنسانية. واضطر نحو 12.5 مليون شخص إلى مغادرة منازلهم أو اللجوء إلى بلدان أخرى. ويشكّل نحو 8.3 مليون منهم نازحين داخليًا لجؤوا إلى ولايات ومناطق أكثر أمانًا داخل البلاد، ومن بين هؤلاء نزح نحو 4.3 مليون شخص من إقليمي دارفور الكبرى وكردفان الكبرى. إضافة إلى ذلك، لجأ نحو 4.2 مليون شخص إلى دول الجوار أو إلى بلدان أخرى.


      ومع تحسّن الأوضاع الأمنية في بعض أنحاء البلاد، عاد نحو 5.8 مليون نازح ولاجئ إلى السودان حتى أغسطس 2026. ودمّرت الميليشيات المتمردة بشكل ممنهج نحو 55 في المئة من البنية التحتية في البلاد. وأُحرقت أو أصبحت غير صالحة للاستخدام منشآت عديدة تقدّم الخدمات الأساسية، وفي مقدمتها المستشفيات والمدارس ومصادر مياه الشرب ومنشآت الطاقة وشبكات الصرف الصحي.


      ب. الحصيلة الثقيلة للحرب على المدنيين في السودان


      أدى عجز المجتمع الدولي عن حماية المدنيين من هجمات الميليشيات المتمردة إلى تعميق الأزمة الإنسانية في السودان. ووفقًا لتقارير تستند إلى بيانات موضوعية من الميدان، أصبح السودان من أبرز دول العالم من حيث عدد المدنيين الذين انتُهكت حقوقهم وتعرضوا لجرائم مختلفة بسبب هجمات الميليشيات المتمردة.


      ونتيجة لهجمات الميليشيات المتمردة المدعومة من دول معروفة، تعرّض نحو 13.8 مليون شخص، أي 32% من سكان السودان، لأفعال تُعد جرائم بموجب القانون الدولي الإنساني. وكان ثلاثة من كل خمسة أشخاص يعيشون في ولايات إقليمي دارفور الكبرى وكردفان الكبرى وفي أجزاء من إقليم النيل الأزرق ضحايا لفعل واحد على الأقل يُعد جريمة بموجب القانون الدولي لحقوق الإنسان.


      ويشير التقرير إلى ما مجموعه 16 نوعًا من الانتهاكات والجرائم. ومن بينها التهجير القسري للمدنيين، والتجويع كأسلوب من أساليب الحرب، والاحتجاز التعسفي والإعدام، واستخدامهم دروعًا بشرية، ونهب ممتلكاتهم، والاستعباد الجنسي، والاغتصاب كسلاح حرب، وغيرها من الانتهاكات الجسيمة.'

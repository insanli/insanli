  - title: عمليات المساعدات الإنسانية في السودان
    blocks:
    - h: أ. الوضع العام للمساعدات الإنسانية الدولية للسودان (أبريل 2023 – أغسطس 2026)
      toc: أ. الوضع العام للمساعدات الإنسانية الدولية للسودان (أبريل 2023 – أغسطس 2026)
      level: 1
      id: s4-1
    - p: في الأشهر الأولى التي أعقبت اندلاع الحرب في السودان، تراجعت الأنشطة الإنسانية بنحو 80%، وانخفضت قدرة الاستجابة لدى وكالات الأمم المتحدة والمنظمات الدولية والإقليمية والأجنبية العاملة في البلاد إلى نحو 20%.
    - p: وبفضل التسهيلات والترتيبات التي وفّرتها الدولة، نفّذت هذه المنظمات أعمالًا مهمة للوصول إلى المحتاجين في مختلف مجالات الأزمة. غير أن هذه الجهود لم تكن كافية لتلبية احتياجات الأزمة الإنسانية التي تفاقمت وتتطلب استجابة شاملة، ولا سيما في إقليمي دارفور الكبرى وكردفان الكبرى.
    - p: ومن أبرز أسباب ذلك عدم كفاية التمويل الإنساني الدولي للسودان، إذ بلغت فجوة التمويل في عام 2025 نحو 60%، وهو من أدنى مستويات الدعم الدولي المسجلة للبلاد.
    - p: يبيّن الجدول أدناه مبالغ التمويل المطلوبة والمقدَّمة لخطط الاستجابة الإنسانية بين عامي 2023 و2026.
    - h: التمويل المقدَّم في إطار خطة الاستجابة الإنسانية للسودان (منتصف أبريل 2023 – منتصف أغسطس 2026)

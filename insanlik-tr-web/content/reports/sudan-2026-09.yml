  - title: التحديات التي تواجه عمليات المساعدات الإنسانية
    blocks:
    - h: التحديات التي تواجه جهود الاستجابة الإنسانية في السودان
      toc: التحديات التي تواجه جهود الاستجابة الإنسانية في السودان
      level: 1
      id: s7-1
    - p: 1. عدم توصيف أسباب الكارثة الإنسانية في السودان بصورة موضوعية.
    - p: 2. عدم التزام المنظمات الإنسانية العاملة في السودان التزامًا كاملًا بمبادئ الحياد والشفافية والاستقلالية وعدم التمييز التي تتبناها الأمم المتحدة.
    - p: 3. عجز المجتمع الدولي عن إلزام القوات المتمردة بمبادئ إعلان جدة لحماية المدنيين في السودان المعتمد في مايو 2023.
    - p: 4. مسألة مدى احترام المنظمات الإنسانية للسيادة الوطنية للسودان وفقًا للمبادئ التوجيهية للأمم المتحدة.
    - p: 5. عدم كفاية التمويل الإنساني الدولي مقارنةً بحجم الأزمة في السودان التي وصفتها الأمم المتحدة بأنها من أشد الأزمات الإنسانية في العالم.
    - p: 6. تزايد نهب القوات المتمردة للمساعدات الإنسانية واستخدامها لأغراض عسكرية.
    - p: 7. استغلال القوات المتمردة للمعابر الحدودية المخصصة لشحنات المساعدات الإنسانية في إدخال الأسلحة واستخدامها ضد المدنيين العزّل.
    - p: 8. استمرار هجمات القوات المتمردة على العاملين في المجال الإنساني ونهبها لأصول وممتلكات المنظمات الإنسانية.
    toc: التحديات التي تواجه عمليات المساعدات الإنسانية
  - title: توصيات لتحسين الوضع الإنساني
    blocks:
    - h: بعض التوصيات لتحسين الوضع الإنساني في السودان
      toc: بعض التوصيات لتحسين الوضع الإنساني في السودان
      level: 1
      id: s8-1
    - p: 1. تعزيز التعاون والشراكات في المجال الإنساني مع الدول الشقيقة والصديقة عبر السفراء المعتمدين لدى السودان، إذ قدّمت هذه الدول إسهامات مهمة في تلبية الاحتياجات الإنسانية للنازحين والمجتمعات المتأثرة بالحرب.
    - p: 2. اضطلاع المجتمع الدولي بمسؤولياته في إلزام الدول الداعمة للتمرد العسكري بوقف شحنات الأسلحة التي يُشار إلى استخدامها ضد المدنيين العزّل، وفي هذا الإطار يجب تنفيذ قرار الأمم المتحدة رقم 1591 لسنة 2005.
    - p: 3. اتساق أنشطة المساعدات التي تنفذها وكالات الأمم المتحدة والمنظمات الإنسانية مع قرار الأمم المتحدة رقم 58/114 الذي ينص على استقلال الأهداف الإنسانية عن الأهداف العسكرية والسياسية.
    - p: 4. اضطلاع مفوضية الأمم المتحدة السامية لشؤون اللاجئين، وفقًا لنظامها الأساسي لسنة 1950، بمسؤولياتها القانونية تجاه اللاجئين السودانيين الذين يواجهون صعوبات غير مسبوقة في دول الجوار، وتوفير الحماية والمساعدات الإنسانية التي يحتاجونها.
    - p: 5. تنفيذ أنشطة المساعدات الإنسانية في السودان بما يتوافق مع قرار الأمم المتحدة رقم 46/182 لسنة 1991 الذي ينص على احترام السيادة الوطنية للدول، وبما يسهم في الحفاظ على وحدة السودان وسلامة أراضيه.
    - p: 6. إخراج المرتزقة التابعين لقوات الدعم السريع من منازل المدنيين ومنع استخدامها لأغراض عسكرية، وذلك وفقًا لمبادئ الأمم المتحدة لسنة 2005 بشأن رد المساكن والممتلكات إلى المدنيين النازحين.
    - p: 7. زيادة التمويل الدولي المقدَّم للسودان في مختلف مجالات المساعدات الإنسانية بما يتناسب مع حجم الأزمة الإنسانية في البلاد.
    toc: توصيات لتحسين الوضع الإنساني

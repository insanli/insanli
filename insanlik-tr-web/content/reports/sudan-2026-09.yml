  summary: لا يزال السودان يواجه واحدة من أشد الأزمات الإنسانية في العالم، نتيجة النزاع الممتد والنزوح الواسع وانعدام الأمن الغذائي الحاد وتفشي الأمراض وتعطل الخدمات الأساسية. وتبقى الاحتياجات الإنسانية مرتفعة بصورة استثنائية، فيما تحدّ الأوضاع الأمنية وصعوبات الوصول من…

    - p: Throughout the period, a significant funding gap emerged between the resources allocated to humanitarian aid and the needs of different sectors; according to the source text, this gap exceeded 60% in some areas. As a result, around 15.8 million people were unable to benefit from multi-sector humanitarian assistance in January–August 2026.
    - p: Nevertheless, significant progress was made thanks to the state’s efforts to expand protected areas and safe zones, its initiatives to facilitate the delivery of humanitarian aid to those in need, and coordination between institutions. With contributions from UN agencies, aid partners and friendly and brotherly countries, humanitarian aid reached more than 11.5 million people during this period.
    - p: During the same period, around 325,000 metric tonnes of humanitarian aid were recorded as delivered in the areas of food security, health, education, water and emergency relief. The total value of the work carried out under UN humanitarian activities reached $1.17 billion. The funding provided by sector and the coverage rates are presented in the table below.

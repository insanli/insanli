  - title: İnsani Yardım Çalışmalarında Karşılaşılan Zorluklar
    toc: İNSANİ YARDIM ÇALIŞMALARINDA KARŞILAŞILAN ZORLUKLAR
    blocks:
    - h: Sudan’daki İnsani Yardım Müdahale Çalışmalarının Karşılaştığı Zorluklar
      toc: Sudan’daki İnsani Yardım Müdahale Çalışmalarının Karşılaştığı Zorluklar
      level: 1
      id: s7-1
    - p: 1. Sudan’daki insani felaketin nedenlerinin nesnel bir şekilde ortaya konulamaması.
    - p: 2. Sudan’da faaliyet gösteren insani yardım kuruluşlarının, Birleşmiş Milletler tarafından benimsenen tarafsızlık, şeffaflık, bağımsızlık ve ayrım gözetmeme ilkelerini tam olarak uygulayamaması.
    - p: 3. Uluslararası toplumun, isyancı güçleri Mayıs 2023’te kabul edilen Sudan’da Sivillerin Korunmasına İlişkin Cidde Bildirgesi’nin ilkelerine uymaya zorlayamaması.
    - p: 4. İnsani yardım kuruluşlarının, Birleşmiş Milletler’in yol gösterici ilkeleri doğrultusunda Sudan’ın ulusal egemenliğine ne ölçüde saygı gösterdiği meselesi.
    - p: 5. Birleşmiş Milletler tarafından dünyanın en ağır insani krizlerinden biri olarak nitelendirilen Sudan’daki krizin boyutlarıyla uluslararası insani yardım finansmanının yetersiz kalması.
    - p: 6. İnsani yardımların isyancı güçler tarafından giderek daha fazla yağmalanması ve askerî amaçlarla kullanılması.
    - p: 7. İsyancı güçlerin, insani yardım sevkiyatları için kullanılan sınır kapılarını silah sokmak ve bu silahları savunmasız sivillere karşı kullanmak amacıyla istismar etmesi.
    - p: 8. İsyancı güçlerin insani yardım çalışanlarına yönelik saldırılarını sürdürmesi ve insani yardım kuruluşlarının varlıklarını ve mülklerini yağmalaması.
  - title: İnsani Durumun İyileştirilmesine Yönelik Öneriler
    toc: İNSANİ DURUMUN İYİLEŞTİRİLMESİNE YÖNELİK ÖNERİLER
    blocks:
    - h: Sudan’daki İnsani Durumun İyileştirilmesine Yönelik Bazı Öneriler
      toc: Sudan’daki İnsani Durumun İyileştirilmesine Yönelik Bazı Öneriler
      level: 1
      id: s8-1
    - p: 1. Sudan’da görev yapan büyükelçiler aracılığıyla kardeş ve dost ülkelerle insani yardım alanındaki iş birliğinin ve ortaklıkların güçlendirilmesi. Bu ülkeler, yerinden edilmiş kişilerin ve savaştan etkilenen toplulukların insani ihtiyaçlarının karşılanmasına önemli katkılarda bulunmuştur.
    - p: 2. Uluslararası toplumun, askerî isyanı destekleyen ülkeleri silah sevkiyatlarını durdurmaya zorlamak üzere sorumluluklarını yerine getirmesi. Söz konusu silahların savunmasız sivillere karşı kullanıldığı belirtilmekte olup bu çerçevede Birleşmiş Milletler’in 2005 tarihli 1591 sayılı kararının uygulanması gerekmektedir.
    - p: 3. Birleşmiş Milletler kuruluşları ve insani yardım örgütleri tarafından yürütülen yardım faaliyetlerinin, insani amaçların askerî ve siyasi hedeflerden bağımsızlığını öngören Birleşmiş Milletler’in 58/114 sayılı kararıyla uyumlu olması.
    - p: 4. Birleşmiş Milletler Mülteciler Yüksek Komiserliği’nin, 1950 tarihli statüsü uyarınca, komşu ülkelerde benzeri görülmemiş zorluklarla karşı karşıya kalan Sudanlı mültecilerle ilgili hukuki sorumluluklarını yerine getirmesi; mültecilerin ihtiyaç duyduğu koruma ve insani yardımın sağlanması.
    - p: 5. Sudan’daki insani yardım faaliyetlerinin, devletlerin ulusal egemenliğine saygı gösterilmesini öngören Birleşmiş Milletler’in 1991 tarihli 46/182 sayılı kararıyla uyumlu yürütülmesi. Bu yaklaşımın Sudan’ın birliğinin ve toprak bütünlüğünün korunmasına katkıda bulunması.
    - p: 6. Hızlı Destek Kuvvetleri’ne bağlı paralı askerlerin sivillere ait evlerden çıkarılması ve bu evlerin askerî amaçlarla kullanılmasının önlenmesi. Bunun, yerinden edilmiş sivillerin konut ve mülklerinin iadesine ilişkin 2005 tarihli Birleşmiş Milletler ilkeleri doğrultusunda gerçekleştirilmesi.
    - p: 7. Sudan’daki insani krizin boyutlarıyla orantılı olacak şekilde, insani yardımın farklı alanlarında ülkeye sağlanan uluslararası finansmanın artırılması.
en:
  country_name: Sudan
  title: Sudan Humanitarian Situation Report
  period_label: January – August 2026
  sources: []
  summary: Since 15 April 2023, the ongoing war and the widespread violations committed by rebel militias against civilians have plunged Sudan into an extremely severe and multidimensional humanitarian crisis.
  sections:
  - title: Humanitarian Situation in Sudan
    blocks:
    - h: The Current State of the Humanitarian Catastrophe in Sudan
      toc: The Current State of the Humanitarian Catastrophe in Sudan
      level: 1
      id: s1-1
    - p: The humanitarian catastrophe in Sudan deepened following the armed rebellion launched by the Rapid Support Forces against the Sudanese Armed Forces in mid-April 2023. Having failed to achieve their military objectives, the rebel forces directed more than 90 per cent of their armed attacks against millions of defenceless civilians.
    - p: The international community’s failure to compel the rebel forces and the countries supporting them to implement UN Security Council resolutions 2736 and 1591 and other relevant resolutions on the protection of civilians has caused the humanitarian crisis to reach unprecedented proportions. Over the past eight months, humanitarian conditions have deteriorated severely, above all in the Kordofan and Darfur regions and in parts of the Blue Nile region.
    - p: The silence of international public opinion, the supply of lethal weapons to mercenaries by the Abu Dhabi administration and the brutal attacks of the rebel militias have further aggravated the humanitarian catastrophe in Sudan (Humanitarian Tragedy Curve). This week, the scale of the humanitarian crisis and the violations suffered by civilians reached their most critical level. The attacks by heavily armed militias threatening more than 3.8 million defenceless civilians in the states of the Greater Kordofan region and in the Blue Nile region, and the multiple risks they create, constitute acts that amount to crimes under international humanitarian law and international human rights law.
    - p: All of this shows that the humanitarian catastrophe in Sudan is the result of a conflict marked by a severe imbalance of power between a rebel military militia on one side and women, children, the elderly and unarmed civilians on the other.
    - p: It is therefore of great importance that the international community assess the catastrophe impartially and objectively, define events according to their true nature and distinguish between the responsibilities of the parties. A rebel militia that systematically violates international law should not be treated in the same way as the Sudanese Armed Forces, which are obliged to protect their citizens, safeguard their dignity and defend their country. The Sudanese Armed Forces carry out these duties within the framework of the relevant rules of international law, above all Additional Protocol II of 1977 to the Geneva Conventions.
    - h: Overview of the Humanitarian Situation in Sudan (as of August 2026)
      toc: Overview of the Humanitarian Situation in Sudan (as of August 2026)
      level: 1
      id: s1-2
    - h: A. Summary of the Humanitarian Situation
      toc: A. Summary of the Humanitarian Situation
      level: 2
      id: s1-3
    - p: Since 15 April 2023, the ongoing war and the widespread violations committed by rebel militias against civilians have plunged Sudan into an extremely severe and multidimensional humanitarian crisis. According to the United Nations, this has led to the forced displacement of an unprecedented number of people in the history of humanitarian crises.
    - p: As a result of the crisis, more than 25 million people who were previously able to support themselves have come to depend on humanitarian aid. Around 12.5 million people have been forced to leave their homes or seek refuge in other countries. Of these, around 8.3 million are internally displaced persons who have taken refuge in safer states and regions within the country. Around 4.3 million of this group were displaced from the Greater Darfur and Greater Kordofan regions. In addition, around 4.2 million people have sought refuge in neighbouring or other countries.
    - p: With the improvement of security conditions in some parts of the country, around 5.8 million displaced persons and refugees had returned to Sudan as of August 2026. The rebel militias have systematically destroyed around 55 per cent of the country’s infrastructure. Many facilities providing basic services, above all hospitals, schools, drinking-water sources, power plants and sewage networks, have been burned or rendered unusable.
    - h: B. The Heavy Toll of the War on Civilians in Sudan
      toc: B. The Heavy Toll of the War on Civilians in Sudan
      level: 2
      id: s1-4
    - p: The international community’s failure to protect civilians from rebel militia attacks has further deepened the humanitarian crisis in Sudan. According to reports based on objective data from the field, Sudan has become one of the leading countries in the world in terms of the number of civilians whose rights have been violated and who have been subjected to various crimes as a result of rebel militia attacks.
    - p: As a result of attacks by rebel militias backed by certain known countries, around 13.8 million people – 32% of Sudan’s population – have been subjected to acts that constitute crimes under international humanitarian law. Three out of every five people living in the states of Greater Darfur and Greater Kordofan and in parts of the Blue Nile region have been victims of at least one act considered a crime under international human rights law.
    - p: The report documents a total of 16 types of violations and crimes. These include the forced displacement of civilians, starvation as a method of warfare, arbitrary detention and execution, use as human shields, looting of property, sexual slavery, rape as a weapon of war and other grave violations. The tables below set out in detail the human toll of the war on civilians.

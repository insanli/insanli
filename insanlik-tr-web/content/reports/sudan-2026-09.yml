  - kind: priorities
    kicker: RESPONSE FOCUS
    title: Overview of the International Humanitarian Response
    text: 'In the first months after the war began, humanitarian activities fell by about 80%, and the response capacity of United Nations agencies and international, regional and foreign aid organisations operating in the country dropped to about 20%. Thanks to the facilitation and arrangements provided by the state, these organisations carried out significant work to reach people in need, but these efforts were not enough to meet the needs of the worsening humanitarian crisis, especially in the Greater Darfur and Greater Kordofan regions. One of the main reasons is the shortfall in international humanitarian funding for Sudan: the funding gap reached about 60% and exceeded this level in some sectors. As a result, around 15.8 million people could not benefit from multi-sector humanitarian assistance. Nevertheless, significant progress was made thanks to the state’s efforts to expand protected areas and safe zones, initiatives that facilitated the delivery of aid and coordination between institutions; with contributions from United Nations agencies, aid partners and friendly and brotherly countries, humanitarian assistance reached more than 11.5 million people. Around 325,000 metric tonnes of humanitarian aid were delivered in food security, health, education, water and emergency relief, and the total value of the United Nations’ humanitarian activities reached 1.17 billion dollars.


      The Government of Sudan has taken on responsibility for reducing the humanitarian funding gap and meeting the needs of its citizens affected by the crisis caused by the war. In this regard, more than 52% of the needs of displaced people, those returning to their home areas and others affected by the war have been met. Aid has been delivered through an initiative of the Chairman of the Sovereignty Council, the Federal Ministry of Finance, federal and state public institutions, local community initiatives, Sudanese living abroad and national companies providing support through corporate social responsibility. In this context, a total of 2,585,500 metric tonnes of humanitarian aid covering different sectors was delivered to more than 6.9 million people living in areas with high humanitarian needs. Priority was given in particular to people displaced from the Greater Darfur and Greater Kordofan regions.'

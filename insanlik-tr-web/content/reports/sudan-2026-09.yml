  - title: İnsani Yardımların Ulaştırılması ve Erişim Kolaylıkları
    toc: İNSANİ YARDIMLARIN ULAŞTIRILMASI VE ERİŞİM KOLAYLIKLARI
    blocks:
    - h: Sudan’ın İnsani Yardımların Ulaştırılmasını Kolaylaştırmaya Yönelik Çalışmaları
      toc: Sudan’ın İnsani Yardımların Ulaştırılmasını Kolaylaştırmaya Yönelik Çalışmaları
      level: 1
      id: s6-1
    - p: Ocak–Ağustos 2026
    - p: Sudan Hükümeti, anayasal görevleri ve vatandaşlarına karşı sorumlulukları doğrultusunda, 2006 tarihli Gönüllü ve İnsani Çalışmaları Düzenleme Kanunu ile uluslararası insancıl hukuk ve uluslararası insan hakları hukukunun ilkeleri çerçevesinde, ülkede yaşanan insani krizin olumsuz etkilerini gidermek için gerekli adımları atmıştır.
    - p: Hükümet, insani yardım kuruluşlarının ihtiyaç sahiplerine ulaşabilmesi için gerekli kolaylıkları sağlamış, güvenli bölgelerin kapsamını genişletmiş, sivillerin korunması için tedbirler almış ve yerinden edilmiş kişiler ile mültecilerin gönüllü olarak geri dönmelerini desteklemiştir. Bu kapsamda, Haziran 2026 sonuna kadar yaklaşık 5,8 milyon kişinin yaşadığı bölgelere geri döndüğü kaydedilmiştir. Bu sayının Aralık 2026 sonuna kadar yaklaşık 7,9 milyona ulaşması beklenmektedir.
    - p: Hükümetin insani yardımların ulaştırılmasını kolaylaştırmak amacıyla yürüttüğü çalışmalar aşağıda özetlenmiştir.
    - h: A. İnsani Yardımların Ulaştırılmasını Kolaylaştıran İşlemler
      toc: A. İnsani Yardımların Ulaştırılmasını Kolaylaştıran İşlemler
      level: 1
      id: s6-2
    - p: '1. Gümrük ve vergi muafiyetleri: İnsani yardım faaliyetleri kapsamında ülkeye getirilen tüm malzemeler gümrük vergileri, diğer vergiler ve ilgili ücretlerden muaf tutulmuştur. Haziran 2027’ye kadar sağlanan bu muafiyetlerin toplam değerinin yaklaşık 7,5 milyon dolar olduğu belirtilmiştir.'
    - p: '2. Yardımların nakliye giderlerinin karşılanması: Dost ülkelerden ve bazı insani yardım kuruluşlarından gelen yardımların Sudan’ın tüm eyaletlerine ulaştırılması için nakliye masrafları karşılanmıştır. Haziran 2026’ya kadar bu amaçla yapılan harcamaların yaklaşık 1,8 milyon dolar olduğu belirtilmiştir.'
    - p: '3. İdari ve teknik işlemlerin yürütülmesi: Haziran 2026’ya kadar, insani yardımların ulaştırılmasını kolaylaştırmak amacıyla federal ve eyalet düzeylerinde 35.500’ün üzerinde idari ve teknik işlem gerçekleştirilmiştir. Bu işlemler arasında giriş vizelerinin düzenlenmesi, gümrük ve vergi muafiyetlerinin sağlanması, insani yardım çalışanlarına hareket izinlerinin verilmesi, yardım sevkiyatlarının onaylanması, kuruluşların kayıtlarının yenilenmesi ve kuruluşlar adına banka hesaplarının açılması yer almaktadır. İşlemlerde genel onay oranı %99,6 olarak gerçekleşmiştir.'
    - p: '4. Sınır geçiş noktalarının artırılması: İnsani yardımların ulaştırılmasında kullanılan kara, hava, deniz ve nehir geçiş noktalarının sayısı 2’den 14’e çıkarılmıştır. Bu noktalardan biri olan Adre sınır kapısının açılış tarihlerinin düzenli olarak belirlenmesi konusunda Sudan Hükümeti taahhütte bulunmuştur.'
    - p: '5. BM insani yardım planlarının ulusal önceliklerle uyumlaştırılması: Birleşmiş Milletlerin 2026 yılı insani ihtiyaç ve müdahale planlarının Sudan’ın ulusal öncelikleri ve egemenliğiyle uyumlu olması için çalışmalar yürütülmüştür. Bu kapsamda Komisyon, BM’nin insani yardım planlarına ilişkin ulusal teknik koordinasyon mekanizmasına başkanlık etmiştir.'
    - p: '6. Saha değerlendirmeleri: İnsani ihtiyaçların belirlenmesi amacıyla 10 eyalette 8 saha çalışması gerçekleştirilmiştir.'
    - p: '7. İnsani yardım kuruluşlarının yasal durumlarının düzenlenmesi: İnsani yardım faaliyetlerinde bulunan kuruluşların yasal statülerinin mevzuata uygun hâle getirilmesi için gerekli çalışmalar yürütülmüştür.'
    - h: İnsani Yardıma Erişimi Kolaylaştırmaya Yönelik İşlemlerin İzleme Tablosu (Ağustos 2026’ya Kadar)
      toc: İnsani Yardıma Erişimi Kolaylaştırmaya Yönelik İşlemlerin İzleme Tablosu
      level: 1
      id: s6-3
    - p: EKLENECEK
    - h: Sudan’da İnsani Yardım Erişimi İçin Onaylanan Sınır Kapıları
      toc: Sudan’da İnsani Yardım Erişimi İçin Onaylanan Sınır Kapıları
      level: 1
      id: s6-4
    - p: EKLENECEK
    - p: Geçiş Dönemi Egemenlik Konseyi’nin kararı, Mayıs 2023’te yayımlanan Cidde Bildirgesi’nin ilkeleri, 2009 tarihli Ulusal Yerinden Edilme Politikası ile 2016 tarihli İnsani Yardım Çalışmaları Yönerge ve Usulleri doğrultusunda Sudan Hükümeti, yerinden edilmiş kişilere, geri dönenlere ve savaştan etkilenen ev sahibi topluluklara karşı sorumluluklarını yerine getirmek amacıyla insani yardım sevkiyatlarında kullanılmak üzere kara, hava ve nehir yolu üzerindeki toplam 14 sınır kapısını ve giriş noktasını onaylamıştır. Böylece onaylanan noktaların sayısı 12 artırılmıştır. Bu noktalardan 1–7 numaralı olanlar, Ocak–Ağustos 2026 döneminde insani yardımların ülkeye girişinde aktif olarak kullanılan geçiş noktaları olarak kaydedilmiştir.
    - p: Bunlara ek olarak, insani yardım sevkiyatlarında kullanılan yaklaşık 6.000 iç güzergâh bulunmaktadır. Bu güzergâhlar, 18 eyaletteki 773 idari birimi kapsamakta ve insani yardımların ihtiyaç duyulan bölgelere ulaştırılmasını kolaylaştırmaktadır. Söz konusu yardımlar; sağlık, eğitim, su ve çevre sağlığı alanlarındaki insani yardım malzemelerini de içermektedir. Onaylanan sınır kapıları ve giriş noktaları aşağıda sıralanmıştır.
    - h: Onaylanan Sınır Kapıları ve Giriş Noktaları
      toc: Onaylanan Sınır Kapıları ve Giriş Noktaları
      level: 1
      id: s6-5

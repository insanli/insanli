  title: Sudan İnsani Durum Raporu
  period_label: Ocak – Ağustos 2026
  sources: []
  summary: Sudan’da 15 Nisan 2023’ten bu yana devam eden savaş ve isyancı milislerin sivillere yönelik yaygın ihlalleri, ülkeyi son derece ağır ve çok boyutlu bir insani krize sürüklemiştir.
  sections:
  - title: 1. Sudan’daki İnsani Durum
    toc: SUDAN’DAKİ İNSANİ DURUM
    blocks:
    - h: Sudan’daki İnsani Felaketin Mevcut Durumu
      toc: Sudan’daki İnsani Felaketin Mevcut Durumu
      level: 1
      id: s1-1
    - p: Sudan’da yaşanan insani felaket, Hızlı Destek Kuvvetlerinin Nisan 2023’ün ortalarında Sudan Silahlı Kuvvetlerine karşı başlattığı silahlı isyanın ardından derinleşmiştir. Askerî hedeflerine ulaşamayan isyancı güçler, silahlı saldırılarının yüzde 90’ından fazlasını milyonlarca savunmasız sivile yöneltmiştir.
    - p: Uluslararası toplumun, isyancı güçleri ve onlara destek veren ülkeleri, sivillerin korunmasına ilişkin Birleşmiş Milletler Güvenlik Konseyinin 2736 ve 1591 sayılı kararları ile diğer ilgili kararları uygulamaya zorlayamaması, insani krizin daha önce görülmemiş boyutlara ulaşmasına neden olmuştur. Son sekiz ayda başta Kordofan ve Darfur bölgeleri olmak üzere Mavi Nil Bölgesi’nin bazı kesimlerinde insani koşullar ciddi biçimde kötüleşmiştir.
    - p: Uluslararası kamuoyunun yaşananlar karşısındaki sessizliği, Abu Dabi yönetiminin paralı savaşçılara ölümcül silahlar sağlaması ve isyancı milislerin acımasız saldırıları, Sudan’daki insani felaketi (Humanitarian Tragedy Curve) daha da ağırlaştırmıştır. Bu hafta, insani krizin boyutları ve sivillerin maruz kaldığı ihlaller en kritik seviyeye ulaşmıştır. Ağır silahlarla donatılmış milislerin Büyük Kordofan bölgesindeki eyaletlerde ve Mavi Nil Bölgesi’nde 3,8 milyondan fazla savunmasız sivili tehdit eden saldırıları ve yarattığı çok yönlü riskler, uluslararası insancıl hukuk ve uluslararası insan hakları hukuku kapsamında suç teşkil eden eylemler niteliğindedir.
    - p: Bütün bunlar, Sudan’daki insani felaketin, bir tarafta isyancı bir askerî milis gücünün, diğer tarafta ise kadınların, çocukların, yaşlıların ve silahsız sivillerin bulunduğu; taraflar arasında ciddi bir güç eşitsizliğinin yaşandığı bir çatışmanın sonucu olduğunu göstermektedir.
    - p: Bu nedenle uluslararası toplumun yaşanan felaketi tarafsız ve nesnel bir bakış açısıyla değerlendirmesi, olayları gerçek niteliğine uygun biçimde tanımlaması ve tarafların sorumluluklarını birbirinden ayırması büyük önem taşımaktadır. Uluslararası hukuku sistematik biçimde ihlal eden isyancı bir milis gücü ile vatandaşlarını korumak, onların onurunu gözetmek ve ülkesini savunmakla yükümlü Sudan Silahlı Kuvvetleri aynı şekilde değerlendirilmemelidir. Sudan Silahlı Kuvvetleri bu görevlerini, başta 1977 tarihli ve Cenevre Sözleşmelerine ek II. Protokol olmak üzere ilgili uluslararası hukuk düzenlemeleri çerçevesinde yerine getirmektedir.
    - h: Ağustos 2026 İtibarıyla Sudan’daki İnsani Duruma Genel Bakış
      toc: Ağustos 2026 İtibarıyla Sudan’daki İnsani Duruma Genel Bakış
      level: 1
      id: s1-2
    - h: A. İnsani Durumun Özeti
      toc: A. İnsani Durumun Özeti
      level: 2
      id: s1-3
    - p: Sudan’da 15 Nisan 2023’ten bu yana devam eden savaş ve isyancı milislerin sivillere yönelik yaygın ihlalleri, ülkeyi son derece ağır ve çok boyutlu bir insani krize sürüklemiştir. Birleşmiş Milletlere göre bu süreç, insani krizler tarihinde eşi benzeri görülmemiş sayıda insanın zorla yerinden edilmesine yol açmıştır.
    - p: Kriz nedeniyle, daha önce kendi geçimini sağlayabilen 25 milyondan fazla insan insani yardıma muhtaç hâle gelmiştir. Yaklaşık 12,5 milyon kişi ise evlerini terk etmek veya başka ülkelere sığınmak zorunda kalmıştır. Bunların yaklaşık 8,3 milyonu, ülke içinde daha güvenli eyalet ve bölgelere sığınan yerinden edilmiş kişilerden oluşmaktadır. Bu grubun yaklaşık 4,3 milyonu Büyük Darfur ve Büyük Kordofan bölgelerinden yerinden edilen kişilerdir. Ayrıca yaklaşık 4,2 milyon kişi komşu ülkelere veya diğer ülkelere sığınmıştır.
    - p: Ülkenin bazı bölgelerinde güvenlik koşullarının iyileşmesiyle birlikte, Ağustos 2026 itibarıyla yaklaşık 5,8 milyon yerinden edilmiş kişi ve mülteci Sudan’a geri dönmüştür. İsyancı milisler, ülke genelindeki altyapının yaklaşık yüzde 55’ini sistematik biçimde tahrip etmiştir. Hastaneler, okullar, içme suyu kaynakları, enerji tesisleri ve kanalizasyon şebekeleri başta olmak üzere, temel hizmetlerin sunulduğu çok sayıda tesis yakılmış veya kullanılamaz hâle getirilmiştir.
    - h: B. Sudan’da Savaşın Siviller Üzerindeki Ağır Bilançosu
      toc: B. Sudan’da Savaşın Siviller Üzerindeki Ağır Bilançosu
      level: 2
      id: s1-4
    - p: Uluslararası toplumun sivilleri isyancı milislerin saldırılarından korumakta yetersiz kalması, Sudan’daki insani krizin daha da derinleşmesine yol açmıştır. Sahadan elde edilen nesnel verilere dayanan raporlara göre Sudan, isyancı milislerin saldırıları nedeniyle hakları ihlal edilen ve çeşitli suçlara maruz kalan sivillerin sayısı bakımından dünyada öne çıkan ülkelerden biri hâline gelmiştir.
    - p: Bilinen bazı ülkeler tarafından desteklenen isyancı milislerin saldırıları sonucunda yaklaşık 13,8 milyon kişi, yani Sudan nüfusunun %32’si, uluslararası insancıl hukuk kapsamında suç teşkil eden eylemlere maruz kalmıştır. Büyük Darfur ve Büyük Kordofan bölgelerindeki eyaletler ile Mavi Nil Bölgesi’nin bazı kesimlerinde yaşayan her beş kişiden üçü, uluslararası insan hakları hukukuna göre suç sayılan en az bir eylemin mağduru olmuştur.
    - p: Raporda toplam 16 tür ihlal ve suçtan söz edilmektedir. Bunlar arasında sivillerin zorla yerinden edilmesi, bir savaş yöntemi olarak aç bırakılması, keyfî biçimde gözaltına alınması ve infaz edilmesi, canlı kalkan olarak kullanılması, mallarının yağmalanması, cinsel köleleştirme, savaş silahı olarak tecavüz ve diğer ağır ihlaller yer almaktadır. Aşağıdaki tablolar, savaşın siviller üzerindeki insani bilançosunu ayrıntılı biçimde ortaya koymaktadır.

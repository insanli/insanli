  - title: Challenges Faced in Humanitarian Aid Operations
    blocks:
    - h: Challenges Facing Humanitarian Response Efforts in Sudan
      toc: Challenges Facing Humanitarian Response Efforts in Sudan
      level: 1
      id: s7-1
    - p: 1. The failure to set out the causes of the humanitarian catastrophe in Sudan objectively.
    - p: 2. The failure of humanitarian organisations operating in Sudan to fully apply the principles of neutrality, transparency, independence and non-discrimination adopted by the United Nations.
    - p: 3. The international community’s failure to compel the rebel forces to comply with the principles of the Jeddah Declaration on the Protection of Civilians in Sudan adopted in May 2023.
    - p: 4. The question of the extent to which humanitarian organisations respect Sudan’s national sovereignty in line with the UN guiding principles.
    - p: 5. The inadequacy of international humanitarian funding relative to the scale of the crisis in Sudan, described by the United Nations as one of the most severe humanitarian crises in the world.
    - p: 6. The increasing looting of humanitarian aid by the rebel forces and its use for military purposes.
    - p: 7. The rebel forces’ exploitation of the border crossings used for humanitarian aid shipments to bring in weapons and use them against defenceless civilians.
    - p: 8. The rebel forces’ continued attacks on humanitarian workers and looting of the assets and property of humanitarian organisations.
    toc: CHALLENGES FACED IN HUMANITARIAN AID OPERATIONS
  - title: Recommendations for Improving the Humanitarian Situation
    blocks:
    - h: Some Recommendations for Improving the Humanitarian Situation in Sudan
      toc: Some Recommendations for Improving the Humanitarian Situation in Sudan
      level: 1
      id: s8-1
    - p: 1. Strengthening cooperation and partnerships in the humanitarian field with brotherly and friendly countries through the ambassadors serving in Sudan. These countries have made significant contributions to meeting the humanitarian needs of displaced persons and war-affected communities.
    - p: 2. The international community fulfilling its responsibilities to compel the countries supporting the military rebellion to stop arms shipments. These weapons are reported to be used against defenceless civilians, and in this context UN resolution 1591 of 2005 must be implemented.
    - p: 3. Ensuring that the aid activities of UN agencies and humanitarian organisations are consistent with UN resolution 58/114, which provides for the independence of humanitarian objectives from military and political objectives.
    - p: 4. The Office of the United Nations High Commissioner for Refugees fulfilling its legal responsibilities, under its 1950 Statute, towards Sudanese refugees facing unprecedented difficulties in neighbouring countries, and providing the protection and humanitarian assistance the refugees need.
    - p: 5. Conducting humanitarian aid activities in Sudan in line with UN resolution 46/182 of 1991, which provides for respect for the national sovereignty of states, with this approach contributing to preserving Sudan’s unity and territorial integrity.
    - p: 6. Removing the mercenaries affiliated with the Rapid Support Forces from civilian homes and preventing the use of these homes for military purposes, in line with the 2005 United Nations principles on housing and property restitution for displaced civilians.
    - p: 7. Increasing international funding for Sudan across the different areas of humanitarian aid in proportion to the scale of the humanitarian crisis in the country.
    toc: RECOMMENDATIONS FOR IMPROVING THE HUMANITARIAN SITUATION
ar:
  country_name: السودان
  title: تقرير الوضع الإنساني في السودان
  period_label: يناير – أغسطس 2026
  sources: []
  summary: أدت الحرب المستمرة في السودان منذ 15 أبريل 2023 والانتهاكات الواسعة التي ترتكبها الميليشيات المتمردة بحق المدنيين إلى إغراق البلاد في أزمة إنسانية بالغة الشدة ومتعددة الأبعاد.
  sections:
  - title: الوضع الإنساني في السودان
    blocks:
    - h: الوضع الراهن للكارثة الإنسانية في السودان
      toc: الوضع الراهن للكارثة الإنسانية في السودان
      level: 1
      id: s1-1
    - p: تفاقمت الكارثة الإنسانية في السودان عقب التمرد المسلح الذي أطلقته قوات الدعم السريع ضد القوات المسلحة السودانية في منتصف أبريل 2023. وبعد أن عجزت القوات المتمردة عن تحقيق أهدافها العسكرية، وجّهت أكثر من 90 في المئة من هجماتها المسلحة نحو ملايين المدنيين العزّل.
    - p: وقد أدى عجز المجتمع الدولي عن إلزام القوات المتمردة والدول الداعمة لها بتنفيذ قراري مجلس الأمن الدولي 2736 و1591 وغيرهما من القرارات ذات الصلة بحماية المدنيين إلى بلوغ الأزمة الإنسانية أبعادًا غير مسبوقة. وخلال الأشهر الثمانية الماضية تدهورت الأوضاع الإنسانية بشدة، ولا سيما في إقليمي كردفان ودارفور وفي أجزاء من إقليم النيل الأزرق.
    - p: وقد أدى صمت الرأي العام الدولي إزاء ما يجري، وتزويد إدارة أبوظبي المرتزقة بالأسلحة الفتاكة، والهجمات الوحشية للميليشيات المتمردة، إلى تفاقم الكارثة الإنسانية في السودان (Humanitarian Tragedy Curve). وفي هذا الأسبوع بلغت أبعاد الأزمة الإنسانية والانتهاكات التي يتعرض لها المدنيون أخطر مستوياتها. وتُعد هجمات الميليشيات المدججة بالأسلحة الثقيلة التي تهدد أكثر من 3.8 مليون مدني أعزل في ولايات إقليم كردفان الكبرى وفي إقليم النيل الأزرق، وما تخلقه من مخاطر متعددة، أفعالًا ترقى إلى جرائم بموجب القانون الدولي الإنساني والقانون الدولي لحقوق الإنسان.
    - p: ويُظهر كل ذلك أن الكارثة الإنسانية في السودان هي نتيجة صراع يتسم بخلل كبير في موازين القوة، تقف فيه ميليشيا عسكرية متمردة في طرف، والنساء والأطفال وكبار السن والمدنيون العزّل في الطرف الآخر.
    - p: ولذلك فمن الأهمية بمكان أن يقيّم المجتمع الدولي الكارثة من منظور محايد وموضوعي، وأن يصف الأحداث بما يتوافق مع طبيعتها الحقيقية، وأن يميّز بين مسؤوليات الأطراف. فلا ينبغي التعامل مع ميليشيا متمردة تنتهك القانون الدولي بشكل ممنهج بالطريقة نفسها التي يُتعامل بها مع القوات المسلحة السودانية الملزمة بحماية مواطنيها وصون كرامتهم والدفاع عن وطنها. وتؤدي القوات المسلحة السودانية هذه المهام في إطار قواعد القانون الدولي ذات الصلة، وفي مقدمتها البروتوكول الإضافي الثاني لاتفاقيات جنيف لعام 1977.
    - h: نظرة عامة على الوضع الإنساني في السودان (حتى أغسطس 2026)
      toc: نظرة عامة على الوضع الإنساني في السودان (حتى أغسطس 2026)
      level: 1
      id: s1-2
    - h: أ. ملخص الوضع الإنساني
      toc: أ. ملخص الوضع الإنساني
      level: 2
      id: s1-3
    - p: أدت الحرب المستمرة في السودان منذ 15 أبريل 2023 والانتهاكات الواسعة التي ترتكبها الميليشيات المتمردة بحق المدنيين إلى إغراق البلاد في أزمة إنسانية بالغة الشدة ومتعددة الأبعاد. ووفقًا للأمم المتحدة، أدى ذلك إلى تهجير قسري لأعداد من الناس لم يسبق لها مثيل في تاريخ الأزمات الإنسانية.
    - p: وبسبب الأزمة، أصبح أكثر من 25 مليون شخص كانوا قادرين في السابق على إعالة أنفسهم بحاجة إلى المساعدات الإنسانية. واضطر نحو 12.5 مليون شخص إلى مغادرة منازلهم أو اللجوء إلى دول أخرى، منهم نحو 8.3 مليون نازح داخليًا لجؤوا إلى ولايات ومناطق أكثر أمانًا داخل البلاد، ونحو 4.3 مليون من هؤلاء نزحوا من إقليمي دارفور الكبرى وكردفان الكبرى. إضافة إلى ذلك، لجأ نحو 4.2 مليون شخص إلى دول الجوار أو دول أخرى.
    - p: ومع تحسن الأوضاع الأمنية في بعض مناطق البلاد، عاد نحو 5.8 مليون نازح ولاجئ إلى السودان حتى أغسطس 2026. وقد دمّرت الميليشيات المتمردة بشكل ممنهج نحو 55 في المئة من البنية التحتية في البلاد، وأُحرقت أو أصبحت غير صالحة للاستخدام منشآت عديدة تقدّم الخدمات الأساسية، وفي مقدمتها المستشفيات والمدارس ومصادر مياه الشرب ومنشآت الطاقة وشبكات الصرف الصحي.
    - h: ب. الكلفة البشرية الباهظة للحرب على المدنيين في السودان
      toc: ب. الكلفة البشرية الباهظة للحرب على المدنيين في السودان
      level: 2
      id: s1-4
    - p: أدى عجز المجتمع الدولي عن حماية المدنيين من هجمات الميليشيات المتمردة إلى تعميق الأزمة الإنسانية في السودان. ووفقًا لتقارير تستند إلى بيانات موضوعية من الميدان، أصبح السودان من أبرز دول العالم من حيث عدد المدنيين الذين انتُهكت حقوقهم وتعرضوا لجرائم مختلفة بسبب هجمات الميليشيات المتمردة.
    - p: ونتيجة لهجمات الميليشيات المتمردة المدعومة من دول معروفة، تعرّض نحو 13.8 مليون شخص، أي 32% من سكان السودان، لأفعال تُعد جرائم بموجب القانون الدولي الإنساني. وكان ثلاثة من كل خمسة أشخاص يعيشون في ولايات إقليمي دارفور الكبرى وكردفان الكبرى وفي أجزاء من إقليم النيل الأزرق ضحايا لفعل واحد على الأقل يُعد جريمة بموجب القانون الدولي لحقوق الإنسان.
    - p: ويشير التقرير إلى ما مجموعه 16 نوعًا من الانتهاكات والجرائم، من بينها التهجير القسري للمدنيين، والتجويع كأسلوب من أساليب الحرب، والاحتجاز التعسفي والإعدام، واستخدامهم دروعًا بشرية، ونهب ممتلكاتهم، والاستعباد الجنسي، والاغتصاب كسلاح حرب، وغيرها من الانتهاكات الجسيمة. وتعرض الجداول أدناه بالتفصيل الحصيلة الإنسانية للحرب على المدنيين.
    toc: الوضع الإنساني في السودان
  - title: الانتهاكات ضد المدنيين والمناطق المتضررة
    blocks:
    - h: الانتهاكات ضد المدنيين في ولاية شمال كردفان (حتى أغسطس 2026)
      toc: الانتهاكات ضد المدنيين في ولاية شمال كردفان (حتى أغسطس 2026)
      level: 1
      id: s2-1
    - p: 'وفقًا للتقرير المصدر، جاء توزيع الانتهاكات التي ارتكبتها الميليشيات المتمردة في ولاية شمال كردفان على النحو التالي:'
    - table:
        head:
        - م
        - المنطقة
        - الانتهاكات المرتكبة
        - عدد الأسر المتضررة
        rows:
        - - '1'
          - شيكان
          - نهب وسلب في 29 قرية، ومقتل 55 مدنيًا بينهم نساء وأطفال، وتسجيل أكثر من 200 حالة إخفاء قسري، وإصابة المئات.
          - 60,000 أسرة
        - - '2'
          - جبرة الشيخ
          - تهجير قسري للسكان في خمس وحدات إدارية هي الاندرابة وجبرة المدينة وحمرة الوز والحجاب وكجمر، وتدمير سبع محطات مياه، ونهب أكثر من 100 ألف رأس من الماشية، ومقتل 220 مدنيًا.
          - 38,000 أسرة
        - - '3'
          - بارا
          - تهجير قسري للمدنيين في خمس وحدات إدارية شملت أم قرفة وأم سيالة وجريجخ وغيرها، وتدمير 22 مصدر مياه، ومقتل 88 مدنيًا بينهم نساء وأطفال وكبار سن، ونهب ممتلكات السكان.
          - 58,000 أسرة
        - - '4'
          - غرب بارا
          - تهجير قسري للمدنيين في عدد من الوحدات الإدارية، أبرزها أم سعدون وأم كريدم ودميرة التوم والمزروب، ونهب الممتلكات و30 ألف رأس من الماشية والسيارات، وإتلاف المحاصيل الزراعية، ومقتل مدنيين بينهم 53 امرأة و28 مسنة و16 طفلًا.
          - 12,000 أسرة
        - - '5'
          - سودري
          - احتلال القرى، وتهجير السكان المحليين قسرًا، وتوطين مرتزقة أجانب في المنطقة، ونهب ممتلكات السكان ومحاصيلهم الزراعية.
          - 7,000 أسرة
        num_cols:
        - 0
        - 3

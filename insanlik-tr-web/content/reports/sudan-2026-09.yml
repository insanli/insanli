  sections:
  - kind: context
    kicker: MEVCUT DURUM
    title: Durum Genel Görünümü
    text: Sudan, uzun süren çatışmalar, kitlesel yerinden edilme, akut gıda güvensizliği, hastalık salgınları ve temel hizmetlerdeki aksaklıklar nedeniyle dünyanın en ağır insani krizlerinden biriyle karşı karşıya kalmaya devam etmektedir. İnsani ihtiyaçlar son derece yüksek seyrederken, güvensizlik ve erişim kısıtlamaları çatışmadan etkilenen ve ulaşılması zor bölgelerde yardımların ulaştırılmasını sınırlamaktadır. Darfur, Kordofan ve diğer etkilenen bölgelerdeki aileler açlık, sağlık sistemindeki aksaklıklar, güvenli suya erişim ve yetersiz barınma koşulları nedeniyle özellikle ciddi risklerle karşı karşıyadır.
  - kind: needs
    kicker: İNSANİ İHTİYAÇLAR
    title: Öncelikli İnsani İhtiyaçlar
    text: Öncelikli ihtiyaçlar arasında acil gıda ve beslenme desteği, güvenli içme suyu ve sanitasyon, temel sağlık hizmetleri ve ilaçlar, acil barınma, koruma hizmetleri ve temel gıda dışı malzemeler bulunmaktadır. Yerinden edilmiş aileler, çocuklar ve çatışmadan etkilenen veya ulaşılması zor bölgelerde yaşayan topluluklar sürdürülebilir ve esnek desteğe ihtiyaç duymaktadır.
  - kind: priorities
    kicker: MÜDAHALE ODAĞI
    title: Temel Müdahale Öncelikleri
    text: Acil müdahale öncelikleri; hayat kurtarıcı gıda ve beslenme desteğinin sürdürülmesi, güvenli suya ve temel sağlık hizmetlerine erişimin yeniden sağlanması, acil barınma ve yardım malzemelerinin temini ve yerinden edilmiş ve kırılgan hanelere yönelik korumanın güçlendirilmesidir. Müdahale, ağır gıda güvensizliği, hastalık salgınları ve ciddi erişim kısıtlamaları bulunan bölgelere öncelik vermelidir.
  note: Rakamlar, raporlama dönemi için mevcut en güncel insani verileri yansıtmaktadır. Kaynaklar; UN OCHA, WFP, WHO ve UNICEF'in resmi insani durum güncellemeleri ile sektörel raporlarını içermektedir.
en:
  country_name: Sudan
  title: Sudan — Humanitarian Situation Overview
  summary: Sudan continues to face one of the world’s most severe humanitarian crises, driven by prolonged conflict, mass displacement, acute food insecurity, disease outbreaks and the disruption of essential services. Humanitarian needs remain exceptionally high, while…
  figures:
  - value: 33.7M
    label: People requiring humanitarian assistance
  - value: 9.1M
    label: Internally displaced people
  - value: 19.5M
    label: People facing Crisis or worse acute food insecurity
  - value: 37%
    label: Health facilities non-functional
  sections:
  - kind: context
    kicker: CURRENT CONTEXT
    title: Situation Overview
    text: Sudan continues to face one of the world’s most severe humanitarian crises, driven by prolonged conflict, mass displacement, acute food insecurity, disease outbreaks and the disruption of essential services. Humanitarian needs remain exceptionally high, while insecurity and access constraints continue to limit assistance in conflict-affected and hard-to-reach areas. Families in Darfur, Kordofan and other affected regions face particularly severe risks linked to hunger, health-system disruption, unsafe water and inadequate shelter.
  - kind: needs
    kicker: HUMANITARIAN NEEDS
    title: Priority Humanitarian Needs
    text: Priority needs include emergency food and nutrition assistance, safe drinking water and sanitation, essential healthcare and medicines, emergency shelter, protection services and basic non-food items. Displaced families, children and communities in conflict-affected and hard-to-reach areas require sustained and flexible assistance.
  - kind: priorities
    kicker: RESPONSE FOCUS
    title: Key Response Priorities
    text: Immediate priorities are to sustain lifesaving food and nutrition support, restore access to safe water and essential health services, provide emergency shelter and relief items, and strengthen protection for displaced and vulnerable households. Response efforts should prioritize areas facing severe food insecurity, disease outbreaks and major access constraints.
  note: Figures reflect the latest available humanitarian data for the reporting period. Sources include official humanitarian situation updates and sector-specific reporting from UN OCHA, WFP, WHO and UNICEF.

  country_name: Filistin (Gazze)
  title: Filistin (Gazze) — İnsani Durum Genel Görünümü
  summary: Gazze Şeridi'ndeki insani koşullar, geniş çaplı yerinden edilme, sivil altyapıda meydana gelen büyük hasar ve temel hizmetler üzerindeki devam eden baskı nedeniyle ağır seyretmektedir. Aileler yeterli gıdaya, güvenli içme suyuna, sağlık hizmetlerine,…
  figures:

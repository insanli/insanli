tr:
  black_heads: true
  country_name: Mısır
  title: Mısır — İnsani Durum Genel Görünümü
  summary: Mısır, krizin başlangıcından bu yana Gazze’den ülkeye gelen Filistinliler için önemli bir insani yardım ve sağlık müdahale merkezi olmaya devam etmektedir. Bu nüfus; tıbbi tahliye edilen hastaları, onlara eşlik eden aile üyelerini ve diğer yerinden edilmiş…
  figures:
  - value: 100K+
    label: Mısır’da bulunduğu bildirilen yerinden edilmiş Filistinliler
  - value: 6.6K+
    label: Mısır’ın kabul ettiği Gazze’den tıbbi tahliye edilen hastalar
  - value: 9.3K+
    label: Tıbbi tahliye edilen hastalarla gelen refakatçiler
  - value: 18.5K+
    label: Gazze’de hâlâ tıbbi tahliyeye ihtiyaç duyan hastalar
  sections:
  - kicker: MEVCUT DURUM
    title: Durum Genel Görünümü
    toc: DURUM GENEL GÖRÜNÜMÜ
    blocks:
    - p: Mısır, krizin başlangıcından bu yana Gazze’den ülkeye gelen Filistinliler için önemli bir insani yardım ve sağlık müdahale merkezi olmaya devam etmektedir. Bu nüfus; tıbbi tahliye edilen hastaları, onlara eşlik eden aile üyelerini ve diğer yerinden edilmiş Filistinlileri kapsamaktadır. Birçok kişi uzman sağlık hizmetleri, ilaç, rehabilitasyon, psikososyal destek, geçici barınma ve temel yaşam giderleri konusunda devam eden ihtiyaçlarla karşı karşıyadır. Geri dönüş ve hareket konusundaki belirsizlik de önemli bir koruma sorunu olmaya devam etmektedir.
  - kicker: İNSANİ İHTİYAÇLAR VE MÜDAHALE ODAĞI
    title: İnsani İhtiyaçlar ve Müdahale Öncelikleri
    toc: İNSANİ İHTİYAÇLAR VE MÜDAHALE ÖNCELİKLERİ
    blocks:
    - p: Öncelikli ihtiyaçlar ve müdahale alanları; Filistinli hastalar için uzman tedavi, rehabilitasyon ve sevk süreçlerinin sürdürülmesini, tahliye edilen hastaları kabul eden Mısır hastanelerinin ve sağlık personelinin desteklenmesini, ilaç ve yardımcı tıbbi cihazların teminini, psikososyal destek hizmetlerinin güçlendirilmesini ve geçici barınma imkânlarının sağlanmasını kapsamaktadır.
    - p: Ayrıca çocuklar, engelli bireyler, kronik veya karmaşık sağlık sorunları bulunan hastalar, sınırlı mali kaynaklara sahip haneler ve hastalara refakat eden aile üyeleri öncelikli destek grupları arasında değerlendirilmelidir. Mısır'daki kırılgan Filistinli ailelere yönelik temel insani yardımların ulaştırılması ve koşullar elverdiğinde güvenli, onurlu ve gönüllü hareketin desteklenmesi de müdahale öncelikleri arasında yer almalıdır.
  - kicker: FAALİYETLERİMİZ
    title: Mısır’daki İnsani Yardım Faaliyetlerimiz ve Hizmet Kapasitemiz
    toc: MISIR’DAKİ İNSANİ YARDIM FAALİYETLERİMİZ VE HİZMET KAPASİTEMİZ
    blocks:
    - p: Mısır’da, savaş ve zorunlu göç nedeniyle ülkelerini terk etmek zorunda kalan Filistinli ve Sudanlı birey ve ailelere yönelik insani yardım ve sosyal destek faaliyetleri yürütmekteyiz. Faaliyetlerimizi, her iki topluluğun ihtiyaç ve önceliklerini gözeterek farklı program alanlarında gerçekleştirmekteyiz.
  - kicker: KURUMSAL KAPASİTE
    title: Mısır’daki Resmî Temsil, Operasyonel ve Kurumsal Uygulama Kapasitemiz
    toc: MISIR’DAKİ RESMÎ TEMSİL, OPERASYONEL VE KURUMSAL UYGULAMA KAPASİTEMİZ
    blocks:
    - h: Resmî Temsil ve Kurumsal İş Birlikleri
      toc: Resmî Temsil ve Kurumsal İş Birlikleri
      level: 1
      id: s4-1
    - p: İnsanlık Eli Derneği olarak Mısır'da resmî temsilcimiz bulunmaktadır. Derneğimiz, Mısır'daki faaliyetlerini ilgili mevzuat ve resmî prosedürlere uygun şekilde yürütmektedir. Bu kapsamda, Mısır'daki ilgili resmî kurumlarla protokol, iş birliği ve mutabakat anlaşmaları çerçevesinde faaliyetlerimizi gerçekleştirebilecek kurumsal altyapıya sahibiz.
    - h: Resmî Bankacılık Kanalları Üzerinden Finansal İşlemler
      toc: Resmî Bankacılık Kanalları Üzerinden Finansal İşlemler
      level: 1
      id: s4-2
    - p: İnsani yardım faaliyetler ve projeler kapsamında ihtiyaç duyulan maddi kaynakların, resmî bankacılık kanalları aracılığıyla Mısır'a gönderilmesi ve teslim alınması mümkündür. Bu sayede proje bütçeleri ve yardım kaynakları, bankacılık sistemi üzerinden kayıtlı ve izlenebilir şekilde yönetilebilmektedir.
    - h: Toplu Organizasyonlar ve Sosyal Etkinlikler
      toc: Toplu Organizasyonlar ve Sosyal Etkinlikler
      level: 1
      id: s4-3
    - p: Derneğimiz, Mısır'da çok sayıda aile ve katılımcının yer aldığı yardım organizasyonları ve sosyal etkinlikleri düzenlemek için gerekli izin süreçlerini yürütebilmektedir. Toplu iftar programları, yardım dağıtımları ve benzeri geniş katılımlı etkinlikler, ilgili makamlardan gerekli izinlerin alınarak düzenlenebilmektedir.
  - kicker: FAALİYET ALANLARI
    title: Mısır’daki Temel Faaliyet Alanlarımız
    toc: MISIR’DAKİ TEMEL FAALİYET ALANLARIMIZ
    blocks:
    - h: Sağlık ve Rehabilitasyon Hizmetleri
      toc: Sağlık ve Rehabilitasyon Hizmetleri
      level: 1
      id: s5-1
    - ul:
      - Cerrahi ve uzman sağlık hizmetleri
      - Protez hizmetleri ve rehabilitasyon
      - Fizik tedavi ve ameliyat sonrası iyileşme süreçleri
      - Çocuklara yönelik ruh sağlığı ve psikososyal destek
    - h: Temel İnsani Yardım ve Aile Destek Hizmetleri
      toc: Temel İnsani Yardım ve Aile Destek Hizmetleri
      level: 1
      id: s5-2
    - ul:
      - Gıda Kolisi Desteği
      - Ailelere Düzenli Aylık Nakdî Destek
      - Kira ve Barınma Desteği
    - h: Filistinlilere Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
      toc: Filistinlilere Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
      level: 1
      id: s5-3
    - p: Gazze’deki savaş nedeniyle Mısır’a tahliye edilen veya yerinden edilerek Mısır’da yaşamını sürdürmek zorunda kalan Filistinli birey ve ailelere yönelik sağlık, rehabilitasyon, psikososyal destek ve temel insani yardım faaliyetleri yürütmekteyiz.
    - p: Kurumumuz, Mısır'da faaliyet gösteren sağlık hizmeti sağlayıcılarıyla kurduğu iş birlikleri aracılığıyla uzman sağlık hizmetleri, protez uygulamaları, rehabilitasyon ve psikososyal destek alanlarında kapsamlı hizmetler sunmayı hedeflemektedir. Bu kapsamda Gazze'den tahliye edilen hastalara yönelik sağlık ve bakım desteği de faaliyet alanlarımız arasında yer almaktadır.
    - h: Sağlık, tedavi ve bakım hizmetleri
      toc: Sağlık, tedavi ve bakım hizmetleri
      level: 2
      id: s5-4
    - ul:
      - Cerrahi müdahale ve uzmanlık gerektiren sağlık hizmetlerine erişim
      - Ameliyat öncesi değerlendirme, operasyon ve ameliyat sonrası bakım
      - İlaç desteği ve iyileşme sürecinin takibi
      - Protez uygulamaları, protez uyumlandırma ve kullanım eğitimi
      - Fizik tedavi ve rehabilitasyon hizmetleri
      - Tedavi sonrası takip ve bakım süreçlerinin koordinasyonu
    - h: Çocuklara yönelik psikososyal destek
      toc: Çocuklara yönelik psikososyal destek
      level: 2
      id: s5-5
    - ul:
      - Mısır'da bulunan 13 okul aracılığıyla çocuklara yönelik psikososyal destek programları
      - Çocukların duygusal iyilik hâlinin ve psikolojik dayanıklılığının desteklenmesi
      - Çocukların kendilerini güvende hissetmelerini destekleyen çalışmaların yapılması ve ihtiyaç duyanların uzman desteğine yönlendirilmesi
    - h: Temel insani yardım ve hane destekleri
      toc: Temel insani yardım ve hane destekleri
      level: 2
      id: s5-6
    - ul:
      - 'Gıda kolisi desteği: Gıda güvencesi sorunu yaşayan ailelere temel gıda ürünlerinden oluşan kolilerin ulaştırılması.'
      - 'Ailelere düzenli aylık nakdî destek: Gelirini kaybetmiş veya ciddi ekonomik sıkıntı yaşayan ailelere kira, gıda, hijyen, giyim, elektrik ve su gibi temel ihtiyaçlarını karşılayabilmeleri için düzenli nakdî destek sağlanması.'
      - 'Kira ve barınma desteği: Savaş nedeniyle yerinden edilmiş ailelerin Mısır''daki barınma ihtiyaçlarına ve kira ödemelerine destek olunması.'
    - h: Sudanlılara Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
      toc: Sudanlılara Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
      level: 1
      id: s5-7
    - p: Sudanlı ailelere yönelik çalışmalarımızda da Filistinli aileler için yürüttüğümüz sağlık, rehabilitasyon, psikososyal destek ve temel insani yardım programlarını sürdürmekteyiz. Bu kapsamda sağlık ve tedavi desteği, protez ve rehabilitasyon hizmetleri, çocuklara yönelik psikososyal destek, gıda kolisi, düzenli nakdî yardım ve kira-barınma desteği sağlamaktayız.
    - p: Bunlara ek olarak Sudanlılara yönelik mesleki eğitim ve beceri geliştirme programları da düzenlemekteyiz.
    - ul:
      - Mesleki eğitim kurslarının düzenlenmesi
      - Farklı alanlarda meslek edindirme kurslarının sunulması
      - Katılımcıların mesleki bilgi ve becerilerinin geliştirilmesi
      - İstihdam olanaklarına ve ekonomik bağımsızlığa erişimlerinin desteklenmesi
  - kicker: HİZMETLERİMİZ
    title: Mısır’daki Temel Faaliyet Alanlarımız
    toc: MISIR’DAKİ TEMEL FAALİYET ALANLARIMIZ
    blocks:
    - h: Cerrahi Hizmetler ve Sağlık Kuruluşlarıyla İş Birlikleri
      toc: Cerrahi Hizmetler ve Sağlık Kuruluşlarıyla İş Birlikleri
      level: 1
      id: s6-1
    - p: Sağlık kuruluşlarıyla yapılacak iş birlikleri sayesinde, hastaların cerrahi müdahalelerden ve uzman hekimlerin sunduğu sağlık hizmetlerinden yararlanması hedeflenmektedir.
    - lab: Hasta Bakım Sürecinin Aşamaları
    - ul:
      - Ameliyat öncesi tıbbi değerlendirme
      - Cerrahi müdahale
      - Ameliyat sonrası ilaç tedavisi ve bakım
      - Hastanın iyileşme sürecinin takip edilmesi
    - p: Bu modelle hastaların ilk değerlendirmeden tedaviye, ameliyat sonrası bakımdan iyileşme sürecinin tamamlanmasına kadar düzenli ve koordineli sağlık hizmeti alması amaçlanmaktadır.
    - h: Kapsamlı Protez Hizmetleri
      toc: Kapsamlı Protez Hizmetleri
      level: 1
      id: s6-2
    - p: Bir protez merkeziyle yapılacak iş birliği kapsamında, uzuv kaybı nedeniyle proteze ihtiyaç duyan hastalara değerlendirme, protez uygulaması ve rehabilitasyon hizmetleri sunulması hedeflenmektedir.
    - lab: Hizmet Sürecinin Aşamaları
    - lab: Değerlendirme
    - ul:
      - Tıbbi değerlendirme
      - Hastanın ihtiyaçlarının belirlenmesi
    - lab: Protez Uygulaması
    - ul:
      - Hastanın ihtiyacına uygun protezin belirlenmesi
      - Protezin hastaya uyumlandırması
    - lab: Uyum ve Rehabilitasyon
    - ul:
      - Protez kullanımı eğitimi
      - Rehabilitasyon hizmetleri
      - Düzenli kontrol ve değerlendirme
    - h: Fizik Tedavi ve Ameliyat Sonrası Rehabilitasyon Hizmetleri
      toc: Fizik Tedavi ve Ameliyat Sonrası Rehabilitasyon Hizmetleri
      level: 1
      id: s6-3
    - p: Amacımız yalnızca protez temin etmek değil, hastaların protezlerini etkin şekilde kullanabilmelerini, günlük yaşamlarını mümkün olduğunca bağımsız sürdürebilmelerini ve hareket kabiliyetlerini yeniden kazanmalarını desteklemektir.
    - p: Bir fizik tedavi ve rehabilitasyon merkeziyle yapılacak iş birliği kapsamında, yaralanan hastaların tedavi sonrası iyileşme süreçlerini destekleyecek rehabilitasyon hizmetleri sunulması hedeflenmektedir.
    - lab: Öncelikli Hizmet Alanları
    - ul:
      - Ameliyat sonrası rehabilitasyon
      - Hareket kabiliyetinin ve günlük yaşam becerilerinin yeniden kazanılması
      - Protez uygulaması sonrasında rehabilitasyon
      - İyileşme sürecinin düzenli takibi
    - p: Temel yaklaşımımız, ameliyat sonrası bakımdan rehabilitasyon sürecine kadar hastaların hareket kabiliyetlerini ve günlük yaşamlarını bağımsız sürdürebilme becerilerini yeniden kazanmalarını desteklemektir.
    - h: 'Tedaviden İyileşmeye: Bütüncül Hasta Bakım Modeli'
      toc: 'Tedaviden İyileşmeye: Bütüncül Hasta Bakım Modeli'
      level: 1
      id: s6-4
    - p: Başarılı bir cerrahi müdahale, iyileşme sürecinin yalnızca başlangıcıdır. Hastanın sağlığına kavuşabilmesi için ameliyat sonrasında bakım, rehabilitasyon ve düzenli takip hizmetlerinin devam etmesi gerekir.
    - lab: Koordineli Hasta Bakım Süreci
    - ul:
      - Değerlendirme
      - Tedavi
      - İyileşme
      - Rehabilitasyon
      - Takip
    - p: Bu yaklaşımla hastanın tedavi, bakım ve rehabilitasyon ihtiyaçlarının birbiriyle bağlantılı şekilde ele alınması ve tüm sürecin düzenli olarak takip edilmesi amaçlanmaktadır.
    - h: Çocuklara Yönelik Ruh Sağlığı ve Psikososyal Destek Programları
      toc: Çocuklara Yönelik Ruh Sağlığı ve Psikososyal Destek Programları
      level: 1
      id: s6-5
    - p: Mısır'da erişim sağlanan 13 okul aracılığıyla, çocukların psikososyal gelişimlerini destekleyen yapılandırılmış okul temelli programların uygulanması hedeflenmektedir.
    - p: Bu okullar aracılığıyla çocukların psikolojik dayanıklılıklarını güçlendiren ve kendilerini güvende hissetmelerine yardımcı olan destek çalışmaları yürütülmesi amaçlanmaktadır.
    - lab: Çocukların Duygusal ve Psikolojik Gelişiminin Desteklenmesi
    - ul:
      - Çocukların psikolojik dayanıklılığını güçlendiren faaliyetler
      - Kendilerini güvende hissetmelerini destekleyen çocuk odaklı etkinlikler
      - Duygusal gelişimi destekleyen çalışmalar
    - lab: Uzman Desteğine Yönlendirme Mekanizmaları
    - ul:
      - Ek desteğe ihtiyaç duyan çocukların belirlenmesi
      - İhtiyaç duyan çocukların uzmanlara yönlendirilmesi
      - Gerekli destek mekanizmalarıyla bağlantı kurulması
    - h: B. Temel İnsani Yardım ve Aile Destek Hizmetleri
      toc: B. Temel İnsani Yardım ve Aile Destek Hizmetleri
      level: 1
      id: s6-6
    - h: Gıda Kolisi Desteği
      toc: Gıda Kolisi Desteği
      level: 2
      id: s6-7
    - p: Savaş ve zorunlu göç nedeniyle gıdaya erişimde güçlük yaşayan ihtiyaç sahibi ailelere temel gıda ürünlerinden oluşan yardım kolilerinin ulaştırılması.
    - h: Ailelere Düzenli Aylık Nakdî Destek
      toc: Ailelere Düzenli Aylık Nakdî Destek
      level: 2
      id: s6-8
    - p: Savaş nedeniyle yerinden edilmiş, gelir kaynaklarını kaybetmiş veya geçim sıkıntısı yaşayan ailelere; kira, gıda, hijyen, giyim, elektrik ve su gibi temel ihtiyaçlarını karşılayabilmeleri için düzenli nakdî yardım yapılması.
    - h: Kira ve Barınma Desteği
      toc: Kira ve Barınma Desteği
      level: 2
      id: s6-9
    - p: Savaş nedeniyle evlerini terk ederek Mısır'a sığınmak zorunda kalan ailelerin barınma ihtiyaçlarına katkı sağlamak amacıyla kira yardımı yapılması.
    - p: Bu destekle ailelerin kira giderlerini karşılayabilmelerine, barınma sorunlarını hafifletmelerine ve daha güvenli koşullarda yaşamalarını sürdürmelerine katkı sağlanması amaçlanmaktadır.
  - kicker: İŞ BİRLİĞİ AĞI
    title: Mısır'da Kapsamlı Sağlık Hizmetleri İçin Yerel Uygulama ve İş Birliği Ağı
    toc: MISIR'DA KAPSAMLI SAĞLIK HİZMETLERİ İÇİN YEREL UYGULAMA VE İŞ BİRLİĞİ AĞI
    blocks:
    - p: Kurumumuz, insani yardım alanında faaliyet gösteren paydaşları Mısır'daki yerel sağlık hizmeti sağlayıcılarıyla buluşturmayı ve hastaların müdahale aşamasından iyileşme, rehabilitasyon, takip ve dokümantasyon süreçlerine kadar koordinasyonunu sağlamayı hedeflemektedir.
    - h: İş Birliği ve Proje Geliştirme Alanları
      toc: İş Birliği ve Proje Geliştirme Alanları
      level: 1
      id: s7-1
    - ul:
      - Ortak sağlık hizmetleri ve cerrahi destek programları
      - Kapsamlı protez ve rehabilitasyon projeleri
      - Ameliyat sonrası bakım ve hasta takip programları
      - Okul temelli psikososyal destek projeleri
    - lab: Kurumumuzun Sağlayacağı Katkılar
    - ul:
      - Yerel sağlık kuruluşlarıyla iş birliği ağı
      - Hasta süreçlerinin koordinasyonu
      - Tedavi ve rehabilitasyon süreçlerinin takibi
      - Hasta kayıtlarının ve hizmet süreçlerinin dokümantasyonu
  note: Rakamlar, raporlama dönemi için mevcut en güncel insani verileri yansıtmaktadır. Kaynaklar; UN OCHA, WFP, WHO ve UNICEF'in resmi insani durum güncellemeleri ile sektörel raporlarını içermektedir.
en:
  country_name: Egypt
  title: Egypt — Humanitarian Situation Overview
  summary: Egypt continues to play a major humanitarian and health-response role for Palestinians from Gaza who have entered the country since the start of the crisis. This population includes medical evacuees, accompanying family members and other displaced…
  figures:
  - value: 100K+
    label: Displaced Palestinians reported in Egypt
  - value: 6.6K+
    label: Gaza medical evacuees received by Egypt
  - value: 9.3K+
    label: Companions received with medical evacuees
  - value: 18.5K+
    label: Patients in Gaza still requiring medical evacuation
  sections:
  - kind: context
    kicker: CURRENT CONTEXT
    title: Situation Overview
    text: Egypt continues to play a major humanitarian and health-response role for Palestinians from Gaza who have entered the country since the start of the crisis. This population includes medical evacuees, accompanying family members and other displaced Palestinians. Many face continuing needs related to specialized healthcare, medication, rehabilitation, psychosocial support, accommodation and basic living costs, while uncertainty around return and movement remains a major protection concern.
  - kind: needs
    kicker: HUMANITARIAN NEEDS
    title: Priority Humanitarian Needs
    text: Priority needs include continued specialized medical treatment and rehabilitation for evacuated patients, medicines and assistive devices, psychosocial support, temporary accommodation, basic assistance and support for accompanying family members. Particular attention is required for children, people with disabilities, patients with chronic or complex conditions and households with limited financial resources.
  - kind: priorities
    kicker: RESPONSE FOCUS
    title: Key Response Priorities
    text: Response priorities include sustaining treatment and referral pathways for Palestinian patients, supporting Egyptian hospitals and health personnel receiving evacuees, strengthening rehabilitation and psychosocial services, and providing targeted basic assistance to vulnerable Palestinian families in Egypt. Coordination should also support safe, dignified and voluntary movement when conditions allow.
  note: Figures reflect the latest available humanitarian data for the reporting period. Sources include official humanitarian situation updates and sector-specific reporting from UN OCHA, WFP, WHO and UNICEF.
ar:
  country_name: مصر
  title: مصر — نظرة عامة على الوضع الإنساني
  summary: تواصل مصر أداء دور إنساني وصحي رئيسي للفلسطينيين القادمين من قطاع غزة منذ بداية الأزمة. وتشمل هذه الفئة المرضى الذين تم إجلاؤهم طبيًا، وأفراد أسرهم المرافقين، وغيرهم من الفلسطينيين النازحين. ويواجه كثيرون احتياجات مستمرة تتعلق بالرعاية الطبية التخصصية…
  figures:
  - value: 100K+
    label: فلسطينيون نازحون مُبلّغ عن وجودهم في مصر
  - value: 6.6K+
    label: مرضى من غزة استقبلتهم مصر للإجلاء الطبي
  - value: 9.3K+
    label: مرافقون وصلوا مع حالات الإجلاء الطبي
  - value: 18.5K+
    label: مرضى في غزة ما زالوا بحاجة إلى إجلاء طبي
  sections:
  - kind: context
    kicker: السياق الحالي
    title: نظرة عامة على الوضع
    text: تواصل مصر أداء دور إنساني وصحي رئيسي للفلسطينيين القادمين من قطاع غزة منذ بداية الأزمة. وتشمل هذه الفئة المرضى الذين تم إجلاؤهم طبيًا، وأفراد أسرهم المرافقين، وغيرهم من الفلسطينيين النازحين. ويواجه كثيرون احتياجات مستمرة تتعلق بالرعاية الطبية التخصصية والأدوية وإعادة التأهيل والدعم النفسي والاجتماعي والسكن وتكاليف المعيشة الأساسية، في ظل استمرار حالة عدم اليقين المرتبطة بالعودة والحركة.
  - kind: needs
    kicker: الاحتياجات الإنسانية
    title: الاحتياجات الإنسانية ذات الأولوية
    text: تشمل الاحتياجات ذات الأولوية استمرار العلاج الطبي التخصصي وإعادة التأهيل للمرضى الذين تم إجلاؤهم، وتوفير الأدوية والأجهزة المساعدة، والدعم النفسي والاجتماعي، والسكن المؤقت، والمساعدات الأساسية، ودعم أفراد الأسر المرافقين. ويجب إيلاء اهتمام خاص للأطفال والأشخاص ذوي الإعاقة والمرضى الذين يعانون من حالات مزمنة أو معقدة والأسر محدودة الموارد المالية.
  - kind: priorities
    kicker: أولويات الاستجابة
    title: أولويات الاستجابة الرئيسية
    text: تشمل أولويات الاستجابة الحفاظ على مسارات العلاج والإحالة للمرضى الفلسطينيين، ودعم المستشفيات المصرية والعاملين الصحيين الذين يستقبلون الحالات المحالة، وتعزيز خدمات إعادة التأهيل والدعم النفسي والاجتماعي، وتقديم مساعدات أساسية موجهة للأسر الفلسطينية الأكثر هشاشة في مصر. كما ينبغي أن يدعم التنسيق الحركة الآمنة والكريمة والطوعية عندما تسمح الظروف بذلك.
  note: تعكس الأرقام أحدث البيانات الإنسانية المتاحة لفترة التقرير. وتشمل المصادر تحديثات الوضع الإنساني الرسمية والتقارير القطاعية الصادرة عن مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية وبرنامج الأغذية العالمي ومنظمة الصحة العالمية واليونيسف.

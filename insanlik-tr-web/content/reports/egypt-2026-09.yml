    kicker: FAMILY SUPPORT
    title: B. Basic Humanitarian Aid and Family Support Services
    text: |
      1. Food Parcel Support

      Delivering aid parcels of basic food items to families in need who have difficulty accessing food because of war and forced displacement.

      2. Regular Monthly Cash Support for Families

      Providing regular cash aid to families who have been displaced by the war, have lost their sources of income or are struggling to make a living, so that they can meet basic needs such as rent, food, hygiene, clothing, electricity and water.

      3. Rent and Shelter Support

      Providing rent assistance to contribute to the accommodation needs of families who left their homes because of the war and had to take refuge in Egypt.

      With this support, the aim is to help families cover their rent costs, ease their housing problems and continue living in safer conditions.

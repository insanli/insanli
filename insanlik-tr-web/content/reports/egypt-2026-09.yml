    text: |
      Our organisation aims to bring humanitarian stakeholders together with local healthcare providers in Egypt and to coordinate patients’ journey from the intervention stage through to recovery, rehabilitation, follow-up and documentation.

      Areas of Cooperation and Project Development

      1. Joint healthcare services and surgical support programmes

      2. Comprehensive prosthetic and rehabilitation projects

      3. Post-operative care and patient follow-up programmes

      4. School-based psychosocial support projects

      Contributions Our Organisation Will Provide

      • A cooperation network with local healthcare institutions

      • Coordination of patient processes

      • Follow-up of treatment and rehabilitation processes

      • Documentation of patient records and service processes

tr:
  black_heads: true
  country_name: Mısır
  head_sizes: [13, 12, 11]
  title: Mısır — İnsani Durum Genel Görünümü
  summary: Mısır, krizin başlangıcından bu yana Gazze’den ülkeye gelen Filistinliler için önemli bir insani yardım ve sağlık müdahale merkezi olmaya devam etmektedir. Bu nüfus; tıbbi tahliye edilen hastaları, onlara eşlik eden aile üyelerini ve diğer yerinden edilmiş…
  figures:
  - value: 100K+
    label: Mısır’da bulunduğu bildirilen yerinden edilmiş Filistinliler
  - value: 6.6K+
    label: Mısır’ın kabul ettiği Gazze’den tıbbi tahliye edilen hastalar
  - value: 9.3K+
    label: Tıbbi tahliye edilen hastalarla gelen refakatçiler
  - value: 18.5K+
    label: Gazze’de hâlâ tıbbi tahliyeye ihtiyaç duyan hastalar
  toc_deep: true
  static_header: true
  compact: true
  sections:
  - kicker: MEVCUT DURUM
    title: Durum Genel Görünümü
    toc: Durum genel görünümü
    blocks:
    - p: Mısır, krizin başlangıcından bu yana Gazze’den ülkeye gelen Filistinliler için önemli bir insani yardım ve sağlık müdahale merkezi olmaya devam etmektedir. Bu nüfus; tıbbi tahliye edilen hastaları, onlara eşlik eden aile üyelerini ve diğer yerinden edilmiş Filistinlileri kapsamaktadır. Birçok kişi uzman sağlık hizmetleri, ilaç, rehabilitasyon, psikososyal destek, geçici barınma ve temel yaşam giderleri konusunda devam eden ihtiyaçlarla karşı karşıyadır. Geri dönüş ve hareket konusundaki belirsizlik de önemli bir koruma sorunu olmaya devam etmektedir.
  - kicker: İNSANİ İHTİYAÇLAR VE MÜDAHALE ODAĞI
    title: İnsani İhtiyaçlar ve Müdahale Öncelikleri
    toc: İnsani ihtiyaçlar ve müdahale öncelikleri
    blocks:
    - p: Öncelikli ihtiyaçlar ve müdahale alanları; Filistinli hastalar için uzman tedavi, rehabilitasyon ve sevk süreçlerinin sürdürülmesini, tahliye edilen hastaları kabul eden Mısır hastanelerinin ve sağlık personelinin desteklenmesini, ilaç ve yardımcı tıbbi cihazların teminini, psikososyal destek hizmetlerinin güçlendirilmesini ve geçici barınma imkânlarının sağlanmasını kapsamaktadır.
    - p: Ayrıca çocuklar, engelli bireyler, kronik veya karmaşık sağlık sorunları bulunan hastalar, sınırlı mali kaynaklara sahip haneler ve hastalara refakat eden aile üyeleri öncelikli destek grupları arasında değerlendirilmelidir. Mısır'daki kırılgan Filistinli ailelere yönelik temel insani yardımların ulaştırılması ve koşullar elverdiğinde güvenli, onurlu ve gönüllü hareketin desteklenmesi de müdahale öncelikleri arasında yer almalıdır.
  - kicker: KURUMSAL KAPASİTE
    title: Mısır'daki Resmî Temsil, Operasyonel ve Kurumsal Kapasitemiz
    toc: Mısır'daki resmî temsil, operasyonel ve kurumsal kapasitemiz
    blocks:
    - p: Mısır’da, savaş ve zorunlu göç nedeniyle ülkelerini terk etmek zorunda kalan Filistinli ve Sudanlı birey ve ailelere yönelik insani yardım ve sosyal destek faaliyetleri yürütmekteyiz. Faaliyetlerimizi, her iki topluluğun ihtiyaç ve önceliklerini gözeterek farklı program alanlarında gerçekleştirmekteyiz.
    - h: Resmî Temsil ve Kurumsal İş Birlikleri
      toc: Resmî Temsil ve Kurumsal İş Birlikleri
      level: 1
      id: s4-1
    - p: İnsanlık Eli Derneği olarak Mısır'da resmî temsilcimiz bulunmaktadır. Derneğimiz, Mısır'daki faaliyetlerini ilgili mevzuat ve resmî prosedürlere uygun şekilde yürütmektedir. Bu kapsamda, Mısır'daki ilgili resmî kurumlarla protokol, iş birliği ve mutabakat anlaşmaları çerçevesinde faaliyetlerimizi gerçekleştirebilecek kurumsal altyapıya sahibiz.
    - h: Resmî Bankacılık Kanalları Üzerinden Finansal İşlemler
      toc: Resmî Bankacılık Kanalları Üzerinden Finansal İşlemler
      level: 1
      id: s4-2
    - p: İnsani yardım faaliyetler ve projeler kapsamında ihtiyaç duyulan maddi kaynakların, resmî bankacılık kanalları aracılığıyla Mısır'a gönderilmesi ve teslim alınması mümkündür. Bu sayede proje bütçeleri ve yardım kaynakları, bankacılık sistemi üzerinden kayıtlı ve izlenebilir şekilde yönetilebilmektedir.
    - h: Toplu Organizasyonlar ve Sosyal Etkinlikler
      toc: Toplu Organizasyonlar ve Sosyal Etkinlikler
      level: 1
      id: s4-3
    - p: Derneğimiz, Mısır'da çok sayıda aile ve katılımcının yer aldığı yardım organizasyonları ve sosyal etkinlikleri düzenlemek için gerekli izin süreçlerini yürütebilmektedir. Toplu iftar programları, yardım dağıtımları ve benzeri geniş katılımlı etkinlikler, ilgili makamlardan gerekli izinlerin alınarak düzenlenebilmektedir.
  - kicker: FAALİYET ALANLARI
    title: Mısır’daki Temel Faaliyet Alanlarımız
    toc: Mısır’daki temel faaliyet alanlarımız
    blocks:
    - h: Sağlık ve Rehabilitasyon Hizmetleri
      toc: Sağlık ve Rehabilitasyon Hizmetleri
      level: 1
      id: s5-1
    - ul:
      - Cerrahi ve uzman sağlık hizmetleri
      - Protez hizmetleri ve rehabilitasyon
      - Fizik tedavi ve ameliyat sonrası iyileşme süreçleri
      - Çocuklara yönelik ruh sağlığı ve psikososyal destek
    - h: Temel İnsani Yardım ve Aile Destek Hizmetleri
      toc: Temel İnsani Yardım ve Aile Destek Hizmetleri
      level: 1
      id: s5-2
    - ul:
      - Gıda Kolisi Desteği
      - Ailelere Düzenli Aylık Nakdî Destek
      - Kira ve Barınma Desteği
    - h: Filistinlilere Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
      toc: Filistinlilere Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
      level: 1
      id: s5-3
      nav: true
    - p: Gazze’deki savaş nedeniyle Mısır’a tahliye edilen veya yerinden edilerek Mısır’da yaşamını sürdürmek zorunda kalan Filistinli birey ve ailelere yönelik sağlık, rehabilitasyon, psikososyal destek ve temel insani yardım faaliyetleri yürütmekteyiz.
    - p: Kurumumuz, Mısır'da faaliyet gösteren sağlık hizmeti sağlayıcılarıyla kurduğu iş birlikleri aracılığıyla uzman sağlık hizmetleri, protez uygulamaları, rehabilitasyon ve psikososyal destek alanlarında kapsamlı hizmetler sunmayı hedeflemektedir. Bu kapsamda Gazze'den tahliye edilen hastalara yönelik sağlık ve bakım desteği de faaliyet alanlarımız arasında yer almaktadır.
    - h: Sağlık, tedavi ve bakım hizmetleri
      toc: Sağlık, tedavi ve bakım hizmetleri
      level: 2
      id: s5-4
    - ul:
      - Cerrahi müdahale ve uzmanlık gerektiren sağlık hizmetlerine erişim
      - Ameliyat öncesi değerlendirme, operasyon ve ameliyat sonrası bakım
      - İlaç desteği ve iyileşme sürecinin takibi
      - Protez uygulamaları, protez uyumlandırma ve kullanım eğitimi
      - Fizik tedavi ve rehabilitasyon hizmetleri
      - Tedavi sonrası takip ve bakım süreçlerinin koordinasyonu
    - h: Çocuklara yönelik psikososyal destek
      toc: Çocuklara yönelik psikososyal destek
      level: 2
      id: s5-5
    - ul:
      - Mısır'da bulunan 13 okul aracılığıyla çocuklara yönelik psikososyal destek programları
      - Çocukların duygusal iyilik hâlinin ve psikolojik dayanıklılığının desteklenmesi
      - Çocukların kendilerini güvende hissetmelerini destekleyen çalışmaların yapılması ve ihtiyaç duyanların uzman desteğine yönlendirilmesi
    - h: Temel insani yardım ve hane destekleri
      toc: Temel insani yardım ve hane destekleri
      level: 2
      id: s5-6
    - ul:
      - 'Gıda kolisi desteği: Gıda güvencesi sorunu yaşayan ailelere temel gıda ürünlerinden oluşan kolilerin ulaştırılması.'
      - 'Ailelere düzenli aylık nakdî destek: Gelirini kaybetmiş veya ciddi ekonomik sıkıntı yaşayan ailelere kira, gıda, hijyen, giyim, elektrik ve su gibi temel ihtiyaçlarını karşılayabilmeleri için düzenli nakdî destek sağlanması.'
      - 'Kira ve barınma desteği: Savaş nedeniyle yerinden edilmiş ailelerin Mısır''daki barınma ihtiyaçlarına ve kira ödemelerine destek olunması.'
    - h: Sudanlılara Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
      toc: Sudanlılara Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
      level: 1
      id: s5-7
      nav: true
    - p: Sudanlı ailelere yönelik çalışmalarımızda da Filistinli aileler için yürüttüğümüz sağlık, rehabilitasyon, psikososyal destek ve temel insani yardım programlarını sürdürmekteyiz. Bu kapsamda sağlık ve tedavi desteği, protez ve rehabilitasyon hizmetleri, çocuklara yönelik psikososyal destek, gıda kolisi, düzenli nakdî yardım ve kira-barınma desteği sağlamaktayız.
    - p: Bunlara ek olarak Sudanlılara yönelik mesleki eğitim ve beceri geliştirme programları da düzenlemekteyiz.
    - ul:
      - Mesleki eğitim kurslarının düzenlenmesi
      - Farklı alanlarda meslek edindirme kurslarının sunulması
      - Katılımcıların mesleki bilgi ve becerilerinin geliştirilmesi
      - İstihdam olanaklarına ve ekonomik bağımsızlığa erişimlerinin desteklenmesi
    - h: Faaliyetlerimizin Detaylı Açıklaması
      toc: Faaliyetlerimizin Detaylı Açıklaması
      level: 1
      id: s6-0
      nav: true
      style: main
    - h: Cerrahi Hizmetler ve Sağlık Kuruluşlarıyla İş Birlikleri
      toc: Cerrahi Hizmetler ve Sağlık Kuruluşlarıyla İş Birlikleri
      level: 1
      id: s6-1
    - p: Sağlık kuruluşlarıyla yapılacak iş birlikleri sayesinde, hastaların cerrahi müdahalelerden ve uzman hekimlerin sunduğu sağlık hizmetlerinden yararlanması hedeflenmektedir.
    - lab: Hasta Bakım Sürecinin Aşamaları
    - ul:
      - Ameliyat öncesi tıbbi değerlendirme
      - Cerrahi müdahale
      - Ameliyat sonrası ilaç tedavisi ve bakım
      - Hastanın iyileşme sürecinin takip edilmesi
    - p: Bu modelle hastaların ilk değerlendirmeden tedaviye, ameliyat sonrası bakımdan iyileşme sürecinin tamamlanmasına kadar düzenli ve koordineli sağlık hizmeti alması amaçlanmaktadır.
    - h: Kapsamlı Protez Hizmetleri
      toc: Kapsamlı Protez Hizmetleri
      level: 1
      id: s6-2
    - p: Bir protez merkeziyle yapılacak iş birliği kapsamında, uzuv kaybı nedeniyle proteze ihtiyaç duyan hastalara değerlendirme, protez uygulaması ve rehabilitasyon hizmetleri sunulması hedeflenmektedir.
    - lab: Hizmet Sürecinin Aşamaları
    - lab: Değerlendirme
    - ul:
      - Tıbbi değerlendirme
      - Hastanın ihtiyaçlarının belirlenmesi
    - lab: Protez Uygulaması
    - ul:
      - Hastanın ihtiyacına uygun protezin belirlenmesi
      - Protezin hastaya uyumlandırması
    - lab: Uyum ve Rehabilitasyon
    - ul:
      - Protez kullanımı eğitimi
      - Rehabilitasyon hizmetleri
      - Düzenli kontrol ve değerlendirme
    - h: Fizik Tedavi ve Ameliyat Sonrası Rehabilitasyon Hizmetleri
      toc: Fizik Tedavi ve Ameliyat Sonrası Rehabilitasyon Hizmetleri
      level: 1
      id: s6-3
    - p: Amacımız yalnızca protez temin etmek değil, hastaların protezlerini etkin şekilde kullanabilmelerini, günlük yaşamlarını mümkün olduğunca bağımsız sürdürebilmelerini ve hareket kabiliyetlerini yeniden kazanmalarını desteklemektir.
    - p: Bir fizik tedavi ve rehabilitasyon merkeziyle yapılacak iş birliği kapsamında, yaralanan hastaların tedavi sonrası iyileşme süreçlerini destekleyecek rehabilitasyon hizmetleri sunulması hedeflenmektedir.
    - lab: Öncelikli Hizmet Alanları
    - ul:
      - Ameliyat sonrası rehabilitasyon
      - Hareket kabiliyetinin ve günlük yaşam becerilerinin yeniden kazanılması
      - Protez uygulaması sonrasında rehabilitasyon
      - İyileşme sürecinin düzenli takibi
    - p: Temel yaklaşımımız, ameliyat sonrası bakımdan rehabilitasyon sürecine kadar hastaların hareket kabiliyetlerini ve günlük yaşamlarını bağımsız sürdürebilme becerilerini yeniden kazanmalarını desteklemektir.
    - h: 'Tedaviden İyileşmeye: Bütüncül Hasta Bakım Modeli'
      toc: 'Tedaviden İyileşmeye: Bütüncül Hasta Bakım Modeli'
      level: 1
      id: s6-4
    - p: Başarılı bir cerrahi müdahale, iyileşme sürecinin yalnızca başlangıcıdır. Hastanın sağlığına kavuşabilmesi için ameliyat sonrasında bakım, rehabilitasyon ve düzenli takip hizmetlerinin devam etmesi gerekir.
    - lab: Koordineli Hasta Bakım Süreci
    - ul:
      - Değerlendirme
      - Tedavi
      - İyileşme
      - Rehabilitasyon
      - Takip
    - p: Bu yaklaşımla hastanın tedavi, bakım ve rehabilitasyon ihtiyaçlarının birbiriyle bağlantılı şekilde ele alınması ve tüm sürecin düzenli olarak takip edilmesi amaçlanmaktadır.
    - h: Çocuklara Yönelik Ruh Sağlığı ve Psikososyal Destek Programları
      toc: Çocuklara Yönelik Ruh Sağlığı ve Psikososyal Destek Programları
      level: 1
      id: s6-5
    - p: Mısır'da erişim sağlanan 13 okul aracılığıyla, çocukların psikososyal gelişimlerini destekleyen yapılandırılmış okul temelli programların uygulanması hedeflenmektedir.
    - p: Bu okullar aracılığıyla çocukların psikolojik dayanıklılıklarını güçlendiren ve kendilerini güvende hissetmelerine yardımcı olan destek çalışmaları yürütülmesi amaçlanmaktadır.
    - lab: Çocukların Duygusal ve Psikolojik Gelişiminin Desteklenmesi
    - ul:
      - Çocukların psikolojik dayanıklılığını güçlendiren faaliyetler
      - Kendilerini güvende hissetmelerini destekleyen çocuk odaklı etkinlikler
      - Duygusal gelişimi destekleyen çalışmalar
    - lab: Uzman Desteğine Yönlendirme Mekanizmaları
    - ul:
      - Ek desteğe ihtiyaç duyan çocukların belirlenmesi
      - İhtiyaç duyan çocukların uzmanlara yönlendirilmesi
      - Gerekli destek mekanizmalarıyla bağlantı kurulması
    - h: Temel İnsani Yardım ve Aile Destek Hizmetleri
      toc: Temel İnsani Yardım ve Aile Destek Hizmetleri
      level: 1
      id: s6-6
    - h: Gıda Kolisi Desteği
      toc: Gıda Kolisi Desteği
      level: 2
      id: s6-7
    - p: Savaş ve zorunlu göç nedeniyle gıdaya erişimde güçlük yaşayan ihtiyaç sahibi ailelere temel gıda ürünlerinden oluşan yardım kolilerinin ulaştırılması.
    - h: Ailelere Düzenli Aylık Nakdî Destek
      toc: Ailelere Düzenli Aylık Nakdî Destek
      level: 2
      id: s6-8
    - p: Savaş nedeniyle yerinden edilmiş, gelir kaynaklarını kaybetmiş veya geçim sıkıntısı yaşayan ailelere; kira, gıda, hijyen, giyim, elektrik ve su gibi temel ihtiyaçlarını karşılayabilmeleri için düzenli nakdî yardım yapılması.
    - h: Kira ve Barınma Desteği
      toc: Kira ve Barınma Desteği
      level: 2
      id: s6-9
    - p: Savaş nedeniyle evlerini terk ederek Mısır'a sığınmak zorunda kalan ailelerin barınma ihtiyaçlarına katkı sağlamak amacıyla kira yardımı yapılması.
    - p: Bu destekle ailelerin kira giderlerini karşılayabilmelerine, barınma sorunlarını hafifletmelerine ve daha güvenli koşullarda yaşamalarını sürdürmelerine katkı sağlanması amaçlanmaktadır.
    - h: Mısır'da Kapsamlı Sağlık Hizmetleri İçin Yerel Uygulama ve İş Birliği Ağı
      toc: Mısır'da Kapsamlı Sağlık Hizmetleri İçin Yerel Uygulama ve İş Birliği Ağı
      level: 1
      id: s7-0
    - p: Kurumumuz, insani yardım alanında faaliyet gösteren paydaşları Mısır'daki yerel sağlık hizmeti sağlayıcılarıyla buluşturmayı ve hastaların müdahale aşamasından iyileşme, rehabilitasyon, takip ve dokümantasyon süreçlerine kadar koordinasyonunu sağlamayı hedeflemektedir.
    - h: İş Birliği ve Proje Geliştirme Alanları
      toc: İş Birliği ve Proje Geliştirme Alanları
      level: 1
      id: s7-1
    - ul:
      - Ortak sağlık hizmetleri ve cerrahi destek programları
      - Kapsamlı protez ve rehabilitasyon projeleri
      - Ameliyat sonrası bakım ve hasta takip programları
      - Okul temelli psikososyal destek projeleri
    - lab: Kurumumuzun Sağlayacağı Katkılar
    - ul:
      - Yerel sağlık kuruluşlarıyla iş birliği ağı
      - Hasta süreçlerinin koordinasyonu
      - Tedavi ve rehabilitasyon süreçlerinin takibi
      - Hasta kayıtlarının ve hizmet süreçlerinin dokümantasyonu
  note: Rakamlar, raporlama dönemi için mevcut en güncel insani verileri yansıtmaktadır. Kaynaklar; UN OCHA, WFP, WHO ve UNICEF'in resmi insani durum güncellemeleri ile sektörel raporlarını içermektedir.
en:
  country_name: Egypt
  head_sizes: [13, 12, 11]
  title: Egypt — Humanitarian Situation Overview
  summary: Egypt continues to play a major humanitarian and health-response role for Palestinians from Gaza who have entered the country since the start of the crisis. This population includes medical evacuees, accompanying family members and other displaced…
  figures:
  - value: 100K+
    label: Displaced Palestinians reported in Egypt
  - value: 6.6K+
    label: Gaza medical evacuees received by Egypt
  - value: 9.3K+
    label: Companions received with medical evacuees
  - value: 18.5K+
    label: Patients in Gaza still requiring medical evacuation
  toc_deep: true
  static_header: true
  compact: true
  sections:
  - kind: context
    kicker: CURRENT CONTEXT
    title: Situation Overview
    toc: Situation overview
    text: Egypt continues to play a major humanitarian and health-response role for Palestinians from Gaza who have entered the country since the start of the crisis. This population includes medical evacuees, accompanying family members and other displaced Palestinians. Many face continuing needs related to specialized healthcare, medication, rehabilitation, psychosocial support, accommodation and basic living costs, while uncertainty around return and movement remains a major protection concern.
  - kind: needs
    kicker: HUMANITARIAN NEEDS
    title: Priority Humanitarian Needs
    toc: Priority humanitarian needs
    text: Priority needs include continued specialized medical treatment and rehabilitation for evacuated patients, medicines and assistive devices, psychosocial support, temporary accommodation, basic assistance and support for accompanying family members. Particular attention is required for children, people with disabilities, patients with chronic or complex conditions and households with limited financial resources.
  - kind: priorities
    kicker: RESPONSE FOCUS
    title: Key Response Priorities
    toc: Key response priorities
    text: Response priorities include sustaining treatment and referral pathways for Palestinian patients, supporting Egyptian hospitals and health personnel receiving evacuees, strengthening rehabilitation and psychosocial services, and providing targeted basic assistance to vulnerable Palestinian families in Egypt. Coordination should also support safe, dignified and voluntary movement when conditions allow.
  - kicker: INSTITUTIONAL CAPACITY
    title: Our Official Representation, Operational and Institutional Capacity in Egypt
    toc: Our official representation, operational and institutional capacity in Egypt
    blocks:
    - p: In Egypt, we carry out humanitarian aid and social support activities for Palestinian and Sudanese individuals and families who have been forced to leave their countries because of war and forced displacement. We implement our activities across different program areas, taking into account the needs and priorities of both communities.
    - h: Official Representation and Institutional Partnerships
      toc: Official Representation and Institutional Partnerships
      level: 1
      id: s4-1
    - p: As İnsanlık Eli Association, we have an official representative in Egypt. Our association carries out its activities in Egypt in accordance with the relevant legislation and official procedures. Accordingly, we have the institutional framework to carry out our activities within the scope of protocols, cooperation agreements and memoranda of understanding with the relevant official institutions in Egypt.
    - h: Financial Transactions through Official Banking Channels
      toc: Financial Transactions through Official Banking Channels
      level: 1
      id: s4-2
    - p: The financial resources needed for humanitarian activities and projects can be sent to and received in Egypt through official banking channels. This allows project budgets and aid resources to be managed through the banking system in a recorded and traceable way.
    - h: Large-Scale Events and Social Activities
      toc: Large-Scale Events and Social Activities
      level: 1
      id: s4-3
    - p: Our association is able to carry out the permit procedures required to organize aid events and social activities involving large numbers of families and participants in Egypt. Collective iftar programs, aid distributions and similar large-scale events can be organized once the necessary permits have been obtained from the relevant authorities.
  - kicker: AREAS OF ACTIVITY
    title: Our Main Areas of Activity in Egypt
    toc: Our main areas of activity in Egypt
    blocks:
    - h: Health and Rehabilitation Services
      toc: Health and Rehabilitation Services
      level: 1
      id: s5-1
    - ul:
      - Surgical and specialized health services
      - Prosthetic services and rehabilitation
      - Physical therapy and post-operative recovery
      - Mental health and psychosocial support for children
    - h: Basic Humanitarian Aid and Family Support Services
      toc: Basic Humanitarian Aid and Family Support Services
      level: 1
      id: s5-2
    - ul:
      - Food Parcel Support
      - Regular Monthly Cash Support for Families
      - Rent and Shelter Support
    - h: Our Humanitarian Aid and Support Activities for Palestinians
      toc: Our Humanitarian Aid and Support Activities for Palestinians
      level: 1
      id: s5-3
      nav: true
    - p: We carry out health, rehabilitation, psychosocial support and basic humanitarian aid activities for Palestinian individuals and families who were evacuated to Egypt because of the war in Gaza, or who were displaced and have had to continue their lives in Egypt.
    - p: Through partnerships with healthcare providers operating in Egypt, our organization aims to provide comprehensive services in specialized healthcare, prosthetics, rehabilitation and psychosocial support. In this context, health and care support for patients evacuated from Gaza is also among our areas of activity.
    - h: Health, treatment and care services
      toc: Health, treatment and care services
      level: 2
      id: s5-4
    - ul:
      - Access to surgical interventions and specialized health services
      - Pre-operative assessment, surgery and post-operative care
      - Medication support and monitoring of the recovery process
      - Prosthetic fitting, prosthesis adjustment and training in its use
      - Physical therapy and rehabilitation services
      - Coordination of post-treatment follow-up and care
    - h: Psychosocial support for children
      toc: Psychosocial support for children
      level: 2
      id: s5-5
    - ul:
      - Psychosocial support programs for children through 13 schools in Egypt
      - Supporting children’s emotional well-being and psychological resilience
      - Carrying out activities that help children feel safe, and referring those in need to specialist support
    - h: Basic humanitarian aid and household support
      toc: Basic humanitarian aid and household support
      level: 2
      id: s5-6
    - ul:
      - 'Food parcel support: Delivering parcels of basic food items to families facing food insecurity.'
      - 'Regular monthly cash support for families: Providing regular cash support to families who have lost their income or face serious economic hardship, so that they can meet basic needs such as rent, food, hygiene, clothing, electricity and water.'
      - 'Rent and shelter support: Supporting families displaced by the war with their housing needs and rent payments in Egypt.'
    - h: Our Humanitarian Aid and Support Activities for Sudanese People
      toc: Our Humanitarian Aid and Support Activities for Sudanese People
      level: 1
      id: s5-7
      nav: true
    - p: In our work with Sudanese families, we also continue the health, rehabilitation, psychosocial support and basic humanitarian aid programs that we carry out for Palestinian families. In this context, we provide health and treatment support, prosthetic and rehabilitation services, psychosocial support for children, food parcels, regular cash assistance, and rent and shelter support.
    - p: In addition, we organize vocational training and skills development programs for Sudanese people.
    - ul:
      - Organizing vocational training courses
      - Offering courses to learn a trade in different fields
      - Developing participants’ professional knowledge and skills
      - Supporting their access to employment opportunities and economic independence
    - h: Detailed Description of Our Activities
      toc: Detailed Description of Our Activities
      level: 1
      id: s6-0
      nav: true
      style: main
    - h: Surgical Services and Partnerships with Health Institutions
      toc: Surgical Services and Partnerships with Health Institutions
      level: 1
      id: s6-1
    - p: Through partnerships with health institutions, the aim is for patients to benefit from surgical interventions and health services provided by specialist physicians.
    - lab: Stages of the Patient Care Process
    - ul:
      - Pre-operative medical assessment
      - Surgical intervention
      - Post-operative medication and care
      - Monitoring the patient’s recovery process
    - p: With this model, the aim is for patients to receive regular and coordinated healthcare from the initial assessment to treatment, and from post-operative care to the completion of their recovery.
    - h: Comprehensive Prosthetic Services
      toc: Comprehensive Prosthetic Services
      level: 1
      id: s6-2
    - p: Through a partnership with a prosthetics center, the aim is to provide assessment, prosthetic fitting and rehabilitation services to patients who need a prosthesis because of limb loss.
    - lab: Stages of the Service Process
    - lab: Assessment
    - ul:
      - Medical assessment
      - Identifying the patient’s needs
    - lab: Prosthetic Fitting
    - ul:
      - Determining the prosthesis suited to the patient’s needs
      - Fitting the prosthesis to the patient
    - lab: Adaptation and Rehabilitation
    - ul:
      - Training in prosthesis use
      - Rehabilitation services
      - Regular check-ups and assessment
    - h: Physical Therapy and Post-Operative Rehabilitation Services
      toc: Physical Therapy and Post-Operative Rehabilitation Services
      level: 1
      id: s6-3
    - p: Our aim is not only to provide prostheses, but also to help patients use their prostheses effectively, carry on their daily lives as independently as possible and regain their mobility.
    - p: Through a partnership with a physical therapy and rehabilitation center, the aim is to provide rehabilitation services that support injured patients’ recovery after treatment.
    - lab: Priority Service Areas
    - ul:
      - Post-operative rehabilitation
      - Regaining mobility and daily living skills
      - Rehabilitation after prosthetic fitting
      - Regular monitoring of the recovery process
    - p: Our core approach is to help patients, from post-operative care through to rehabilitation, regain their mobility and their ability to carry on their daily lives independently.
    - h: 'From Treatment to Recovery: A Holistic Patient Care Model'
      toc: 'From Treatment to Recovery: A Holistic Patient Care Model'
      level: 1
      id: s6-4
    - p: A successful surgical intervention is only the beginning of the recovery process. For patients to regain their health, care, rehabilitation and regular follow-up services must continue after surgery.
    - lab: Coordinated Patient Care Process
    - ul:
      - Assessment
      - Treatment
      - Recovery
      - Rehabilitation
      - Follow-up
    - p: With this approach, the aim is to address the patient’s treatment, care and rehabilitation needs in a connected way and to follow the entire process regularly.
    - h: Mental Health and Psychosocial Support Programs for Children
      toc: Mental Health and Psychosocial Support Programs for Children
      level: 1
      id: s6-5
    - p: Through the 13 schools we have access to in Egypt, the aim is to implement structured school-based programs that support children’s psychosocial development.
    - p: Through these schools, the aim is to carry out support activities that strengthen children’s psychological resilience and help them feel safe.
    - lab: Supporting Children’s Emotional and Psychological Development
    - ul:
      - Activities that strengthen children’s psychological resilience
      - Child-focused activities that help them feel safe
      - Activities that support emotional development
    - lab: Referral Mechanisms to Specialist Support
    - ul:
      - Identifying children who need additional support
      - Referring children in need to specialists
      - Connecting them with the necessary support mechanisms
    - h: Basic Humanitarian Aid and Family Support Services
      toc: Basic Humanitarian Aid and Family Support Services
      level: 1
      id: s6-6
    - h: Food Parcel Support
      toc: Food Parcel Support
      level: 2
      id: s6-7
    - p: Delivering aid parcels of basic food items to families in need who have difficulty accessing food because of war and forced displacement.
    - h: Regular Monthly Cash Support for Families
      toc: Regular Monthly Cash Support for Families
      level: 2
      id: s6-8
    - p: Providing regular cash assistance to families who have been displaced by the war, have lost their sources of income or are struggling to make a living, so that they can meet basic needs such as rent, food, hygiene, clothing, electricity and water.
    - h: Rent and Shelter Support
      toc: Rent and Shelter Support
      level: 2
      id: s6-9
    - p: Providing rent assistance to help meet the housing needs of families who were forced to leave their homes because of the war and take refuge in Egypt.
    - p: This support aims to help families cover their rent costs, ease their housing problems and continue living in safer conditions.
    - h: Local Implementation and Partnership Network for Comprehensive Health Services in Egypt
      toc: Local Implementation and Partnership Network for Comprehensive Health Services in Egypt
      level: 1
      id: s7-0
    - p: Our organization aims to bring stakeholders working in the humanitarian field together with local healthcare providers in Egypt, and to coordinate patients’ care from the intervention stage through recovery, rehabilitation, follow-up and documentation.
    - h: Areas of Cooperation and Project Development
      toc: Areas of Cooperation and Project Development
      level: 1
      id: s7-1
    - ul:
      - Joint health service and surgical support programs
      - Comprehensive prosthetics and rehabilitation projects
      - Post-operative care and patient follow-up programs
      - School-based psychosocial support projects
    - lab: Our Organization’s Contributions
    - ul:
      - A partnership network with local health institutions
      - Coordination of patient processes
      - Monitoring of treatment and rehabilitation processes
      - Documentation of patient records and service processes
  note: Figures reflect the latest available humanitarian data for the reporting period. Sources include official humanitarian situation updates and sector-specific reporting from UN OCHA, WFP, WHO and UNICEF.
ar:
  country_name: مصر
  head_sizes: [13, 12, 11]
  title: مصر — نظرة عامة على الوضع الإنساني
  summary: تواصل مصر أداء دور إنساني وصحي رئيسي للفلسطينيين القادمين من قطاع غزة منذ بداية الأزمة. وتشمل هذه الفئة المرضى الذين تم إجلاؤهم طبيًا، وأفراد أسرهم المرافقين، وغيرهم من الفلسطينيين النازحين. ويواجه كثيرون احتياجات مستمرة تتعلق بالرعاية الطبية التخصصية…
  figures:
  - value: 100K+
    label: فلسطينيون نازحون مُبلّغ عن وجودهم في مصر
  - value: 6.6K+
    label: مرضى من غزة استقبلتهم مصر للإجلاء الطبي
  - value: 9.3K+
    label: مرافقون وصلوا مع حالات الإجلاء الطبي
  - value: 18.5K+
    label: مرضى في غزة ما زالوا بحاجة إلى إجلاء طبي
  toc_deep: true
  static_header: true
  compact: true
  sections:
  - kind: context
    kicker: السياق الحالي
    title: نظرة عامة على الوضع
    text: تواصل مصر أداء دور إنساني وصحي رئيسي للفلسطينيين القادمين من قطاع غزة منذ بداية الأزمة. وتشمل هذه الفئة المرضى الذين تم إجلاؤهم طبيًا، وأفراد أسرهم المرافقين، وغيرهم من الفلسطينيين النازحين. ويواجه كثيرون احتياجات مستمرة تتعلق بالرعاية الطبية التخصصية والأدوية وإعادة التأهيل والدعم النفسي والاجتماعي والسكن وتكاليف المعيشة الأساسية، في ظل استمرار حالة عدم اليقين المرتبطة بالعودة والحركة.
  - kind: needs
    kicker: الاحتياجات الإنسانية
    title: الاحتياجات الإنسانية ذات الأولوية
    text: تشمل الاحتياجات ذات الأولوية استمرار العلاج الطبي التخصصي وإعادة التأهيل للمرضى الذين تم إجلاؤهم، وتوفير الأدوية والأجهزة المساعدة، والدعم النفسي والاجتماعي، والسكن المؤقت، والمساعدات الأساسية، ودعم أفراد الأسر المرافقين. ويجب إيلاء اهتمام خاص للأطفال والأشخاص ذوي الإعاقة والمرضى الذين يعانون من حالات مزمنة أو معقدة والأسر محدودة الموارد المالية.
  - kind: priorities
    kicker: أولويات الاستجابة
    title: أولويات الاستجابة الرئيسية
    text: تشمل أولويات الاستجابة الحفاظ على مسارات العلاج والإحالة للمرضى الفلسطينيين، ودعم المستشفيات المصرية والعاملين الصحيين الذين يستقبلون الحالات المحالة، وتعزيز خدمات إعادة التأهيل والدعم النفسي والاجتماعي، وتقديم مساعدات أساسية موجهة للأسر الفلسطينية الأكثر هشاشة في مصر. كما ينبغي أن يدعم التنسيق الحركة الآمنة والكريمة والطوعية عندما تسمح الظروف بذلك.
  - kicker: القدرات المؤسسية
    title: تمثيلنا الرسمي وقدراتنا التشغيلية والمؤسسية في مصر
    toc: تمثيلنا الرسمي وقدراتنا التشغيلية والمؤسسية في مصر
    blocks:
    - p: ننفّذ في مصر أنشطة إغاثية وإنسانية وأنشطة دعم اجتماعي لصالح الأفراد والأسر الفلسطينية والسودانية الذين اضطروا إلى مغادرة بلدانهم بسبب الحرب والتهجير القسري. ونُنفّذ أنشطتنا في مجالات برامجية متعددة، مع مراعاة احتياجات المجتمعين وأولوياتهما.
    - h: التمثيل الرسمي والشراكات المؤسسية
      toc: التمثيل الرسمي والشراكات المؤسسية
      level: 1
      id: s4-1
    - p: لدى جمعية يد الإنسانية ممثل رسمي في مصر. وتمارس جمعيتنا أنشطتها في مصر وفقًا للتشريعات ذات الصلة والإجراءات الرسمية المعتمدة. وفي هذا الإطار، نمتلك البنية المؤسسية التي تتيح لنا تنفيذ أنشطتنا ضمن إطار البروتوكولات واتفاقيات التعاون ومذكرات التفاهم المبرمة مع المؤسسات الرسمية المعنية في مصر.
    - h: المعاملات المالية عبر القنوات المصرفية الرسمية
      toc: المعاملات المالية عبر القنوات المصرفية الرسمية
      level: 1
      id: s4-2
    - p: يمكن إرسال الموارد المالية اللازمة للأنشطة والمشاريع الإنسانية إلى مصر واستلامها فيها عبر القنوات المصرفية الرسمية. وبذلك يمكن إدارة ميزانيات المشاريع وموارد المساعدات من خلال النظام المصرفي بصورة موثّقة وقابلة للتتبّع.
    - h: الفعاليات الجماعية والأنشطة الاجتماعية
      toc: الفعاليات الجماعية والأنشطة الاجتماعية
      level: 1
      id: s4-3
    - p: تستطيع جمعيتنا استكمال إجراءات الحصول على التصاريح اللازمة لتنظيم الفعاليات الإغاثية والأنشطة الاجتماعية التي يشارك فيها عدد كبير من الأسر والمشاركين في مصر. ويمكن تنظيم موائد الإفطار الجماعية وتوزيع المساعدات وغيرها من الفعاليات واسعة المشاركة بعد الحصول على التصاريح اللازمة من الجهات المختصة.
  - kicker: مجالات العمل
    title: مجالات عملنا الرئيسية في مصر
    toc: مجالات عملنا الرئيسية في مصر
    blocks:
    - h: الخدمات الصحية وخدمات إعادة التأهيل
      toc: الخدمات الصحية وخدمات إعادة التأهيل
      level: 1
      id: s5-1
    - ul:
      - الخدمات الجراحية والصحية التخصصية
      - خدمات الأطراف الصناعية وإعادة التأهيل
      - العلاج الطبيعي ومراحل التعافي بعد العمليات الجراحية
      - الصحة النفسية والدعم النفسي والاجتماعي للأطفال
    - h: خدمات المساعدات الإنسانية الأساسية ودعم الأسر
      toc: خدمات المساعدات الإنسانية الأساسية ودعم الأسر
      level: 1
      id: s5-2
    - ul:
      - دعم السلال الغذائية
      - الدعم النقدي الشهري المنتظم للأسر
      - دعم الإيجار والإيواء
    - h: أنشطتنا الإنسانية والداعمة للفلسطينيين
      toc: أنشطتنا الإنسانية والداعمة للفلسطينيين
      level: 1
      id: s5-3
      nav: true
    - p: ننفّذ أنشطة في مجالات الصحة وإعادة التأهيل والدعم النفسي والاجتماعي والمساعدات الإنسانية الأساسية لصالح الأفراد والأسر الفلسطينية الذين أُجلوا إلى مصر بسبب الحرب في غزة، أو الذين نزحوا واضطروا إلى مواصلة حياتهم في مصر.
    - p: تهدف مؤسستنا، من خلال الشراكات التي أقامتها مع مقدّمي الخدمات الصحية العاملين في مصر، إلى تقديم خدمات شاملة في مجالات الرعاية الصحية التخصصية، والأطراف الصناعية، وإعادة التأهيل، والدعم النفسي والاجتماعي. وفي هذا الإطار، يُعدّ تقديم الدعم الصحي والرعاية للمرضى الذين أُجلوا من غزة من ضمن مجالات عملنا أيضًا.
    - h: خدمات الصحة والعلاج والرعاية
      toc: خدمات الصحة والعلاج والرعاية
      level: 2
      id: s5-4
    - ul:
      - الوصول إلى التدخلات الجراحية والخدمات الصحية التخصصية
      - التقييم قبل العملية، وإجراء العملية الجراحية، والرعاية بعد العملية
      - توفير الأدوية ومتابعة مرحلة التعافي
      - تركيب الأطراف الصناعية وضبطها والتدريب على استخدامها
      - خدمات العلاج الطبيعي وإعادة التأهيل
      - تنسيق المتابعة والرعاية بعد العلاج
    - h: الدعم النفسي والاجتماعي للأطفال
      toc: الدعم النفسي والاجتماعي للأطفال
      level: 2
      id: s5-5
    - ul:
      - برامج الدعم النفسي والاجتماعي للأطفال من خلال 13 مدرسة في مصر
      - دعم السلامة العاطفية للأطفال وتعزيز مرونتهم النفسية
      - تنفيذ أنشطة تساعد الأطفال على الشعور بالأمان، وإحالة من يحتاج منهم إلى الدعم المتخصص
    - h: المساعدات الإنسانية الأساسية ودعم الأسر
      toc: المساعدات الإنسانية الأساسية ودعم الأسر
      level: 2
      id: s5-6
    - ul:
      - 'دعم السلال الغذائية: إيصال سلال تحتوي على المواد الغذائية الأساسية إلى الأسر التي تعاني من انعدام الأمن الغذائي.'
      - 'الدعم النقدي الشهري المنتظم للأسر: تقديم دعم نقدي منتظم للأسر التي فقدت مصدر دخلها أو تعاني من ضائقة اقتصادية شديدة، لتتمكن من تلبية احتياجاتها الأساسية مثل الإيجار والغذاء والنظافة الشخصية والملابس والكهرباء والمياه.'
      - 'دعم الإيجار والإيواء: دعم الأسر التي نزحت بسبب الحرب في تلبية احتياجاتها من السكن ودفع الإيجار في مصر.'
    - h: أنشطتنا الإنسانية والداعمة للسودانيين
      toc: أنشطتنا الإنسانية والداعمة للسودانيين
      level: 1
      id: s5-7
      nav: true
    - p: نواصل في عملنا مع الأسر السودانية تنفيذ برامج الصحة وإعادة التأهيل والدعم النفسي والاجتماعي والمساعدات الإنسانية الأساسية نفسها التي ننفّذها للأسر الفلسطينية. وفي هذا الإطار، نقدّم الدعم الصحي والعلاجي، وخدمات الأطراف الصناعية وإعادة التأهيل، والدعم النفسي والاجتماعي للأطفال، والسلال الغذائية، والمساعدات النقدية المنتظمة، ودعم الإيجار والإيواء.
    - p: وإلى جانب ذلك، ننظّم برامج للتدريب المهني وتنمية المهارات لصالح السودانيين.
    - ul:
      - تنظيم دورات للتدريب المهني
      - تقديم دورات لاكتساب المهن في مجالات مختلفة
      - تنمية المعارف والمهارات المهنية لدى المشاركين
      - دعم وصولهم إلى فرص العمل وتحقيق الاستقلال الاقتصادي
    - h: شرح مفصل لأنشطتنا
      toc: شرح مفصل لأنشطتنا
      level: 1
      id: s6-0
      nav: true
      style: main
    - h: الخدمات الجراحية والشراكات مع المؤسسات الصحية
      toc: الخدمات الجراحية والشراكات مع المؤسسات الصحية
      level: 1
      id: s6-1
    - p: نهدف، من خلال الشراكات مع المؤسسات الصحية، إلى تمكين المرضى من الاستفادة من التدخلات الجراحية والخدمات الصحية التي يقدّمها الأطباء المتخصصون.
    - lab: مراحل عملية رعاية المريض
    - ul:
      - التقييم الطبي قبل العملية
      - التدخل الجراحي
      - العلاج الدوائي والرعاية بعد العملية
      - متابعة مرحلة تعافي المريض
    - p: ويهدف هذا النموذج إلى حصول المرضى على رعاية صحية منتظمة ومنسّقة، بدءًا من التقييم الأولي وحتى العلاج، ومن الرعاية بعد العملية حتى اكتمال مرحلة التعافي.
    - h: خدمات الأطراف الصناعية الشاملة
      toc: خدمات الأطراف الصناعية الشاملة
      level: 1
      id: s6-2
    - p: نهدف، في إطار شراكة مع أحد مراكز الأطراف الصناعية، إلى تقديم خدمات التقييم وتركيب الأطراف الصناعية وإعادة التأهيل للمرضى الذين يحتاجون إلى طرف صناعي بسبب فقدان أحد أطرافهم.
    - lab: مراحل تقديم الخدمة
    - lab: التقييم
    - ul:
      - التقييم الطبي
      - تحديد احتياجات المريض
    - lab: تركيب الطرف الصناعي
    - ul:
      - تحديد الطرف الصناعي المناسب لاحتياجات المريض
      - ضبط الطرف الصناعي وملاءمته للمريض
    - lab: التكيّف وإعادة التأهيل
    - ul:
      - التدريب على استخدام الطرف الصناعي
      - خدمات إعادة التأهيل
      - الفحص والتقييم الدوري
    - h: خدمات العلاج الطبيعي وإعادة التأهيل بعد العمليات الجراحية
      toc: خدمات العلاج الطبيعي وإعادة التأهيل بعد العمليات الجراحية
      level: 1
      id: s6-3
    - p: لا يقتصر هدفنا على توفير الأطراف الصناعية، بل يشمل أيضًا دعم المرضى ليتمكنوا من استخدام أطرافهم الصناعية بفعالية، ومواصلة حياتهم اليومية باستقلالية قدر الإمكان، واستعادة قدرتهم على الحركة.
    - p: ونهدف، في إطار شراكة مع أحد مراكز العلاج الطبيعي وإعادة التأهيل، إلى تقديم خدمات إعادة تأهيل تدعم مرحلة تعافي المرضى المصابين بعد العلاج.
    - lab: مجالات الخدمة ذات الأولوية
    - ul:
      - إعادة التأهيل بعد العمليات الجراحية
      - استعادة القدرة على الحركة ومهارات الحياة اليومية
      - إعادة التأهيل بعد تركيب الأطراف الصناعية
      - المتابعة المنتظمة لمرحلة التعافي
    - p: يتمثّل نهجنا الأساسي في دعم المرضى، من الرعاية بعد العملية وحتى مرحلة إعادة التأهيل، لاستعادة قدرتهم على الحركة وعلى مواصلة حياتهم اليومية باستقلالية.
    - h: 'من العلاج إلى التعافي: نموذج الرعاية المتكاملة للمرضى'
      toc: 'من العلاج إلى التعافي: نموذج الرعاية المتكاملة للمرضى'
      level: 1
      id: s6-4
    - p: ليس التدخل الجراحي الناجح سوى بداية مرحلة التعافي. ولكي يستعيد المريض صحته، لا بدّ من استمرار خدمات الرعاية وإعادة التأهيل والمتابعة المنتظمة بعد العملية.
    - lab: عملية الرعاية المنسّقة للمريض
    - ul:
      - التقييم
      - العلاج
      - التعافي
      - إعادة التأهيل
      - المتابعة
    - p: ويهدف هذا النهج إلى معالجة احتياجات المريض العلاجية والرعائية والتأهيلية بصورة مترابطة، ومتابعة العملية بأكملها بانتظام.
    - h: برامج الصحة النفسية والدعم النفسي والاجتماعي للأطفال
      toc: برامج الصحة النفسية والدعم النفسي والاجتماعي للأطفال
      level: 1
      id: s6-5
    - p: نهدف، من خلال 13 مدرسة تمكّنّا من الوصول إليها في مصر، إلى تنفيذ برامج منظّمة قائمة على المدارس تدعم النمو النفسي والاجتماعي للأطفال.
    - p: ونسعى من خلال هذه المدارس إلى تنفيذ أنشطة دعم تعزّز المرونة النفسية لدى الأطفال وتساعدهم على الشعور بالأمان.
    - lab: دعم النمو العاطفي والنفسي للأطفال
    - ul:
      - أنشطة تعزّز المرونة النفسية لدى الأطفال
      - أنشطة تتمحور حول الطفل وتساعده على الشعور بالأمان
      - أنشطة تدعم النمو العاطفي
    - lab: آليات الإحالة إلى الدعم المتخصص
    - ul:
      - تحديد الأطفال الذين يحتاجون إلى دعم إضافي
      - إحالة الأطفال المحتاجين إلى المتخصصين
      - ربطهم بآليات الدعم اللازمة
    - h: خدمات المساعدات الإنسانية الأساسية ودعم الأسر
      toc: خدمات المساعدات الإنسانية الأساسية ودعم الأسر
      level: 1
      id: s6-6
    - h: دعم السلال الغذائية
      toc: دعم السلال الغذائية
      level: 2
      id: s6-7
    - p: إيصال سلال مساعدات تحتوي على المواد الغذائية الأساسية إلى الأسر المحتاجة التي تواجه صعوبة في الحصول على الغذاء بسبب الحرب والتهجير القسري.
    - h: الدعم النقدي الشهري المنتظم للأسر
      toc: الدعم النقدي الشهري المنتظم للأسر
      level: 2
      id: s6-8
    - p: تقديم مساعدات نقدية منتظمة للأسر التي نزحت بسبب الحرب أو فقدت مصادر دخلها أو تعاني من صعوبات معيشية، لتتمكن من تلبية احتياجاتها الأساسية مثل الإيجار والغذاء والنظافة الشخصية والملابس والكهرباء والمياه.
    - h: دعم الإيجار والإيواء
      toc: دعم الإيجار والإيواء
      level: 2
      id: s6-9
    - p: تقديم مساعدات لدفع الإيجار بهدف المساهمة في تلبية احتياجات السكن للأسر التي اضطرت إلى ترك منازلها بسبب الحرب واللجوء إلى مصر.
    - p: ويهدف هذا الدعم إلى مساعدة الأسر على تغطية نفقات الإيجار، والتخفيف من مشكلات السكن، ومواصلة حياتها في ظروف أكثر أمانًا.
    - h: شبكة التنفيذ المحلي والشراكات لتقديم خدمات صحية شاملة في مصر
      toc: شبكة التنفيذ المحلي والشراكات لتقديم خدمات صحية شاملة في مصر
      level: 1
      id: s7-0
    - p: تهدف مؤسستنا إلى الربط بين الجهات العاملة في المجال الإنساني ومقدّمي الخدمات الصحية المحليين في مصر، وإلى تنسيق رعاية المرضى بدءًا من مرحلة التدخل، مرورًا بالتعافي وإعادة التأهيل والمتابعة، وصولًا إلى التوثيق.
    - h: مجالات التعاون وتطوير المشاريع
      toc: مجالات التعاون وتطوير المشاريع
      level: 1
      id: s7-1
    - ul:
      - برامج مشتركة للخدمات الصحية والدعم الجراحي
      - مشاريع شاملة للأطراف الصناعية وإعادة التأهيل
      - برامج الرعاية بعد العمليات الجراحية ومتابعة المرضى
      - مشاريع الدعم النفسي والاجتماعي القائمة على المدارس
    - lab: إسهامات مؤسستنا
    - ul:
      - شبكة شراكات مع المؤسسات الصحية المحلية
      - تنسيق إجراءات المرضى
      - متابعة مراحل العلاج وإعادة التأهيل
      - توثيق سجلات المرضى ومراحل تقديم الخدمات
  note: تعكس الأرقام أحدث البيانات الإنسانية المتاحة لفترة التقرير. وتشمل المصادر تحديثات الوضع الإنساني الرسمية والتقارير القطاعية الصادرة عن مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية وبرنامج الأغذية العالمي ومنظمة الصحة العالمية واليونيسف.

  sections:
  - kind: context
    kicker: MEVCUT DURUM
    title: Durum Genel Görünümü
    text: Mısır, krizin başlangıcından bu yana Gazze’den ülkeye gelen Filistinliler için önemli bir insani yardım ve sağlık müdahale merkezi olmaya devam etmektedir. Bu nüfus; tıbbi tahliye edilen hastaları, onlara eşlik eden aile üyelerini ve diğer yerinden edilmiş Filistinlileri kapsamaktadır. Birçok kişi uzman sağlık hizmetleri, ilaç, rehabilitasyon, psikososyal destek, geçici barınma ve temel yaşam giderleri konusunda devam eden ihtiyaçlarla karşı karşıyadır. Geri dönüş ve hareket konusundaki belirsizlik de önemli bir koruma sorunu olmaya devam etmektedir.
  - kind: needs
    kicker: İNSANİ İHTİYAÇLAR VE MÜDAHALE ÖNCELİKLERİ
    title: Öncelikli İnsani İhtiyaçlar
    text: |
      Öncelikli ihtiyaçlar arasında tahliye edilen hastalar için uzman tedavi ve rehabilitasyonun sürdürülmesi, ilaç ve yardımcı cihazlar, psikososyal destek, geçici barınma, temel yardım ve refakatçi aile üyelerine destek bulunmaktadır. Çocuklara, engelli bireylere, kronik veya karmaşık sağlık sorunları olan hastalara ve sınırlı mali kaynaklara sahip hanelere özel önem verilmelidir.

      **Temel Müdahale Öncelikleri**

      Müdahale öncelikleri; Filistinli hastalar için tedavi ve sevk yollarının sürdürülmesi, tahliye edilen hastaları kabul eden Mısır hastanelerinin ve sağlık personelinin desteklenmesi, rehabilitasyon ve psikososyal hizmetlerin güçlendirilmesi ve Mısır’daki kırılgan Filistinli ailelere hedefli temel yardım sağlanmasıdır. Koordinasyon ayrıca koşullar elverdiğinde güvenli, onurlu ve gönüllü hareketi desteklemelidir.
  - kind: context
    kicker: KURUMSAL KAPASİTE
    title: Mısır’daki Resmî Temsil, Operasyonel ve Kurumsal Uygulama Kapasitemiz
    text: |
      **Mısır’daki İnsani Yardım Faaliyetlerimiz ve Hizmet Kapasitemiz**

      Mısır’da, savaş ve zorunlu göç nedeniyle ülkelerini terk etmek zorunda kalan Filistinli ve Sudanlı birey ve ailelere yönelik insani yardım ve sosyal destek faaliyetleri yürütmekteyiz. Faaliyetlerimizi, her iki topluluğun ihtiyaç ve önceliklerini gözeterek farklı program alanlarında gerçekleştirmekteyiz.

      **Resmî Temsil ve Kurumsal İş Birlikleri**

      İnsanlık Eli Derneği olarak Mısır’da resmî temsilcimiz bulunmaktadır. Derneğimiz, Mısır’daki faaliyetlerini ilgili mevzuat ve resmî prosedürlere uygun şekilde yürütmektedir. Bu kapsamda, Mısır’daki ilgili resmî kurumlarla protokol, iş birliği ve mutabakat anlaşmaları çerçevesinde faaliyetlerimizi gerçekleştirebilecek kurumsal altyapıya sahibiz.

      **Resmî Bankacılık Kanalları Üzerinden Finansal İşlemler**

      İnsani yardım faaliyetler ve projeler kapsamında ihtiyaç duyulan maddi kaynakların, resmî bankacılık kanalları aracılığıyla Mısır’a gönderilmesi ve teslim alınması mümkündür. Bu sayede proje bütçeleri ve yardım kaynakları, bankacılık sistemi üzerinden kayıtlı ve izlenebilir şekilde yönetilebilmektedir.

      **Toplu Organizasyonlar ve Sosyal Etkinlikler**

      Derneğimiz, Mısır’da çok sayıda aile ve katılımcının yer aldığı yardım organizasyonları ve sosyal etkinlikleri düzenlemek için gerekli izin süreçlerini yürütebilmektedir. Toplu iftar programları, yardım dağıtımları ve benzeri geniş katılımlı etkinlikler, ilgili makamlardan gerekli izinlerin alınarak düzenlenebilmektedir.
  - kind: context
    kicker: FİLİSTİNLİLER
    title: Filistinlilere Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
    text: |
      Gazze’deki savaş nedeniyle Mısır’a tahliye edilen veya yerinden edilerek Mısır’da yaşamını sürdürmek zorunda kalan Filistinli birey ve ailelere yönelik sağlık, rehabilitasyon, psikososyal destek ve temel insani yardım faaliyetleri yürütmekteyiz.

      Kurumumuz, Mısır’da faaliyet gösteren sağlık hizmeti sağlayıcılarıyla kurduğu iş birlikleri aracılığıyla uzman sağlık hizmetleri, protez uygulamaları, rehabilitasyon ve psikososyal destek alanlarında kapsamlı hizmetler sunmayı hedeflemektedir. Bu kapsamda Gazze’den tahliye edilen hastalara yönelik sağlık ve bakım desteği de faaliyet alanlarımız arasında yer almaktadır.

      **Sağlık, tedavi ve bakım hizmetleri**

      • Cerrahi müdahale ve uzmanlık gerektiren sağlık hizmetlerine erişim

      • Ameliyat öncesi değerlendirme, operasyon ve ameliyat sonrası bakım

      • İlaç desteği ve iyileşme sürecinin takibi

      • Protez uygulamaları, protez uyumlandırma ve kullanım eğitimi

      • Fizik tedavi ve rehabilitasyon hizmetleri

      • Tedavi sonrası takip ve bakım süreçlerinin koordinasyonu

      **Çocuklara yönelik psikososyal destek**

      • Mısır’da bulunan 13 okul aracılığıyla çocuklara yönelik psikososyal destek programları

      • Çocukların duygusal iyilik hâlinin ve psikolojik dayanıklılığının desteklenmesi

      • Çocukların kendilerini güvende hissetmelerini destekleyen çalışmaların yapılması ve ihtiyaç duyanların uzman desteğine yönlendirilmesi

      **Temel insani yardım ve hane destekleri**

      • Gıda kolisi desteği: Gıda güvencesi sorunu yaşayan ailelere temel gıda ürünlerinden oluşan kolilerin ulaştırılması.

      • Ailelere düzenli aylık nakdî destek: Gelirini kaybetmiş veya ciddi ekonomik sıkıntı yaşayan ailelere kira, gıda, hijyen, giyim, elektrik ve su gibi temel ihtiyaçlarını karşılayabilmeleri için düzenli nakdî destek sağlanması.

      • Kira ve barınma desteği: Savaş nedeniyle yerinden edilmiş ailelerin Mısır’daki barınma ihtiyaçlarına ve kira ödemelerine destek olunması.
  - kind: context
    kicker: SUDANLILAR
    title: Sudanlılara Yönelik İnsani Yardım ve Destek Faaliyetlerimiz
    text: |
      Sudanlı ailelere yönelik çalışmalarımızda da Filistinli aileler için yürüttüğümüz sağlık, rehabilitasyon, psikososyal destek ve temel insani yardım programlarını sürdürmekteyiz. Bu kapsamda sağlık ve tedavi desteği, protez ve rehabilitasyon hizmetleri, çocuklara yönelik psikososyal destek, gıda kolisi, düzenli nakdî yardım ve kira-barınma desteği sağlamaktayız.

      Bunlara ek olarak Sudanlılara yönelik mesleki eğitim ve beceri geliştirme programları da düzenlemekteyiz.

      • Mesleki eğitim kurslarının düzenlenmesi

      • Farklı alanlarda meslek edindirme kurslarının sunulması

      • Katılımcıların mesleki bilgi ve becerilerinin geliştirilmesi

      • İstihdam olanaklarına ve ekonomik bağımsızlığa erişimlerinin desteklenmesi

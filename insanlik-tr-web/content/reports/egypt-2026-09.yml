    kicker: FAALİYET ALANLARI
    title: Mısır’daki Temel Faaliyet Alanlarımız
    text: |
      **A. Sağlık ve Rehabilitasyon Hizmetleri**

      **Cerrahi ve uzman sağlık hizmetleri**

      **Protez hizmetleri ve rehabilitasyon**

      **Fizik tedavi ve ameliyat sonrası iyileşme süreçleri**

      **Çocuklara yönelik ruh sağlığı ve psikososyal destek**

      **B. Temel İnsani Yardım ve Aile Destek Hizmetleri**

      **Gıda Kolisi Desteği**

      **Ailelere Düzenli Aylık Nakdî Destek**

      **Kira ve Barınma Desteği**

      Yukarıda sıralanan faaliyet alanlarının kapsamı ve uygulama şekli aşağıda ayrıntılı olarak açıklanmaktadır.
        - kind: context
    kicker: SAĞLIK VE REHABİLİTASYON
    title: A. Sağlık ve Rehabilitasyon Hizmetleri
    text: |
      **Cerrahi Hizmetler ve Sağlık Kuruluşlarıyla İş Birlikleri**

      Sağlık kuruluşlarıyla yapılacak iş birlikleri sayesinde, hastaların cerrahi müdahalelerden ve uzman hekimlerin sunduğu sağlık hizmetlerinden yararlanması hedeflenmektedir.

      **Hasta Bakım Sürecinin Aşamaları**

      • Ameliyat öncesi tıbbi değerlendirme

      • Cerrahi müdahale

      • Ameliyat sonrası ilaç tedavisi ve bakım

      • Hastanın iyileşme sürecinin takip edilmesi

      Bu modelle hastaların ilk değerlendirmeden tedaviye, ameliyat sonrası bakımdan iyileşme sürecinin tamamlanmasına kadar düzenli ve koordineli sağlık hizmeti alması amaçlanmaktadır.

      **Kapsamlı Protez Hizmetleri**

      Bir protez merkeziyle yapılacak iş birliği kapsamında, uzuv kaybı nedeniyle proteze ihtiyaç duyan hastalara değerlendirme, protez uygulaması ve rehabilitasyon hizmetleri sunulması hedeflenmektedir.

      **Hizmet Sürecinin Aşamaları**

      Değerlendirme: Tıbbi değerlendirme; hastanın ihtiyaçlarının belirlenmesi.

      Protez Uygulaması: Hastanın ihtiyacına uygun protezin belirlenmesi; protezin hastaya uyumlandırması.

      Uyum ve Rehabilitasyon: Protez kullanımı eğitimi; rehabilitasyon hizmetleri; düzenli kontrol ve değerlendirme.

      **Fizik Tedavi ve Ameliyat Sonrası Rehabilitasyon Hizmetleri**

      Amacımız yalnızca protez temin etmek değil, hastaların protezlerini etkin şekilde kullanabilmelerini, günlük yaşamlarını mümkün olduğunca bağımsız sürdürebilmelerini ve hareket kabiliyetlerini yeniden kazanmalarını desteklemektir.

      Bir fizik tedavi ve rehabilitasyon merkeziyle yapılacak iş birliği kapsamında, yaralanan hastaların tedavi sonrası iyileşme süreçlerini destekleyecek rehabilitasyon hizmetleri sunulması hedeflenmektedir.

      **Öncelikli Hizmet Alanları**

      • Ameliyat sonrası rehabilitasyon

      • Hareket kabiliyetinin ve günlük yaşam becerilerinin yeniden kazanılması

      • Protez uygulaması sonrasında rehabilitasyon

      • İyileşme sürecinin düzenli takibi

      Temel yaklaşımımız, ameliyat sonrası bakımdan rehabilitasyon sürecine kadar hastaların hareket kabiliyetlerini ve günlük yaşamlarını bağımsız sürdürebilme becerilerini yeniden kazanmalarını desteklemektir.

      **Tedaviden İyileşmeye: Bütüncül Hasta Bakım Modeli**

      Başarılı bir cerrahi müdahale, iyileşme sürecinin yalnızca başlangıcıdır. Hastanın sağlığına kavuşabilmesi için ameliyat sonrasında bakım, rehabilitasyon ve düzenli takip hizmetlerinin devam etmesi gerekir.

      **Koordineli Hasta Bakım Süreci: Değerlendirme → Tedavi → İyileşme → Rehabilitasyon → Takip**

      Bu yaklaşımla hastanın tedavi, bakım ve rehabilitasyon ihtiyaçlarının birbiriyle bağlantılı şekilde ele alınması ve tüm sürecin düzenli olarak takip edilmesi amaçlanmaktadır.

      **Çocuklara Yönelik Ruh Sağlığı ve Psikososyal Destek Programları**

      Mısır’da erişim sağlanan 13 okul aracılığıyla, çocukların psikososyal gelişimlerini destekleyen yapılandırılmış okul temelli programların uygulanması hedeflenmektedir.

      Bu okullar aracılığıyla çocukların psikolojik dayanıklılıklarını güçlendiren ve kendilerini güvende hissetmelerine yardımcı olan destek çalışmaları yürütülmesi amaçlanmaktadır.

      **Çocukların Duygusal ve Psikolojik Gelişiminin Desteklenmesi**

      • Çocukların psikolojik dayanıklılığını güçlendiren faaliyetler

      • Kendilerini güvende hissetmelerini destekleyen çocuk odaklı etkinlikler

      • Duygusal gelişimi destekleyen çalışmalar

      **Uzman Desteğine Yönlendirme Mekanizmaları**

      • Ek desteğe ihtiyaç duyan çocukların belirlenmesi

      • İhtiyaç duyan çocukların uzmanlara yönlendirilmesi

      • Gerekli destek mekanizmalarıyla bağlantı kurulması
  - kind: context
    kicker: AİLE DESTEĞİ
    title: B. Temel İnsani Yardım ve Aile Destek Hizmetleri
    text: |
      **Gıda Kolisi Desteği**

      Savaş ve zorunlu göç nedeniyle gıdaya erişimde güçlük yaşayan ihtiyaç sahibi ailelere temel gıda ürünlerinden oluşan yardım kolilerinin ulaştırılması.

      **Ailelere Düzenli Aylık Nakdî Destek**

      Savaş nedeniyle yerinden edilmiş, gelir kaynaklarını kaybetmiş veya geçim sıkıntısı yaşayan ailelere; kira, gıda, hijyen, giyim, elektrik ve su gibi temel ihtiyaçlarını karşılayabilmeleri için düzenli nakdî yardım yapılması.

      **Kira ve Barınma Desteği**

      Savaş nedeniyle evlerini terk ederek Mısır’a sığınmak zorunda kalan ailelerin barınma ihtiyaçlarına katkı sağlamak amacıyla kira yardımı yapılması.

      Bu destekle ailelerin kira giderlerini karşılayabilmelerine, barınma sorunlarını hafifletmelerine ve daha güvenli koşullarda yaşamlarını sürdürmelerine katkı sağlanması amaçlanmaktadır.
  - kind: context
    kicker: İŞ BİRLİĞİ AĞI
    title: Mısır’da Kapsamlı Sağlık Hizmetleri İçin Yerel Uygulama ve İş Birliği Ağı
    text: |
      Kurumumuz, insani yardım alanında faaliyet gösteren paydaşları Mısır’daki yerel sağlık hizmeti sağlayıcılarıyla buluşturmayı ve hastaların müdahale aşamasından iyileşme, rehabilitasyon, takip ve dokümantasyon süreçlerine kadar koordinasyonunu sağlamayı hedeflemektedir.

      **İş Birliği ve Proje Geliştirme Alanları**

      **Ortak sağlık hizmetleri ve cerrahi destek programları**

      **Kapsamlı protez ve rehabilitasyon projeleri**

      **Ameliyat sonrası bakım ve hasta takip programları**

      **Okul temelli psikososyal destek projeleri**

      **Kurumumuzun Sağlayacağı Katkılar**

      • Yerel sağlık kuruluşlarıyla iş birliği ağı

      • Hasta süreçlerinin koordinasyonu

      • Tedavi ve rehabilitasyon süreçlerinin takibi

      • Hasta kayıtlarının ve hizmet süreçlerinin dokümantasyonu
  note: Rakamlar, raporlama dönemi için mevcut en güncel insani verileri yansıtmaktadır. Kaynaklar; UN OCHA, WFP, WHO ve UNICEF'in resmi insani durum güncellemeleri ile sektörel raporlarını içermektedir.
en:
  country_name: Egypt
  title: Egypt — Humanitarian Situation Overview
  summary: Egypt continues to play a major humanitarian and health-response role for Palestinians from Gaza who have entered the country since the start of the crisis. This population includes medical evacuees, accompanying family members and other displaced…
  figures:
  - value: 100K+
    label: Displaced Palestinians reported in Egypt
  - value: 6.6K+
    label: Gaza medical evacuees received by Egypt
  - value: 9.3K+
    label: Companions received with medical evacuees
  - value: 18.5K+
    label: Patients in Gaza still requiring medical evacuation
  sections:
  - kind: context
    kicker: CURRENT CONTEXT
    title: Situation Overview
    text: Egypt continues to play a major humanitarian and health-response role for Palestinians from Gaza who have entered the country since the start of the crisis. This population includes medical evacuees, accompanying family members and other displaced Palestinians. Many face continuing needs related to specialized healthcare, medication, rehabilitation, psychosocial support, accommodation and basic living costs, while uncertainty around return and movement remains a major protection concern.
  - kind: needs
    kicker: HUMANITARIAN NEEDS
    title: Priority Humanitarian Needs
    text: Priority needs include continued specialized medical treatment and rehabilitation for evacuated patients, medicines and assistive devices, psychosocial support, temporary accommodation, basic assistance and support for accompanying family members. Particular attention is required for children, people with disabilities, patients with chronic or complex conditions and households with limited financial resources.
  - kind: priorities
    kicker: RESPONSE FOCUS
    title: Key Response Priorities
    text: Response priorities include sustaining treatment and referral pathways for Palestinian patients, supporting Egyptian hospitals and health personnel receiving evacuees, strengthening rehabilitation and psychosocial services, and providing targeted basic assistance to vulnerable Palestinian families in Egypt. Coordination should also support safe, dignified and voluntary movement when conditions allow.
  - kind: context
    kicker: INSTITUTIONAL CAPACITY
    title: Our Official Representation, Operational and Institutional Implementation Capacity in Egypt
    text: |
      Our Humanitarian Activities and Service Capacity in Egypt

      In Egypt, we carry out humanitarian aid and social support activities for Palestinian and Sudanese individuals and families who have been forced to leave their countries because of war and forced displacement. We carry out our activities in different programme areas, taking into account the needs and priorities of both communities.

      1. Official Representation and Institutional Partnerships

      As İnsanlık Eli Association, we have an official representative in Egypt. Our association carries out its activities in Egypt in accordance with the relevant legislation and official procedures. Within this framework, we have the institutional infrastructure to carry out our activities under protocols, cooperation agreements and memoranda of understanding with the relevant official institutions in Egypt.

      2. Financial Transactions through Official Banking Channels

      The financial resources needed for humanitarian activities and projects can be sent to and received in Egypt through official banking channels. In this way, project budgets and aid resources can be managed in a recorded and traceable manner through the banking system.

      3. Mass Events and Social Activities

      Our association can carry out the permit processes required to organise aid events and social activities involving large numbers of families and participants in Egypt. Mass iftar programmes, aid distributions and similar large-scale events can be organised after obtaining the necessary permits from the relevant authorities.
  - kind: context
    kicker: PALESTINIANS
    title: Our Humanitarian Aid and Support Activities for Palestinians
    text: |
      We carry out health, rehabilitation, psychosocial support and basic humanitarian aid activities for Palestinian individuals and families who were evacuated to Egypt because of the war in Gaza, or who have been displaced and have had to continue their lives in Egypt.

      Through cooperation with healthcare providers operating in Egypt, our organisation aims to provide comprehensive services in specialised healthcare, prosthetic fitting, rehabilitation and psychosocial support. Within this scope, health and care support for patients evacuated from Gaza is also among our areas of activity.

      1. Health, treatment and care services

      • Access to surgical intervention and healthcare services requiring specialist expertise

      • Pre-operative assessment, surgery and post-operative care

      • Medication support and follow-up of the recovery process

      • Prosthetic fitting, prosthetic adaptation and training on use

      • Physiotherapy and rehabilitation services

      • Coordination of post-treatment follow-up and care processes

      2. Psychosocial support for children

      • Psychosocial support programmes for children through 13 schools in Egypt

      • Supporting children’s emotional well-being and psychological resilience

      • Activities that help children feel safe, and referral of those in need to specialist support

      3. Basic humanitarian aid and household support

      • Food parcel support: Delivering parcels of basic food items to families facing food insecurity.

      • Regular monthly cash support for families: Providing regular cash support to families who have lost their income or are facing serious economic hardship, so that they can meet basic needs such as rent, food, hygiene, clothing, electricity and water.

      • Rent and shelter support: Supporting the accommodation needs and rent payments of families displaced by the war in Egypt.
  - kind: context
    kicker: SUDANESE
    title: Our Humanitarian Aid and Support Activities for Sudanese
    text: |
      In our work with Sudanese families, we also continue the health, rehabilitation, psychosocial support and basic humanitarian aid programmes that we run for Palestinian families. Within this scope, we provide health and treatment support, prosthetic and rehabilitation services, psychosocial support for children, food parcels, regular cash assistance and rent and shelter support.

      In addition, we organise vocational training and skills development programmes for Sudanese.

      • Organising vocational training courses

      • Offering courses in different fields to acquire a profession

      • Developing participants’ professional knowledge and skills

      • Supporting their access to employment opportunities and economic independence
  - kind: context
    kicker: AREAS OF ACTIVITY
    title: Our Main Areas of Activity in Egypt
    text: |
      A. Health and Rehabilitation Services

      1. Surgical and specialist healthcare services

      2. Prosthetic services and rehabilitation

      3. Physiotherapy and post-operative recovery processes

      4. Mental health and psychosocial support for children

      B. Basic Humanitarian Aid and Family Support Services

      1. Food Parcel Support

      2. Regular Monthly Cash Support for Families

      3. Rent and Shelter Support

      The scope and implementation of the areas of activity listed above are explained in detail below.
  - kind: context
    kicker: HEALTH AND REHABILITATION
    title: A. Health and Rehabilitation Services
    text: |
      1. Surgical Services and Cooperation with Healthcare Institutions

      Through cooperation with healthcare institutions, the aim is for patients to benefit from surgical interventions and the healthcare services provided by specialist physicians.

      Stages of the Patient Care Process

      • Pre-operative medical assessment

      • Surgical intervention

      • Post-operative medication and care

      • Follow-up of the patient’s recovery process

      With this model, the aim is for patients to receive regular and coordinated healthcare from initial assessment to treatment, and from post-operative care until the recovery process is complete.

      2. Comprehensive Prosthetic Services

      Through cooperation with a prosthetics centre, the aim is to provide assessment, prosthetic fitting and rehabilitation services to patients who need a prosthesis because of limb loss.

      Stages of the Service Process

      Assessment: Medical assessment; identifying the patient’s needs.

      Prosthetic Fitting: Determining the prosthesis suited to the patient’s needs; fitting the prosthesis to the patient.

      Adaptation and Rehabilitation: Training on prosthesis use; rehabilitation services; regular check-ups and evaluation.

      3. Physiotherapy and Post-Operative Rehabilitation Services

      Our aim is not only to provide prostheses, but to support patients in using their prostheses effectively, living their daily lives as independently as possible and regaining their mobility.

      Through cooperation with a physiotherapy and rehabilitation centre, the aim is to provide rehabilitation services that support the post-treatment recovery of injured patients.

      Priority Service Areas

      • Post-operative rehabilitation

      • Regaining mobility and daily living skills

      • Rehabilitation after prosthetic fitting

      • Regular follow-up of the recovery process

      Our core approach is to support patients, from post-operative care through the rehabilitation process, in regaining their mobility and the ability to live their daily lives independently.

      From Treatment to Recovery: A Holistic Patient Care Model

      A successful surgical intervention is only the beginning of the recovery process. For a patient to regain health, post-operative care, rehabilitation and regular follow-up services must continue.

      Coordinated Patient Care Process: Assessment → Treatment → Recovery → Rehabilitation → Follow-up

      With this approach, the aim is to address the patient’s treatment, care and rehabilitation needs in a connected way and to follow the whole process regularly.

      4. Mental Health and Psychosocial Support Programmes for Children

      Through 13 schools to which access has been established in Egypt, the aim is to implement structured school-based programmes that support children’s psychosocial development.

      Through these schools, the aim is to carry out support activities that strengthen children’s psychological resilience and help them feel safe.

      Supporting Children’s Emotional and Psychological Development

      • Activities that strengthen children’s psychological resilience

      • Child-focused activities that help them feel safe

      • Work that supports emotional development

      Referral Mechanisms to Specialist Support

      • Identifying children who need additional support

      • Referring children in need to specialists

      • Establishing links with the necessary support mechanisms

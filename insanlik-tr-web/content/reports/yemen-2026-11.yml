  - title: 2. Violations against Civilians and the Humanitarian Consequences of the Conflict
    blocks:
    - p: The figures in this section are drawn from reports by United Nations agencies and the Yemeni health authorities. Because reporting is incomplete and some areas cannot be reached, they should be read as a minimum.
    - h: 2.1 Conflict Casualties
      level: 1
      id: s3-1
    - p: According to the Health Emergency Operations Centre (HEOC) of the Ministry of Public Health and Population, 12,779 people had been injured or killed in the conflict by 16 November 2026 (10,519 injured and 2,260 deaths). In the eight days from 9 to 16 November alone, 1,024 casualties were added (862 injured and 162 deaths), an average of about 128 a day. Daily reporting completeness ranged from 58% to 92%, so these figures are a minimum.

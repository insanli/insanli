  - title: 1. الوضع الإنساني والنزوح القسري في اليمن
    blocks:
    - p: يرصد هذا التقرير النزوح القسري المرتبط بالنزاع في عشر محافظات فلقد تسبب النزاع القائم بالنزوح وهو ما دفع الاسر الى الترك المفاجئ أو فقدان المنازل والممتلكات وسبل العيش والثروة الحيوانية ومصادر الدخل والضروريات الأساسية. وقد أدى ذلك إلى زيادة هشاشة الأسر وتقليص قدرتها على تلبية احتياجاتها الأساسية دون مساعدة إنسانية.
    - p: وتتجاوز الآثار الإنسانية مسألة المأوى وحدها؛ فقد تصل الأسر النازحة دون غذاء أو مياه آمنة أو خدمات صرف صحي أو خدمات صحية أو دعم حماية أو مواد غير غذائية أو موارد نقدية. وترى الوحدة التنفيذية أن التدخل الإنساني السريع والمنسّق والقائم على الاحتياجات أمر أساسي لحماية الأرواح والكرامة، والحد من مخاطر الحماية، ومنع المزيد من تدهور أوضاع الأسر والضغط على المجتمعات المضيفة.
    - h: 1.1 مسار النزاع وعواقبه الإنسانية
      level: 1
      id: s2-1
    - p: وفقًا لتنبيه شبكة نظم الإنذار المبكر بالمجاعة (FEWS NET) الصادر في 17 نوفمبر 2026، تحوّل النزاع في اليمن منذ يوليو 2026 إلى حرب عالية الشدة متعددة الجبهات تتسم بخطوط مواجهة متحركة، وأصبحت محافظتا تعز ولحج مركز القتال. وبحسب المنظمة الدولية للهجرة، اشتد القتال منذ مطلع سبتمبر 2026 على امتداد الساحل الغربي، ولا سيما في محافظتي تعز والحديدة، مع مواجهات عنيفة في مقبنة وموزع والمخا والمديريات المحاذية لخطوط المواجهة.
    - p: وبحسب التقرير الموقفي لمنظمة الصحة العالمية الصادر في 17 نوفمبر 2026، تقدمت خطوط المواجهة بسرعة عبر محافظة لحج وباتت تقترب من عدن التي تضم مستشفيات الإحالة الرئيسية ومركز عمليات الطوارئ الصحية والمستودع الذي يزوّد الاستجابة الصحية بالإمدادات. وقد يؤدي أي تقدم إضافي إلى تغيير تدفقات المصابين وحركة النزوح وتعطيل طرق الإحالة والإمداد.
    - p: ولا تقتصر العواقب الإنسانية للنزاع على النزوح؛ إذ تخضع مدينة تعز منذ أكتوبر لحصار فعلي يتفاقم معه نقص الغذاء والوقود وغاز الطهي والمياه، وتواجه المستشفيات صعوبة في تقديم خدماتها بسبب نقص الوقود والأدوية، فيما تستمر مخاطر الكوليرا والأوبئة الأخرى. كما نزحت أسر كثيرة مرتين إلى أربع مرات، واضطر بعضها إلى مغادرة مواقع عاشت فيها أكثر من خمس سنوات، ما يزيد الضغط على المجتمعات المضيفة ومواقع النزوح المثقلة أصلًا.
    - h: 1.2 حجم النزوح على مستوى البلاد
      level: 1
      id: s2-2
    - p: وفقًا لمصفوفة تتبع النزوح التابعة للمنظمة الدولية للهجرة في اليمن، نزح 357,658 فردًا (59,602 أسرة) منذ بدء التصعيد في يونيو 2026، منهم نحو 356,602 فرد (59,426 أسرة) نزحوا خلال الفترة من 1 أغسطس إلى 17 نوفمبر 2026. وظل النزوح منخفضًا نسبيًا من يونيو إلى أغسطس، ثم ارتفع بشكل حاد في مطلع سبتمبر وبلغ ذروته اليومية في 9 سبتمبر بنزوح 15,186 فردًا. وبحلول منتصف نوفمبر استقر النزوح الأسبوعي عند نحو 3,150 أسرة. وسجلت المصفوفة نزوح 369,012 فردًا منذ 1 يناير 2026.
    - p: ويمثل رقم الوحدة التنفيذية الوارد في هذا التقرير (338,748 فردًا يشكّلون 50,001 أسرة) حصيلة تسجيل، ولا يمكن مقارنته مباشرة ببيانات مصفوفة تتبع النزوح التي ترصد حركة النزوح، كما تشير منظمة الصحة العالمية.
    - lab: توزيع النازحين حسب محافظة النزوح وفقًا لمصفوفة تتبع النزوح (يونيو – 17 نوفمبر 2026)

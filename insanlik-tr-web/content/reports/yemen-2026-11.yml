  - title: 4. Yerinden Edilmiş Ailelerin İnsani Durumu
    blocks:
    - p: İllerden gelen saha bilgileri, yerinden edilmiş ailelerin ağır yaşam koşullarıyla karşı karşıya olduğunu ve farklı alanlarda acil ihtiyaçlarının bulunduğunu göstermektedir. Bu güncelleme, rapor kapsamındaki on ilde kayıt altına alınan yerinden edilmiş nüfusun ulaştığı boyutu ortaya koymaktadır.
    - h: 4.1. Barınma İhtiyacı
      level: 1
      id: s5-1
    - p: Barınma, insani yardım müdahalesinde öncelikli ihtiyaçların başında gelmektedir. Aden'de yerinden edilmiş bazı aileler başka ailelerin yanında barınırken, bazıları ise herhangi bir barınma imkânından yoksun şekilde açık alanlarda yaşamını sürdürmektedir. Raporun hazırlandığı tarih itibarıyla bu durum devam etmektedir.
    - p: Yerinden edilmiş nüfusun ulaştığı büyüklük dikkate alındığında, ailelerin barınma koşullarının yerinde tespit edilmesi, en fazla desteğe ihtiyaç duyanların belirlenmesi ve kendilerine ev sahipliği yapan toplulukların desteklenmesi önem taşımaktadır.
    - h: 4.2. Gıda ve Temel İhtiyaçlar
      level: 1
      id: s5-2
    - p: İllerden gelen raporların tamamında gıda ve barınma, acil karşılanması gereken temel ihtiyaçlar arasında gösterilmektedir. Gıda yardımı ve temel ihtiyaç malzemelerinin temini, yerinden edilmiş ailelerin öncelikli ihtiyaçları arasındadır.
    - h: 4.3. Su, Sanitasyon ve Hijyen
      level: 1
      id: s5-3
    - p: Güvenli içme suyuna erişim, sanitasyon hizmetleri, hijyen malzemeleri, acil tuvalet imkânları ve atık yönetimi, özellikle yeni kurulan yerinden edilme alanlarında acil ihtiyaç olarak öne çıkmaktadır.
    - h: 4.4. Sağlık ve Koruma
      level: 1
      id: s5-4
    - p: Yerinden edilmiş aileler, sağlık hizmetlerine ve koruma mekanizmalarına erişimde ciddi kısıtlamalarla karşılaşmaktadır. Özellikle çocukların, kadınların, yaşlıların, engelli bireylerin, kronik hastalığı bulunanların ve diğer kırılgan durumdaki ailelerin ihtiyaçlarına öncelik verilmelidir.
    - p: İllerden gelen raporlarda; sağlık ve koruma ihtiyaçlarının tespit edilmesi, ihtiyaç sahiplerinin ilgili hizmetlere yönlendirilmesi, ilaç ve ilk yardım desteğinin sağlanması, gerekli durumlarda psikososyal destek sunulması ve koruma hizmetlerinin güçlendirilmesi gerektiği vurgulanmaktadır.
    - h: 4.5. Geçim Kaynakları ve Ekonomik Kırılganlık
      level: 1
      id: s5-5
    - p: Gelir kaynaklarının, kişisel mülklerin, hayvan varlıklarının ve geçim için kullanılan diğer imkânların kaybedilmesi veya zarar görmesi, yerinden edilmiş ailelerin ekonomik açıdan daha da zor durumda kalmasına neden olmuştur.
    - p: Bu nedenle birçok ailenin öncelikle hayatlarını sürdürebilmeleri için acil insani yardıma, bunun yanı sıra yerinden edilmenin ekonomik sonuçlarını hafifletecek ve ağır koşullar altında yaşam mücadelesi veren ev sahibi topluluklara bağımlılığı azaltacak desteklere ihtiyacı bulunmaktadır.
  - title: 5. Yürütme Birimi Tarafından Yürütülen Çalışmalar
    blocks:
    - ul:
      - İl düzeyindeki şubelerde operasyon merkezleri, ilçelerde ise saha ekipleri oluşturularak yerinden edilme hareketlerindeki gelişmelerin düzenli takibi sağlanmıştır.
      - Yeni yerinden edilmiş aileler karşılanmış, bölgeye yeni gelenlerin ve yerinden edilme alanlarında bulunan ailelerin tespiti için saha ziyaretleri gerçekleştirilerek kayıt işlemleri yapılmıştır.
      - Ailelerin sayıları ve bulundukları yerler ön değerlendirmeye tabi tutulmuş; yerinden edilme koşulları ve ilk aşamadaki ihtiyaçları hakkında bilgi toplanmıştır.
      - İlk aşamadaki ihtiyaçlar takip edilip değerlendirilmiş, yerinden edilme kayıtları düzenli olarak güncellenmiş ve yerinden edilmiş ailelere ilişkin listeler hazırlanarak ilgili kurumlara sunulmuştur.
      - İhtiyaçların doğrulanması, ilgili hizmetlere yönlendirme yapılması ve yardım çalışmalarının hızlandırılması amacıyla Yürütme Birimi yönetimine, yerel yönetimlere, ilgili kurumlara ve insani yardım ortaklarına raporlar iletilmiştir.
      - Yardım kapsamına alınan ve henüz destek ulaştırılamayan ailelerin durumları takip edilmiş, sahadaki müdahaleler izlenmiş ve karşılanmamış ihtiyaçlar düzenli olarak güncellenerek yardımların doğru kişilere ulaştırılması ve mükerrer yardımların önlenmesi hedeflenmiştir.
      - Özellikle Taiz ve El-Hudeyde illerinin bazı ilçelerinde son gelişmelerin ardından yaşanan yeni yerinden edilme hareketleri yakından takip edilmiş; saha çalışmaları ve raporlama faaliyetleri sürdürülerek ailelerin göç ettikleri bölgeler tespit edilmeye çalışılmıştır.
    - p: Bunlara ek olarak Yürütme Birimi, merkez ofisinde yerinden edilmeden etkilenen illerdeki gelişmeleri ve insani yardım müdahalelerini takip etmek üzere ayrı bir izleme ekibi oluşturmuştur. Bu ekip tarafından hazırlanan raporlar, Birleşmiş Milletler bünyesindeki insani yardım sektörel koordinasyon grupları ile yerel ve uluslararası yardım kuruluşlarına iletilmiştir.
  - title: 6. Öncelikli İhtiyaçlar ve Acil Müdahale Adımları
    blocks:
    - p: Öncelikli hedef, yeni yerinden edilmiş ailelerin temel yaşam ihtiyaçlarını karşılayacak acil insani yardımlara erişimini sağlamaktır. Bu süreçte kayıtların doğru tutulması, bilgilerin doğrulanması ve yardım kuruluşları arasındaki koordinasyonun sağlanması da büyük önem taşımaktadır.
    - p: "Temel ihtiyaçların açıkça görüldüğü durumlarda, acil yardım çalışmaları ile ihtiyaç tespitleri birbirini beklemeden eş zamanlı yürütülmelidir. Bu doğrultuda aşağıdaki adımların öncelikle hayata geçirilmesi önerilmektedir:"
    - ol:
      - Henüz herhangi bir insani yardım almamış yerinden edilmiş ailelere öncelik verilmesi; özellikle yakın zamanda yerinden edilmiş ve yaşam koşulları en ağır olan ailelere acilen ulaşılması.
      - Acil barınma desteği ve barınma malzemelerinin sağlanması. Açık alanlarda yaşayan, kendilerine ait bir barınma imkânı bulunmayan veya başka ailelerin yanında kalmak zorunda olan ailelere öncelik verilmesi.
      - Gıda yardımına veya düzenli bir gelir kaynağına erişimi olmayan ailelere yönelik gıda ve acil nakdî yardım desteğinin artırılması.
      - Yerinden edilmiş ailelerin bulunduğu kabul noktalarında ve geçici yerleşim alanlarında temiz içme suyu, acil tuvalet imkânları, hijyen malzemeleri, atık su ve atık yönetimi hizmetlerinin sağlanması.
      - Yeni yerinden edilmiş ve gerekli şartları taşıyan ailelere yönelik Hızlı Müdahale Mekanizması'nın devreye alınması veya mevcut desteğin genişletilmesi; aynı ailelere birden fazla kez yardım ulaştırılmasını önlemek amacıyla yararlanıcı kayıtlarının karşılaştırılması.
      - Özellikle yeni oluşan yerleşim alanlarında barınma, gıda, su, sağlık ve koruma gibi temel ihtiyaçları kapsayan hızlı değerlendirmeler yapılması ve acil yardımların bu değerlendirmelerle eş zamanlı olarak ulaştırılması.
      - Temel sağlık hizmetlerinin sunulması, ilaç ve ilk yardım desteğinin sağlanması ve ihtiyaç duyan kişilerin uygun sağlık kuruluşlarına yönlendirilmesi için sağlık alanında faaliyet gösteren yardım kuruluşlarının harekete geçirilmesi.
      - Çocuklar, kadınlar, yaşlılar, engelli bireyler, kronik hastalığı bulunanlar ve diğer hassas grupların belirlenmesi; ihtiyaç duyan kişilerin ilgili koruma hizmetlerine yönlendirilmesi için koruma alanında çalışan kuruluşlarla iş birliğinin güçlendirilmesi.
      - Gelir kaynaklarını ve üretim araçlarını kaybeden ailelere ev eşyaları ve diğer temel ihtiyaç malzemelerinin sağlanması; imkânlar dâhilinde geçim kaynaklarını yeniden oluşturmalarına yönelik destek verilmesi.
      - Yerinden edilme hareketlerinin ve yardım çalışmalarının günlük veya haftalık olarak takip edilmesi. Planlanan yardımlar ile fiilen ulaştırılan yardımların ayrı ayrı kaydedilmesi, mükerrer kayıtların ayıklanması ve ulaşılan tekil aile sayısının belirlenmesi.
      - Çatışmalardan etkilenen bölgelerden yeni yerinden edilme dalgalarının yaşanması ihtimaline karşı gerekli hazırlıkların yapılması ve mevcut müdahale kapasitesinin güçlendirilmesi.
  - title: 7. Yerel ve Uluslararası Kuruluşlara Çağrı ve Öneriler
    blocks:
    - p: Ülke İçinde Yerinden Edilmiş Kişilerin Kamplarının Yönetiminden Sorumlu Yürütme Birimi; yerel yönetimleri, Birleşmiş Milletler kuruluşlarını, insani yardım koordinasyon gruplarını, ulusal ve uluslararası yardım kuruluşlarını, bağışçıları ve uygulayıcı ortakları, bu raporda kayıt altına alınan yerinden edilmiş ailelerin ihtiyaçlarının karşılanması için gerekli kaynakları ve saha kapasitesini acilen harekete geçirmeye çağırmaktadır.
    - p: "Son dönemde artan çatışmalar ve askerî operasyonlar nedeniyle çok sayıda aile evlerini ve geçim kaynaklarını terk etmek zorunda kalmıştır. Yeni yerleştikleri bölgelere ulaşan ailelerin bir kısmı barınma imkânından, yeterli gıdadan, temiz sudan ve temel hizmetlerden yoksun durumdadır. Yardımların gecikmesi, bu ailelerin karşı karşıya olduğu insani ve koruma risklerini artıracak, ekonomik koşullarını daha da ağırlaştıracak ve yerinden edilmiş ailelere ev sahipliği yapan toplulukların yükünü artıracaktır. Bu nedenle ilgili kurum ve kuruluşların aşağıdaki adımları öncelikli olarak ele alması gerekmektedir:"
    - ol:
      - Kayıt altına alınan yerinden edilme vakalarının acil insani yardım kapsamında değerlendirilmesi ve mevcut acil müdahale mekanizmalarının gecikmeden devreye sokulması.
      - Henüz herhangi bir yardım almamış ailelerin belirlenmesi, bilgilerinin doğrulanması ve ihtiyaçlarına uygun yardım kuruluşlarına veya ilgili yardım sektörlerine yönlendirilmesi.
      - Acil barınma, gıda, temiz su, sanitasyon, sağlık, koruma, nakdî yardım ve temel ihtiyaç malzemelerinin karşılanması için gerekli kaynakların seferber edilmesi.
      - Acil yardım ve hızlı müdahale çalışmalarının desteklenmesi; ihtiyaç duyulan alanlarda ayrıntılı değerlendirmelerin de eş zamanlı olarak yürütülmesi.
      - Rapor kapsamındaki illerde görev yapan Yürütme Birimi ofisleri ile insani yardım kuruluşları arasındaki koordinasyonun güçlendirilmesi. Ailelerin ilk yer değiştirme hareketlerinin yanı sıra daha sonra yaşanan yeni yer değiştirmelerin de takip edilmesi; mükerrer yardımların ve ihtiyaç sahibi ailelerin yardım dışında kalmasının önlenmesi.
      - Yardım çalışmalarının daha geniş bir alana ulaşabilmesi ve karşılanmamış ihtiyaçların giderilebilmesi için yeterli finansman ve operasyonel desteğin sağlanması.
      - Çocuklara, kadınlara, yaşlılara, engelli bireylere, kronik hastalığı bulunanlara ve insani yardım ya da koruma açısından daha yüksek risk altında olan ailelere öncelik verilmesi.
      - Değerlendirme süreçlerinin uzaması, finansman yetersizliği veya koordinasyon sorunları nedeniyle yeni yerinden edilmiş hiçbir ailenin temel insani yardımlardan mahrum kalmamasının sağlanması.
      - Kayıtların düzenli olarak güncellenmesi ve bilgilerin şeffaf biçimde paylaşılması. Böylece insani yardım kuruluşlarının henüz karşılanmamış ihtiyaçları doğru belirlemesi ve yardımları en fazla ihtiyaç duyan ailelere ulaştırması.
  - title: 8. Sonuç
    blocks:
    - p: Rapor kapsamında derlenen veriler, Yemen'in on ilinde yaşanan yerinden edilmenin boyutunu ortaya koymaktadır. Kayıtlara göre toplam 50.001 aileden oluşan 338.748 kişi yerinden edilmiştir. Bu sayı, ihtiyaç tespiti, kayıtların doğrulanması ve yardım planlamasının geniş bir nüfusu kapsaması gerektiğini göstermektedir. Aynı zamanda barınma imkânları, temel hizmetler ve yerinden edilmiş ailelere ev sahipliği yapan topluluklar üzerindeki baskının boyutuna da işaret etmektedir.
    - p: Yerinden edilmiş kişilerin en büyük bölümü Taiz ve Lahic illerinde bulunmaktadır. Bu iki ilde toplam 274.169 kişi kayıt altına alınmıştır. Bu sayı, raporda belirtilen genel toplamın yaklaşık %80,9'una karşılık gelmektedir. Söz konusu yoğunlaşma, özellikle bu iki ilde insani yardım kuruluşlarının saha çalışmalarını ve müdahale kapasitesini artırmasını gerekli kılmaktadır. Bununla birlikte, diğer illerdeki ihtiyaçlar da göz ardı edilmemeli; yardımların dağıtımında yalnızca yerinden edilmiş kişi sayısı değil, ailelerin içinde bulunduğu koşullar ve ihtiyaçların aciliyeti de dikkate alınmalıdır.
    - p: Bu çerçevede Yürütme Birimi; ilgili kurumları, insani yardım kuruluşlarını ve bağışçıları, barınma, gıda, su, sanitasyon, sağlık, koruma, nakdî yardım ve temel ihtiyaç malzemelerini kapsayan koordineli bir yardım çalışması için acil ve yeterli kaynak sağlamaya çağırmaktadır.
    - p: Yardımların ihtiyaç sahiplerine zamanında ve doğru biçimde ulaştırılabilmesi için kayıtların düzenli olarak güncellenmesi, ailelerin sonraki yer değiştirme hareketlerinin takip edilmesi, mükerrer kayıtların ayıklanması ve henüz karşılanmamış ihtiyaçların belirlenmesi gerekmektedir. Bu çalışmalar, yardımların en fazla ihtiyaç duyan ailelere ulaşmasına, yerinden edilmiş kişilerin onurunun korunmasına ve ev sahibi toplulukların üzerindeki yükün hafifletilmesine katkı sağlayacaktır.
    - end: RAPORUN SONU

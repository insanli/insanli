    - h: 4.4 الجهود الإنسانية الوطنية والمحلية في اليمن
      level: 1
      id: s5-4
    - h: 4.4.1 الإجراءات التي اتخذتها الوحدة التنفيذية
      level: 2
      id: s5-5
    - ul:
      - إنشاء غرفة عمليات في فرع المحافظة وفرق ميدانية على مستوى المديريات لمتابعة مستجدات النزوح.
      - استقبال النازحين الجدد وتسجيل الأسر من خلال زيارات ميدانية لمناطق الوصول وتجمعات النزوح.
      - إجراء تحقق أولي من أعداد الأسر ومواقعها، وجمع معلومات عن ظروف النزوح والاحتياجات الأولية.
      - متابعة وتقييم الاحتياجات الأولية، وتحديث بيانات النزوح باستمرار، وإعداد وتقديم قوائم بالنازحين.
      - رفع التقارير إلى قيادة الوحدة التنفيذية والسلطات المحلية والجهات المعنية والشركاء الإنسانيين للتعجيل بالتحقق والإحالة والاستجابة.
      - متابعة حالة الاستجابة والحالات غير المشمولة، ورصد التدخلات، وتحديث الفجوات المتبقية لتحسين الاستهداف والحد من الازدواجية.
      - مواصلة المتابعة الميدانية ورفع التقارير ومتابعة أوضاع النازحين والى اي مناطق نزحوا بعد الاحداث الأخيرة في بعض مديريات تعز والحديدة.
    - p: علاوة على ذلك، أنشأت الوحدة التنفيذية في المكتب الرئيسي فريقًا لرصد الاستجابة لمتابعة مستجدات النزوح في المحافظات المتضررة، وأصدرت تقارير إلى المجموعات القطاعية للأمم المتحدة والمنظمات المحلية والدولية.
    - h: 4.4.2 جهود وزارة الصحة العامة والسكان والمؤسسات المحلية
      level: 2
      id: s5-6
    - p: نفذت وزارة الصحة العامة والسكان، بالتعاون مع منظمة الصحة العالمية واليونيسف، حملة وطنية للتحصين ضد الحصبة والحصبة الألمانية في 100 مديرية ضمن 11 محافظة خلال الفترة من 7 إلى 12 نوفمبر 2026. ويجمع مركز عمليات الطوارئ الصحية التابع للوزارة أعداد الضحايا يوميًا. كما نفذ مكتب الصحة في محافظة حضرموت والبرنامج الوطني لمكافحة الملاريا ونواقل الأمراض حملة متكاملة لمكافحة حمى الضنك في مديرية الشحر. وتجري حاليًا دورة صرف تشمل نحو 4,000 عامل صحي في 500 منشأة صحية، منها 50 منشأة تخدم النازحين. ومن المؤسسات المحلية، تدعم مؤسسة Selah العيادات المتنقلة في مخيمات النازحين بساحل حضرموت عبر مكتب الصحة في المحافظة.
    - src: 'المصدر: منظمة الصحة العالمية – اليمن، التقرير الموقفي رقم 12 بشأن تصاعد النزاع (17 نوفمبر 2026).'
  - title: 5. الاحتياجات الإنسانية وأولويات الاستجابة
    blocks:
    - p: تشير المعلومات النوعية الواردة من المحافظات إلى ظروف نزوح صعبة واحتياجات متعددة القطاعات ويبين هذا التحديث اتساع حجم النازحين المسجلين في العشر المحافظات.
    - h: 5.1 الاحتياجات الإنسانية حسب القطاع
      level: 1
      id: s6-1
    - p: 'وفقًا لبيانات مصفوفة تتبع النزوح للفترة من 1 أغسطس إلى 17 نوفمبر 2026، تتمثل أبرز الاحتياجات ذات الأولوية التي أفاد بها النازحون في المأوى والمساعدات الغذائية والدعم المالي:'

    - h: 5.1.1. Barınma İhtiyacı
      level: 2
      id: s6-2
    - p: Barınma, insani yardım müdahalesinde öncelikli ihtiyaçların başında gelmektedir. Aden'de yerinden edilmiş bazı aileler başka ailelerin yanında barınırken, bazıları ise herhangi bir barınma imkânından yoksun şekilde açık alanlarda yaşamını sürdürmektedir. Raporun hazırlandığı tarih itibarıyla bu durum devam etmektedir.
    - p: Yerinden edilmiş nüfusun ulaştığı büyüklük dikkate alındığında, ailelerin barınma koşullarının yerinde tespit edilmesi, en fazla desteğe ihtiyaç duyanların belirlenmesi ve kendilerine ev sahipliği yapan toplulukların desteklenmesi önem taşımaktadır.
    - h: 5.1.2. Gıda ve Temel İhtiyaçlar
      level: 2
      id: s6-3
    - p: İllerden gelen raporların tamamında gıda ve barınma, acil karşılanması gereken temel ihtiyaçlar arasında gösterilmektedir. Gıda yardımı ve temel ihtiyaç malzemelerinin temini, yerinden edilmiş ailelerin öncelikli ihtiyaçları arasındadır.
    - h: 5.1.3. Su, Sanitasyon ve Hijyen
      level: 2
      id: s6-4
    - p: Güvenli içme suyuna erişim, sanitasyon hizmetleri, hijyen malzemeleri, acil tuvalet imkânları ve atık yönetimi, özellikle yeni kurulan yerinden edilme alanlarında acil ihtiyaç olarak öne çıkmaktadır.
    - h: 5.1.4. Sağlık ve Koruma
      level: 2
      id: s6-5
    - p: Yerinden edilmiş aileler, sağlık hizmetlerine ve koruma mekanizmalarına erişimde ciddi kısıtlamalarla karşılaşmaktadır. Özellikle çocukların, kadınların, yaşlıların, engelli bireylerin, kronik hastalığı bulunanların ve diğer kırılgan durumdaki ailelerin ihtiyaçlarına öncelik verilmelidir.
    - p: İllerden gelen raporlarda; sağlık ve koruma ihtiyaçlarının tespit edilmesi, ihtiyaç sahiplerinin ilgili hizmetlere yönlendirilmesi, ilaç ve ilk yardım desteğinin sağlanması, gerekli durumlarda psikososyal destek sunulması ve koruma hizmetlerinin güçlendirilmesi gerektiği vurgulanmaktadır.
    - h: 5.1.5. Geçim Kaynakları ve Ekonomik Kırılganlık
      level: 2
      id: s6-6
    - p: Gelir kaynaklarının, kişisel mülklerin, hayvan varlıklarının ve geçim için kullanılan diğer imkânların kaybedilmesi veya zarar görmesi, yerinden edilmiş ailelerin ekonomik açıdan daha da zor durumda kalmasına neden olmuştur.
    - p: Bu nedenle birçok ailenin öncelikle hayatlarını sürdürebilmeleri için acil insani yardıma, bunun yanı sıra yerinden edilmenin ekonomik sonuçlarını hafifletecek ve ağır koşullar altında yaşam mücadelesi veren ev sahibi topluluklara bağımlılığı azaltacak desteklere ihtiyacı bulunmaktadır.
    - h: 5.2. Acil Gıda ve Barınma İhtiyaçları
      level: 1
      id: s6-7
    - p: 'Gıda: FEWS NET''e göre kuşatma altındaki Taiz kentinde en olası senaryoda Acil Durum (IPC Aşama 4) koşullarının sürmesi ve en ağır etkilenen hanelerin giderek artan bir bölümünün Felaket (IPC Aşama 5) düzeyine gerilemesi beklenmektedir. Yoksul haneler öğün sayısını ve miktarını azaltmakta, kalan varlıklarını satmaktadır; orta ve üst gelir grubundaki haneler bile akraba ve topluluk desteğine giderek daha fazla bağımlı hâle gelmektedir. FEWS NET''in yayımladığı uyarı, acil insani gıda yardımına ihtiyaç duyulduğuna işaret etmektedir.'
      b: true
    - p: 'Barınma: SLSC verilerine göre RRM tarafından doğrulanan 39.835 aileden 28.943''ü (%73) hâlâ acil barınma desteğine, 22.625''i (%57) ise temel ihtiyaç malzemesi (NFI) kitine ihtiyaç duymaktadır. Yeni kurulan ve yeni aileleri kabul eden yerleşim alanlarında yaklaşık 10.000 yeni yerinden edilmiş aile (yaklaşık 60.000 kişi) bulunmaktadır.'
      b: true

  - title: "1. Giriş: Savaş Nedeniyle Zorunlu Yerinden Edilme"
    blocks:
    - p: Bu rapor, Yemen'de devam eden çatışmalar nedeniyle on ilde yaşanan zorunlu yerinden edilme hareketlerini ve bunun yol açtığı insani sorunları ele almaktadır. Çatışmalar nedeniyle çok sayıda aile, yaşadığı bölgeyi ve evini terk etmek zorunda kalmış; konutlarını, kişisel eşyalarını, geçim kaynaklarını, hayvanlarını ve düzenli gelirlerini kaybetmiştir. Bu kayıplar, ailelerin yaşam koşullarını daha da ağırlaştırmış ve temel ihtiyaçlarını kendi imkânlarıyla karşılamalarını güçleştirmiştir.
    - p: Yerinden edilmenin yol açtığı insani ihtiyaçlar yalnızca barınmayla sınırlı değildir. Yaşadıkları yerleri terk etmek zorunda kalan aileler, çoğu zaman yeterli gıdaya, temiz içme suyuna, temel sağlık hizmetlerine ve hijyen koşullarına erişememektedir. Bunun yanı sıra koruma hizmetlerine, temel ihtiyaç malzemelerine ve geçimlerini sürdürebilmeleri için nakdî desteğe de ihtiyaç duymaktadırlar.
    - p: Yürütme Birimi, bu koşullar altında yürütülecek insani yardım çalışmalarının hızlı, koordineli ve sahadaki gerçek ihtiyaçlara dayalı olması gerektiğini vurgulamaktadır. Bu çalışmaların temel amacı; can kayıplarını önlemek, insanların onurunu korumak, karşı karşıya oldukları riskleri azaltmak, ailelerin yaşam koşullarının daha fazla kötüleşmesini engellemek ve yerinden edilmiş nüfusa ev sahipliği yapan toplulukların üzerindeki yükü hafifletmektir.
  - title: 2. Raporun Kapsamı ve Coğrafi Dağılımı
    blocks:
    - p: Bu rapor, Yemen'in on ilindeki yerinden edilme durumunu kapsamaktadır. Yerinden edilmiş ailelerin ve bu ailelerde yaşayan kişilerin illere ve ilçelere göre dağılımı incelenmektedir.
    - p: Aşağıdaki tabloda, rapor kapsamındaki iller, kayıtlı yerinden edilmiş aile ve kişi sayıları ile bu ailelerin bulunduğu ilçelerin sayısı gösterilmektedir.

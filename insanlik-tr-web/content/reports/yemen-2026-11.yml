  sections:
  - title: Proje Özeti
    blocks:
    - p: Bu rapor, 12 Kasım 2026 tarihi itibarıyla Yemen'in on ilinde kayıt altına alınan zorunlu yerinden edilme verilerini kapsamaktadır. Raporda ele alınan iller; El-Hudeyde, Taiz, Lahic, Aden, Ebyen, Şebve, Hadramut, El-Mehra, Marib ve Ed-Dali'dir.
    - p: Söz konusu illerde toplam 50.001 yerinden edilmiş aile kayıt altına alınmış olup bu ailelerin toplam nüfusu 338.748 kişidir. Yerinden edilmenin en yoğun yaşandığı il, 23.007 aile ve 156.898 kişiyle Taiz'dir. Taiz'i, 15.160 aile ve 117.271 kişiyle Lahic takip etmektedir. Diğer illerde ise Ebyen'de 4.540 aile (22.030 kişi), Aden'de 3.741 aile (17.782 kişi) yerinden edilmiş durumdadır. Taiz ve Lahic illerindeki yerinden edilmiş aileler, toplam aile sayısının yaklaşık %70,4'ünü; yerinden edilmiş kişiler ise toplam nüfusun %75,9'unu oluşturmaktadır. Bu veriler, insani yardım kaynaklarının ihtiyaçların yoğunlaştığı bölgelere öncelik verilerek planlanmasının önemini ortaya koymaktadır. Bununla birlikte, diğer illerdeki ihtiyaçların da göz ardı edilmemesi ve yardım çalışmalarının ülke genelinde dengeli biçimde sürdürülmesi gerekmektedir.
    - p: Bu çerçevede Yürütme Birimi; yerel yönetimleri, Birleşmiş Milletler kuruluşlarını, insani yardım koordinasyon mekanizmalarını, ulusal ve uluslararası yardım kuruluşlarını, bağışçıları ve uygulama ortaklarını, yerinden edilmiş ailelerin ihtiyaçlarının karşılanması için gerekli mali kaynakları ve insani yardım kapasitesini harekete geçirmeye çağırmaktadır.

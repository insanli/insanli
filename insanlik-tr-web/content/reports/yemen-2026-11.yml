    - p: وفقًا لمصفوفة تتبع النزوح، نزح 57% (نحو 203,262 فردًا) من أصل نحو 356,602 فرد نزحوا خلال الفترة من 1 أغسطس إلى 17 نوفمبر 2026 داخل محافظاتهم، فيما نزح 43% (نحو 153,340 فردًا) إلى محافظة أخرى. وبحسب المنظمة الدولية للهجرة، تنحدر 65% من حالات النزوح المسجلة (229,193 فردًا) من محافظة تعز. ويدل ارتفاع نسبة التنقل بين المحافظات على اتساع النطاق الجغرافي للنزوح.

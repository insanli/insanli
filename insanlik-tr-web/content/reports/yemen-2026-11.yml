    - h: 1.3 Cross-Border Movements
      level: 1
      id: s2-3
    - p: According to IOM, as of 18 November 2026, 4,336 Yemeni nationals had arrived in Djibouti, mainly through Obock. Information collected in the field indicates that most fled the deteriorating security situation, particularly in the areas of Bab al-Mandab, Dhubab, Al Khawkhah and Al Hodeidah. UNHCR recorded 4,269 new arrivals from Yemen in Djibouti and Somalia as of 16 November 2026.

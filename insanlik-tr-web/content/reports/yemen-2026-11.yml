      level: 1
      id: s4-10
    - p: Ed-Dali ilinde toplam 671 yerinden edilmiş aile (4.738 kişi) kayıt altına alınmıştır. Bu aileler Kataba, Husayn, Ed-Dali ve Ezârik olmak üzere dört ilçede yaşamaktadır.
    - p: İlçelere göre yerinden edilmiş aile ve kişi sayıları aşağıdaki tabloda gösterilmektedir.
    - table:

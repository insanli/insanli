    - h: 4.4. Yemen'deki Ulusal ve Yerel İnsani Yardım Çalışmaları
      level: 1
      id: s5-4
    - h: 4.4.1. Yürütme Birimi Tarafından Yürütülen Çalışmalar
      level: 2
      id: s5-5
    - ul:
      - İl düzeyindeki şubelerde operasyon merkezleri, ilçelerde ise saha ekipleri oluşturularak yerinden edilme hareketlerindeki gelişmelerin düzenli takibi sağlanmıştır.
      - Yeni yerinden edilmiş aileler karşılanmış, bölgeye yeni gelenlerin ve yerinden edilme alanlarında bulunan ailelerin tespiti için saha ziyaretleri gerçekleştirilerek kayıt işlemleri yapılmıştır.
      - Ailelerin sayıları ve bulundukları yerler ön değerlendirmeye tabi tutulmuş; yerinden edilme koşulları ve ilk aşamadaki ihtiyaçları hakkında bilgi toplanmıştır.
      - İlk aşamadaki ihtiyaçlar takip edilip değerlendirilmiş, yerinden edilme kayıtları düzenli olarak güncellenmiş ve yerinden edilmiş ailelere ilişkin listeler hazırlanarak ilgili kurumlara sunulmuştur.
      - İhtiyaçların doğrulanması, ilgili hizmetlere yönlendirme yapılması ve yardım çalışmalarının hızlandırılması amacıyla Yürütme Birimi yönetimine, yerel yönetimlere, ilgili kurumlara ve insani yardım ortaklarına raporlar iletilmiştir.
      - Yardım kapsamına alınan ve henüz destek ulaştırılamayan ailelerin durumları takip edilmiş, sahadaki müdahaleler izlenmiş ve karşılanmamış ihtiyaçlar düzenli olarak güncellenerek yardımların doğru kişilere ulaştırılması ve mükerrer yardımların önlenmesi hedeflenmiştir.
      - Özellikle Taiz ve El-Hudeyde illerinin bazı ilçelerinde son gelişmelerin ardından yaşanan yeni yerinden edilme hareketleri yakından takip edilmiş; saha çalışmaları ve raporlama faaliyetleri sürdürülerek ailelerin göç ettikleri bölgeler tespit edilmeye çalışılmıştır.
    - p: Bunlara ek olarak Yürütme Birimi, merkez ofisinde yerinden edilmeden etkilenen illerdeki gelişmeleri ve insani yardım müdahalelerini takip etmek üzere ayrı bir izleme ekibi oluşturmuştur. Bu ekip tarafından hazırlanan raporlar, Birleşmiş Milletler bünyesindeki insani yardım sektörel koordinasyon grupları ile yerel ve uluslararası yardım kuruluşlarına iletilmiştir.
    - h: 4.4.2. Sağlık Bakanlığı ve Yerel Kurumların Çalışmaları
      level: 2
      id: s5-6
    - p: Halk Sağlığı ve Nüfus Bakanlığı, DSÖ ve UNICEF ile birlikte 7–12 Kasım 2026 tarihlerinde 11 ildeki 100 ilçede ulusal kızamık–kızamıkçık aşı kampanyası düzenlemiştir. Bakanlığa bağlı Sağlık Acil Durum Operasyon Merkezi (HEOC) yaralı ve ölü sayılarını günlük olarak derlemektedir. Hadramut İl Sağlık Müdürlüğü ve Ulusal Sıtma ve Vektör Kontrol Programı, Şihr ilçesinde dang hummasına karşı kapsamlı bir mücadele kampanyası yürütmüştür. Yerinden edilmiş kişilere hizmet veren 50 tesis dâhil 500 sağlık tesisindeki yaklaşık 4.000 sağlık çalışanını kapsayan bir ödeme döngüsü sürmektedir. Yerel kuruluşlardan Selah Vakfı ise Hadramut Sağlık Müdürlüğü aracılığıyla kıyı Hadramut'taki yerinden edilme kamplarında gezici klinikleri desteklemektedir.

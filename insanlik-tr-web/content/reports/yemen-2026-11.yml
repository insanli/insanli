  - title: 4. الوضع الإنساني للأسر النازحة
    blocks:
    - p: تشير المعلومات النوعية الواردة من المحافظات إلى ظروف نزوح صعبة واحتياجات متعددة القطاعات ويبين هذا التحديث اتساع حجم النازحين المسجلين في العشر المحافظات.
    - h: 4.1 المأوى والإيواء
      level: 1
      id: s5-1
    - p: يمثل المأوى والإيواء أولوية أساسية في الاستجابة. وتعتمد أسر نازحة في عدن على استضافة أسر أخرى بينما هناك اسر في العراء ولا يوجد لها مأوى حتى كتابة هذا التقرير؛ ويستدعي الحجم الهائل للنازحين حاليًا التحقق من أوضاع السكن وتحديد الأسر الأكثر احتياجًا ودعم المجتمعات المضيفة.
    - h: 4.2 الغذاء والاحتياجات الأساسية
      level: 1
      id: s5-2
    - p: تُشير جميع التقارير إلى أن الغذاء والمأوى يمثلان احتياجات عاجلة، في حين تُصنَّف المواد الغذائية والإمدادات الأساسية ضمن الاحتياجات ذات الأولوية للأسر النازحة.
    - h: 4.3 المياه والصرف الصحي والنظافة
      level: 1
      id: s5-3
    - p: تُحدَّد مياه الشرب الآمنة والصرف الصحي ومستلزمات النظافة والمراحيض الطارئة وإدارة النفايات باعتبارها احتياجات عاجلة، ولا سيما في مواقع وتجمعات النزوح المنشأة حديثًا.
    - h: 4.4 الصحة والحماية
      level: 1
      id: s5-4
    - p: تواجه الأسر النازحة محدودية في الوصول إلى الخدمات الصحية وخدمات الحماية. ويلزم إيلاء اهتمام ذي أولوية للأطفال والنساء وكبار السن وذوي الإعاقة والأسر المصابة بأمراض مزمنة وغيرها من الأسر شديدة الضعف. وتدعو التقارير المستلمة من المحافظات إلى إجراء تقييمات صحية وحمائية، والإحالة، وتوفير الأدوية والإسعافات الأولية، والدعم النفسي الاجتماعي عند الحاجة، وتعزيز الاستجابة الحمائية.
    - h: 4.5 سبل العيش والهشاشة الاقتصادية
      level: 1
      id: s5-5
    - p: أدى فقدان أو تضرر مصادر الدخل والممتلكات والثروة الحيوانية وغيرها من أصول سبل العيش إلى زيادة الهشاشة الاقتصادية للأسر النازحة. لذا تحتاج العديد من الأسر إلى مساعدة فورية منقذة للحياة، إضافة إلى دعم يمكن أن يحد من الآثار الاقتصادية السلبية للنزوح ومن الاعتماد على مجتمعات مضيفة تعاني أصلًا من ضغوط شديدة.
  - title: 5. الإجراءات التي اتخذتها الوحدة التنفيذية
    blocks:
    - ul:
      - إنشاء غرفة عمليات في فرع المحافظة وفرق ميدانية على مستوى المديريات لمتابعة مستجدات النزوح.
      - استقبال النازحين الجدد وتسجيل الأسر من خلال زيارات ميدانية لمناطق الوصول وتجمعات النزوح.
      - إجراء تحقق أولي من أعداد الأسر ومواقعها، وجمع معلومات عن ظروف النزوح والاحتياجات الأولية.
      - متابعة وتقييم الاحتياجات الأولية، وتحديث بيانات النزوح باستمرار، وإعداد وتقديم قوائم بالنازحين.
      - رفع التقارير إلى قيادة الوحدة التنفيذية والسلطات المحلية والجهات المعنية والشركاء الإنسانيين للتعجيل بالتحقق والإحالة والاستجابة.
      - متابعة حالة الاستجابة والحالات غير المشمولة، ورصد التدخلات، وتحديث الفجوات المتبقية لتحسين الاستهداف والحد من الازدواجية.
      - مواصلة المتابعة الميدانية ورفع التقارير ومتابعة أوضاع النازحين والى اي مناطق نزحوا بعد الاحداث الأخيرة في بعض مديريات تعز والحديدة.
    - p: علاوة على ذلك، أنشأت الوحدة التنفيذية في المكتب الرئيسي فريقًا لرصد الاستجابة لمتابعة مستجدات النزوح في المحافظات المتضررة، وأصدرت تقارير إلى المجموعات القطاعية للأمم المتحدة والمنظمات المحلية والدولية.
  - title: 6. الأولويات والإجراءات العاجلة المقترحة
    blocks:
    - p: ينبغي أن يكون الهدف الفوري هو الحيلولة دون بقاء الأسر النازحة حديثًا دون الحد الأدنى من المساعدة المنقذة للحياة، مع الحفاظ في الوقت ذاته على دقة التسجيل والتحقق والتنسيق. وينبغي أن تسير الاستجابة العاجلة والتقييم القطاعي بالتوازي بدلاً من التسلسل حيثما تكون الاحتياجات الإنسانية الواضحة قائمة بالفعل.
    - ol:
      - إعطاء الأولوية لجميع الأسر النازحة التي لم تتلقَّ مساعدة إنسانية، مع إيلاء اهتمام فوري لأحدث الأسر نزوحًا وأكثرها ضعفًا.
      - توفير المأوى الطارئ ومواد الإيواء، مع إعطاء الأولوية للأسر التي تعيش في العراء ولا تملك سكنًا مستقلًا وللأسر التي تعتمد حاليًا على أسر مضيفة.
      - توسيع نطاق المساعدة الغذائية والمساعدة النقدية العاجلة للأسر التي لا تحصل على دعم غذائي أو دخل.
      - توفير مياه شرب آمنة ومراحيض طارئة ومستلزمات نظافة وخدمات صرف صحي وإدارة نفايات في مواقع الاستقبال وتجمعات النزوح.
      - تفعيل أو توسيع دعم آلية الاستجابة السريعة للأسر النازحة حديثًا المؤهلة، ومطابقة قوائم المستفيدين لمنع الازدواجية.
      - إجراء تقييمات سريعة متعددة القطاعات مع تقديم المساعدة العاجلة في آنٍ واحد، ولا سيما في مناطق الاستقبال المنشأة حديثًا.
      - حشد الشركاء الصحيين لتقديم الخدمات الصحية الأساسية والأدوية والإسعافات الأولية والإحالات.
      - حشد شركاء الحماية لتحديد وإحالة الحالات التي تشمل الأطفال والنساء وكبار السن وذوي الإعاقة والمصابين بأمراض مزمنة وغيرهم من الفئات الأكثر عرضة للخطر.
      - دعم المواد غير الغذائية والضروريات المنزلية الأساسية، وحيثما أمكن، الاحتياجات المرتبطة بسبل العيش للأسر التي فقدت دخلها وأصولها الإنتاجية.
      - تعزيز التتبع اليومي/الأسبوعي للنزوح والاستجابة، مع التمييز بوضوح بين التدخلات المخطط لها والمنفَّذة، وتسجيل أعداد فريدة للأسر بعد إزالة الازدواجية.
      - تعزيز التأهب لموجات نزوح إضافية محتملة من المناطق المتضررة من النزاع.
  - title: 7. التوصيات والنداء الإنساني إلى المنظمات المحلية والدولية
    blocks:
    - p: تناشد الوحدة التنفيذية لإدارة مخيمات النازحين، وبصورة عاجلة، السلطات المحلية ووكالات الأمم المتحدة والمجموعات القطاعية الإنسانية والمنظمات الإنسانية الوطنية والدولية والجهات المانحة وشركاء التنفيذ لحشد الموارد والقدرات التشغيلية الفورية لصالح الأسر النازحة الموثقة في هذا التقرير.
    - p: تضع حركة النزوح الحالية الأسر النازحة حديثًا في أوضاع شديدة الهشاشة. فقد أُجبرت الأسر على ترك منازلها وسبل عيشها بسبب النزاع والتصعيد العسكري، ووصلت في عدة مواقع دون مأوى أو غذاء أو مياه كافية أو إمكانية الحصول على الخدمات الأساسية. وسيؤدي تأخر المساعدة إلى زيادة التعرض لمخاطر الحماية، وتعميق الهشاشة الاقتصادية، وفرض ضغط إضافي على المجتمعات المضيفة.
    - ol:
      - التعامل مع حالات النزوح الموثقة باعتبارها أولوية عاجلة للاستجابة الإنسانية، وتفعيل آليات الطوارئ المتاحة دون تأخير غير ضروري.
      - ضمان تحديد الأسر التي لم تُسجَّل لها أي مساعدة والتحقق منها وإحالتها فورًا إلى القطاع أو شريك الاستجابة المناسب.
      - حشد الموارد للمأوى الطارئ والغذاء والمياه والصرف الصحي والصحة والحماية والمساعدة النقدية والمواد غير الغذائية وغيرها من الاحتياجات الأسرية الأساسية.
      - دعم الاستجابة السريعة والتدخلات الطارئة مع إجراء التقييمات القطاعية المتخصصة بالتوازي.
      - تعزيز التنسيق بين مكاتب الوحدة التنفيذية في المحافظات المشمولة بالتقرير والشركاء الإنسانيين لتتبع مسارات النزوح الأولي والثانوي ومنع الازدواجية أو الاستبعاد.
      - توفير التمويل والدعم التشغيلي الكافيين لتوسيع نطاق تغطية الاستجابة ومعالجة الفجوات المتبقية.
      - إعطاء الأولوية للأطفال والنساء وكبار السن وذوي الإعاقة والأسر التي تعاني من أمراض مزمنة وغيرها من الأسر التي تواجه مخاطر حمائية أو إنسانية متزايدة.
      - ضمان ألا تبقى أي أسرة نازحة حديثًا دون الحد الأدنى من المساعدة الإنسانية بسبب تأخر التقييم أو نقص التمويل أو معوقات التنسيق.
      - الحفاظ على التحديث المستمر للبيانات والإبلاغ الشفاف لتمكين الشركاء الإنسانيين من توجيه المساعدة إلى الأسر والمواقع ذات الاحتياجات الأكبر التي لم تُلبَّ بعد.
  - title: 8. الخاتمة
    blocks:
    - p: تكشف الحصيلة المجمعة عن حجم نزوح كبير في المحافظات العشر، إذ بلغ العدد 50,001 أسرة نازحة تضم 338,748 فردًا. ويعكس هذا العدد اتساع نطاق السكان الذين ينبغي أن تشملهم عمليات التحقق وتقييم الاحتياجات وتخطيط الاستجابة، وما يرتبط بذلك من ضغط على المأوى والخدمات الأساسية وقدرات المجتمعات المضيفة.
    - p: وتستضيف تعز ولحج العدد الأكبر من النازحين المسجلين، بواقع 274,169 فردًا، أي نحو 76.6 من الإجمالي. ويقتضي هذا التركز توسيع القدرة التشغيلية للشركاء في المحافظتين، مع توجيه التدخلات في بقية المحافظات بحسب شدة الاحتياج ومخاطر الحماية، وعدم الاكتفاء بحجم الأعداد معيارًا وحيدًا لتوزيع المساعدة.
    - p: وعليه، تدعو الوحدة التنفيذية الجهات المعنية والشركاء الإنسانيين والمانحين إلى حشد تمويل عاجل وكافٍ لاستجابة منسقة تشمل المأوى والغذاء والمياه والصرف الصحي والصحة والحماية والمساعدات النقدية والمواد الأساسية. وينبغي أن يقترن ذلك بتحديث السجلات، وتتبع النزوح الثانوي، وإزالة الازدواجية، والتحقق من الفجوات الفعلية، بما يضمن وصول المساعدة إلى الأسر الأشد احتياجًا ويحفظ كرامة النازحين ويخفف الأعباء عن المجتمعات المضيفة.
    - end: نهاية التقرير

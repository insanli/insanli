    - h: 3.4. Yerleşim Alanları ve Ev Sahibi Topluluklar
      level: 1
      id: s4-14
    - p: SLSC koordinasyon ekibinin yerleşim alanı izleme verilerine göre son yerinden edilme dalgasıyla birlikte 29 yeni yerleşim alanı kurulmuş, 86 yerleşim alanı yeni gelen aileleri kabul etmiştir. Bu alanlarda yaklaşık 10.000 yeni yerinden edilmiş aile (yaklaşık 60.000 kişi) bulunmaktadır. Hızlı Müdahale Mekanizması (RRM) ise 1 Ağustos'tan bu yana 10 ildeki 65 ilçede 39.835 aileyi (206.864 kişi) doğrulamıştır.
    - p: IOM'a göre yeni gelenler, zaten kapasite sorunu yaşayan ev sahibi topluluklarda ve yerleşim alanlarında hizmetlere ve kaynaklara olan talebi artırmaktadır. Mevcut yerleşim alanlarında su kıtlığı temel endişelerden biri olmaya devam etmektedir. Aden'de ise yerinden edilmiş ailelerin bir kısmı başka ailelerin yanında kalırken bir kısmı açık alanlarda yaşamaktadır (bkz. 5.1.1).
    - src: 'Kaynak: Yemen SLSC Durum Güncellemesi (18 Kasım 2026); IOM, Orta Doğu ve Ötesinde Tırmanma – Hareketlilik Raporu (19 Kasım 2026).'
  - title: 4. Yemen'de Ulusal ve Uluslararası İnsani Yardım Çalışmaları
    blocks:
    - h: 4.1. Uluslararası İnsani Yardım Çalışmalarının Genel Durumu
      level: 1
      id: s5-1
    - p: Sağlık Kümesi'nin verilerine göre 17 Kasım 2026 itibarıyla 26 sağlık ortağı, 9 ildeki 44 ilçede 111.500'ü aşkın yerinden edilmiş kişiye ulaşmıştır. Hizmetler, doğrulanmış 49 gezici sağlık ekibi ve geçici sağlık noktası ile 73 sabit sağlık tesisine verilen destek aracılığıyla sunulmaktadır. DSÖ, 6 ilde 32 travma ve acil bakım ekibini desteklemekte; UNICEF destekli birinci basamak sağlık hizmetleri yerinden edilmiş ve ev sahibi topluluklardan 58.270 kişiye ulaşmıştır.
    - p: Barınma ve temel ihtiyaç malzemeleri alanında Hızlı Müdahale Mekanizması (RRM) listelerindeki 39.835 aileden 31.324'ü (%79) kayıt altına alınarak yardım almış, 8.511 aile (%21) ise kayıtlı olduğu hâlde henüz yardım alamamıştır. IOM'un koruma değerlendirmesi yaptığı ailelerin tamamına kriz danışmanlığı ve psikolojik ilk yardım sağlanmış; ihtiyaç duyan aileler koruma vaka yönetimine, koruma amaçlı nakdî yardıma ve sağlık, su-sanitasyon ve barınma hizmetlerine yönlendirilmiştir. Müdahalelere Sınır Tanımayan Doktorlar (MSF), Uluslararası Kızılhaç Komitesi (ICRC), Islamic Relief Yemen, Field Medical Foundation, UNFPA ve INTERSOS gibi kuruluşlar da katkı sağlamaktadır.
    - h: 4.2. İnsani Yardım Finansmanı ve Finansman Açığı
      level: 1
      id: s5-2
    - p: Kaynak raporlar, yardım çalışmalarının önündeki temel kısıtın finansman olduğunu göstermektedir. 31 Aralık 2026'da sona erecek 90 günlük sağlık müdahale planı 10 Kasım itibarıyla yalnızca %35 oranında finanse edilmiştir. Barınma ve temel ihtiyaç malzemeleri açığını kapatmak için ise 22,2 milyon $ gerekmektedir.

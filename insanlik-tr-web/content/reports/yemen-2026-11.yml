    - h: 3.2. Taiz İli
      level: 1
      id: s4-2
    - p: Taiz ilinde kayıt altına alınan yerinden edilme verilerine göre, toplam 23.007 aileden oluşan 156.898 kişi, 16 ilçeye dağılmış durumdadır. Bu ilçeler; Eş-Şemayetin, El-Muzaffer, El-Muafir, Cebel Habşi, El-Misrah, El-Kahire, Sale, El-Mevasıt, Es-Salu, Meşraa ve Hıdnan, Sabir Mevâdim, El-Muha, El-Vazi'iyye, Mevza, Makbine ve Zubab'dır.
    - p: Yerinden edilmiş ailelerin ve kişilerin ilçelere göre dağılımı aşağıdaki tabloda sunulmaktadır. Taiz ilinde, daha önce Cebel Habşi, Mesrah, Muafir ve Makbine ilçelerinde bulunan çok sayıda yerinden edilmiş aile, Muzaffer ve Kahire ilçelerine göç etmiştir. Saha ekiplerimiz, bu ailelerin hareketliliğini takip etmekte ve sayılarını tespit etmeye yönelik çalışmalarını sürdürmektedir. Yürütme Birimi, söz konusu iki ilçedeki yerinden edilmiş aile sayısının 13.000'i aşacağını öngörmektedir.

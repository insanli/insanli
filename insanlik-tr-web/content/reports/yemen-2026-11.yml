  - title: 1. Humanitarian Situation and Forced Displacement in Yemen
    blocks:
    - p: This report documents conflict-related forced displacement across ten governorates. The ongoing conflict has caused displacement, forcing households to abandon suddenly, or lose, their homes, property, livelihoods, livestock, sources of income and basic necessities. This has increased household vulnerability and reduced their ability to meet their basic needs without humanitarian assistance.
    - p: The humanitarian consequences extend beyond shelter alone. Displaced households may arrive without food, safe water, sanitation facilities, health services, protection support, non-food items or cash resources. The Executive Unit considers a rapid, coordinated and needs-based humanitarian response essential to protecting lives and dignity, reducing protection risks, and preventing further deterioration in household conditions and additional pressure on host communities.
    - h: 1.1 Course of the Conflict and Its Humanitarian Consequences
      level: 1
      id: s2-1
    - p: According to the FEWS NET alert of 17 November 2026, the conflict in Yemen has escalated since July 2026 into a high-intensity, multi-front war marked by fluid battle lines, with Taiz and Lahj governorates emerging as the epicentre of the fighting. According to IOM, fighting intensified from early September 2026 along the West Coast, particularly in Taiz and Al Hodeidah governorates, with major confrontations in Maqbanah, Mawza, Al Mokha and surrounding frontline districts.
    - p: According to WHO's situation report of 17 November 2026, front lines have moved rapidly through Lahj and are approaching Aden, which hosts the main referral hospitals, the Health Emergency Operations Centre (HEOC) and the warehouse supplying the health response. Further movement may change casualty flows and displacement and disrupt referral and supply routes.
    - p: The humanitarian consequences go beyond displacement. Taiz City has been under a de facto siege since October, with worsening shortages of food, fuel, cooking gas and water. Hospitals are struggling with shortages of fuel and medicines, and the risk of cholera and other outbreaks persists. Many families have been displaced two to four times, and some have left sites where they had lived for more than five years, placing further strain on host communities and displacement sites that were already overstretched.
    - h: 1.2 Scale of Displacement Nationwide
      level: 1
      id: s2-2
    - p: According to IOM Yemen's Displacement Tracking Matrix (DTM), 357,658 people (59,602 households) have been displaced since the escalation began in June 2026, of whom approximately 356,602 (59,426 households) were displaced between 1 August and 17 November 2026. Displacement remained relatively low from June to August, rose sharply in early September and peaked at 15,186 people on a single day, 9 September. By mid-November, weekly displacement stood at about 3,150 households. Since 1 January 2026, DTM has recorded 369,012 people displaced.
    - p: The Executive Unit's figure of 338,748 IDPs (50,001 households) presented in this report is a registration count. As WHO notes, it is not directly comparable with IOM DTM data, which track displacement movements.

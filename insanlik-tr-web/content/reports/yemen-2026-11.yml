      level: 1
      id: s4-13
    - p: According to IOM DTM, of the approximately 356,602 people displaced between 1 August and 17 November 2026, 57% (about 203,262 people) were displaced within their own governorate and 43% (about 153,340 people) to a different governorate. According to IOM, 65% of all recorded displacement (229,193 people) originated from Taiz Governorate. The large share of movements between governorates shows that the geographic footprint of displacement is expanding.

  - title: 4. عمليات المساعدات الإنسانية الوطنية والدولية في اليمن
    blocks:
    - h: 4.1 الوضع العام للمساعدات الإنسانية الدولية
      level: 1
      id: s5-1
    - p: وفقًا لمجموعة الصحة، وصل 26 شريكًا صحيًا حتى 17 نوفمبر 2026 إلى أكثر من 111,500 نازح في 44 مديرية ضمن 9 محافظات، عبر 49 فريقًا طبيًا متنقلًا ونقطة صحية مؤقتة جرى التحقق منها، ودعم 73 منشأة صحية ثابتة. وتدعم منظمة الصحة العالمية 32 فريقًا للإصابات والرعاية الطارئة في 6 محافظات، فيما وصلت خدمات الرعاية الصحية الأولية المدعومة من اليونيسف إلى 58,270 شخصًا من النازحين والمجتمعات المضيفة.
    - p: وفي قطاع المأوى والمواد غير الغذائية، سُجلت 31,324 أسرة (79%) من أصل 39,835 أسرة مدرجة في قوائم آلية الاستجابة السريعة وتلقت المساعدة، بينما لا تزال 8,511 أسرة (21%) مسجلة دون أن تتلقى أي مساعدة. وتلقت جميع الأسر التي شملها تقييم الحماية لدى المنظمة الدولية للهجرة الإرشاد في حالات الأزمات والإسعافات النفسية الأولية، وأُحيلت الأسر المحتاجة إلى إدارة حالات الحماية والنقد مقابل الحماية وخدمات الصحة والمياه والإصحاح والمأوى. كما تسهم في الاستجابة منظمات منها أطباء بلا حدود واللجنة الدولية للصليب الأحمر والإغاثة الإسلامية – اليمن ومؤسسة Field Medical Foundation وصندوق الأمم المتحدة للسكان وإنترسوس.
    - h: 4.2 تمويل العمل الإنساني وفجوات التمويل
      level: 1
      id: s5-2
    - p: تُظهر التقارير المصدرية أن التمويل لا يزال القيد الرئيسي أمام الاستجابة؛ إذ لم يُموَّل من خطة الاستجابة الصحية لمدة 90 يومًا، التي تنتهي في 31 ديسمبر 2026، سوى 35% حتى 10 نوفمبر، كما يلزم توفير 22.2 مليون دولار لسد فجوتي المأوى والمواد غير الغذائية.

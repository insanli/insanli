  - title: 5. İnsani İhtiyaçlar ve Yardım Öncelikleri
    blocks:
    - p: İllerden gelen saha bilgileri, yerinden edilmiş ailelerin ağır yaşam koşullarıyla karşı karşıya olduğunu ve farklı alanlarda acil ihtiyaçlarının bulunduğunu göstermektedir. Bu güncelleme, rapor kapsamındaki on ilde kayıt altına alınan yerinden edilmiş nüfusun ulaştığı boyutu ortaya koymaktadır.
    - h: 5.1. Sektörlere Göre İnsani Yardım İhtiyaçları
      level: 1
      id: s6-1
    - p: 'IOM DTM''in 1 Ağustos–17 Kasım 2026 dönemine ilişkin verilerine göre yerinden edilen kişilerin en öncelikli ihtiyaçları barınma, gıda yardımı ve nakdî destektir:'

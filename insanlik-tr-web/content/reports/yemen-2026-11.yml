    - h: 5.4. Öncelikli İhtiyaçlar ve Acil Müdahale Adımları
      level: 1
      id: s6-9
    - p: Öncelikli hedef, yeni yerinden edilmiş ailelerin temel yaşam ihtiyaçlarını karşılayacak acil insani yardımlara erişimini sağlamaktır. Bu süreçte kayıtların doğru tutulması, bilgilerin doğrulanması ve yardım kuruluşları arasındaki koordinasyonun sağlanması da büyük önem taşımaktadır.
    - p: 'Temel ihtiyaçların açıkça görüldüğü durumlarda, acil yardım çalışmaları ile ihtiyaç tespitleri birbirini beklemeden eş zamanlı yürütülmelidir. Bu doğrultuda aşağıdaki adımların öncelikle hayata geçirilmesi önerilmektedir:'
    - ol:
      - Henüz herhangi bir insani yardım almamış yerinden edilmiş ailelere öncelik verilmesi; özellikle yakın zamanda yerinden edilmiş ve yaşam koşulları en ağır olan ailelere acilen ulaşılması.
      - Acil barınma desteği ve barınma malzemelerinin sağlanması. Açık alanlarda yaşayan, kendilerine ait bir barınma imkânı bulunmayan veya başka ailelerin yanında kalmak zorunda olan ailelere öncelik verilmesi.
      - Gıda yardımına veya düzenli bir gelir kaynağına erişimi olmayan ailelere yönelik gıda ve acil nakdî yardım desteğinin artırılması.
      - Yerinden edilmiş ailelerin bulunduğu kabul noktalarında ve geçici yerleşim alanlarında temiz içme suyu, acil tuvalet imkânları, hijyen malzemeleri, atık su ve atık yönetimi hizmetlerinin sağlanması.
      - Yeni yerinden edilmiş ve gerekli şartları taşıyan ailelere yönelik Hızlı Müdahale Mekanizması'nın devreye alınması veya mevcut desteğin genişletilmesi; aynı ailelere birden fazla kez yardım ulaştırılmasını önlemek amacıyla yararlanıcı kayıtlarının karşılaştırılması.
      - Özellikle yeni oluşan yerleşim alanlarında barınma, gıda, su, sağlık ve koruma gibi temel ihtiyaçları kapsayan hızlı değerlendirmeler yapılması ve acil yardımların bu değerlendirmelerle eş zamanlı olarak ulaştırılması.
      - Temel sağlık hizmetlerinin sunulması, ilaç ve ilk yardım desteğinin sağlanması ve ihtiyaç duyan kişilerin uygun sağlık kuruluşlarına yönlendirilmesi için sağlık alanında faaliyet gösteren yardım kuruluşlarının harekete geçirilmesi.
      - Çocuklar, kadınlar, yaşlılar, engelli bireyler, kronik hastalığı bulunanlar ve diğer hassas grupların belirlenmesi; ihtiyaç duyan kişilerin ilgili koruma hizmetlerine yönlendirilmesi için koruma alanında çalışan kuruluşlarla iş birliğinin güçlendirilmesi.
      - Gelir kaynaklarını ve üretim araçlarını kaybeden ailelere ev eşyaları ve diğer temel ihtiyaç malzemelerinin sağlanması; imkânlar dâhilinde geçim kaynaklarını yeniden oluşturmalarına yönelik destek verilmesi.
      - Yerinden edilme hareketlerinin ve yardım çalışmalarının günlük veya haftalık olarak takip edilmesi. Planlanan yardımlar ile fiilen ulaştırılan yardımların ayrı ayrı kaydedilmesi, mükerrer kayıtların ayıklanması ve ulaşılan tekil aile sayısının belirlenmesi.
      - Çatışmalardan etkilenen bölgelerden yeni yerinden edilme dalgalarının yaşanması ihtimaline karşı gerekli hazırlıkların yapılması ve mevcut müdahale kapasitesinin güçlendirilmesi.
  - title: 6. İnsani Yardımların Ulaştırılması ve Erişim
    blocks:
    - h: 6.1. Yardım Sevkiyatı ve Lojistik Merkezler
      level: 1
      id: s7-1
    - p: Aden; ana sevk hastanelerine, Sağlık Acil Durum Operasyon Merkezi'ne ve sağlık müdahalesini besleyen depoya ev sahipliği yaptığından yardım sevkiyatında kilit bir merkezdir. DSÖ, Taiz'deki Halife Hastanesi, Neşme Hastanesi ve Muzaffer ishal tedavi merkezine 19,6 ton ilaç ve tıbbi malzeme ulaştırmıştır. Barınma alanında ortakların stoklarında 4.115 barınma kiti ve çadır ile 8.271 tam NFI kiti bulunmakta, ayrıca 5.250 kısmi NFI kiti dağıtılmayı beklemektedir. Cephe hattının Aden'e yaklaşması, sevk ve ikmal güzergâhlarını kesintiye uğratma riski taşımaktadır.
    - h: 6.2. Erişimin Kısıtlı Olduğu Bölgeler
      level: 1
      id: s7-2
    - table:
        head:
        - Bölge
        - Erişim Durumu
        - Kaynak
        rows:

    - src: 'المصادر: تحديث الوضع الصادر عن فريق تنسيق SLSC في اليمن (18 نوفمبر 2026)؛ منظمة الصحة العالمية – اليمن، التقرير الموقفي رقم 12 بشأن تصاعد النزاع (17 نوفمبر 2026)؛ شبكة نظم الإنذار المبكر بالمجاعة (FEWS NET)، تنبيه بشأن اليمن (17 نوفمبر 2026)؛ المنظمة الدولية للهجرة – مصفوفة تتبع النزوح في اليمن، التحديث العاجل رقم 19 (18 نوفمبر 2026).'
    - h: 5.4 الأولويات والإجراءات العاجلة المقترحة
      level: 1
      id: s6-9
    - p: ينبغي أن يكون الهدف الفوري هو الحيلولة دون بقاء الأسر النازحة حديثًا دون الحد الأدنى من المساعدة المنقذة للحياة، مع الحفاظ في الوقت ذاته على دقة التسجيل والتحقق والتنسيق. وينبغي أن تسير الاستجابة العاجلة والتقييم القطاعي بالتوازي بدلاً من التسلسل حيثما تكون الاحتياجات الإنسانية الواضحة قائمة بالفعل.
    - ol:
      - إعطاء الأولوية لجميع الأسر النازحة التي لم تتلقَّ مساعدة إنسانية، مع إيلاء اهتمام فوري لأحدث الأسر نزوحًا وأكثرها ضعفًا.
      - توفير المأوى الطارئ ومواد الإيواء، مع إعطاء الأولوية للأسر التي تعيش في العراء ولا تملك سكنًا مستقلًا وللأسر التي تعتمد حاليًا على أسر مضيفة.
      - توسيع نطاق المساعدة الغذائية والمساعدة النقدية العاجلة للأسر التي لا تحصل على دعم غذائي أو دخل.
      - توفير مياه شرب آمنة ومراحيض طارئة ومستلزمات نظافة وخدمات صرف صحي وإدارة نفايات في مواقع الاستقبال وتجمعات النزوح.
      - تفعيل أو توسيع دعم آلية الاستجابة السريعة للأسر النازحة حديثًا المؤهلة، ومطابقة قوائم المستفيدين لمنع الازدواجية.
      - إجراء تقييمات سريعة متعددة القطاعات مع تقديم المساعدة العاجلة في آنٍ واحد، ولا سيما في مناطق الاستقبال المنشأة حديثًا.
      - حشد الشركاء الصحيين لتقديم الخدمات الصحية الأساسية والأدوية والإسعافات الأولية والإحالات.
      - حشد شركاء الحماية لتحديد وإحالة الحالات التي تشمل الأطفال والنساء وكبار السن وذوي الإعاقة والمصابين بأمراض مزمنة وغيرهم من الفئات الأكثر عرضة للخطر.
      - دعم المواد غير الغذائية والضروريات المنزلية الأساسية، وحيثما أمكن، الاحتياجات المرتبطة بسبل العيش للأسر التي فقدت دخلها وأصولها الإنتاجية.
      - تعزيز التتبع اليومي/الأسبوعي للنزوح والاستجابة، مع التمييز بوضوح بين التدخلات المخطط لها والمنفَّذة، وتسجيل أعداد فريدة للأسر بعد إزالة الازدواجية.
      - تعزيز التأهب لموجات نزوح إضافية محتملة من المناطق المتضررة من النزاع.
  - title: 6. إيصال المساعدات الإنسانية والوصول
    blocks:
    - h: 6.1 إيصال المساعدات ومراكز الإمداد
      level: 1
      id: s7-1
    - p: تُعد عدن مركزًا رئيسيًا لإيصال المساعدات، إذ تضم مستشفيات الإحالة الرئيسية ومركز عمليات الطوارئ الصحية والمستودع الذي يزوّد الاستجابة الصحية بالإمدادات. وقد أوصلت منظمة الصحة العالمية 19.6 طنًا متريًا من الأدوية والمستلزمات الطبية إلى مستشفى خليفة ومستشفى النشمة ومركز علاج الإسهالات في المظفر بتعز. وفي قطاع المأوى، يتوفر لدى الشركاء مخزون من 4,115 حقيبة مأوى وخيمة و8,271 حقيبة كاملة من المواد غير الغذائية، إضافة إلى 5,250 حقيبة جزئية بانتظار التوزيع. ويهدد اقتراب خط المواجهة من عدن طرق الإحالة والإمداد.
    - h: 6.2 المناطق ذات الوصول المقيّد
      level: 1
      id: s7-2
    - table:
        head:
        - المنطقة
        - وضع الوصول
        - المصدر
        rows:
        - - مدينة تعز
          - آخر طريق رئيسي يربط المدينة بالمناطق الخاضعة لسيطرة الحكومة مقطوع منذ 4 أكتوبر 2026؛ تصل كميات محدودة من الغذاء والسلع الأساسية عبر طرق جبلية صغيرة وبتكلفة مرتفعة
          - FEWS NET
        - - الحديدة
          - لا وصول لفريق مصفوفة تتبع النزوح منذ 9 سبتمبر 2026؛ يبقى عدد النازحين ثابتًا عند 8,244
          - المنظمة الدولية للهجرة
        - - عدن
          - أوقفت الوحدة التنفيذية عملها الميداني بسبب قيود الوصول؛ خط المواجهة يقترب من عدن
          - الوحدة التنفيذية، منظمة الصحة العالمية
        - - المناطق الخاضعة لسيطرة سلطات الأمر الواقع
          - لا وصول إلى البيانات الصحية الروتينية؛ تُفيد التقارير بنقص المستلزمات الطبية والجراحية في المستشفيات
          - منظمة الصحة العالمية
        - - المناطق النائية في حجة
          - صعوبة الوصول إلى علاج الإسهال المائي الحاد والكوليرا
          - منظمة الصحة العالمية
        fold: false
    - p: وللوصول إلى المستشفيات على جانبي خط المواجهة، توصي منظمة الصحة العالمية باستخدام طرق إيصال بديلة، منها الإيصال عبر الشركاء والتحركات عبر خطوط التماس والرحلات الجوية الإنسانية، إلى جانب التفاوض مع جميع الأطراف بشأن الوصول.
    - src: 'المصادر: منظمة الصحة العالمية – اليمن، التقرير الموقفي رقم 12 بشأن تصاعد النزاع (17 نوفمبر 2026)؛ شبكة نظم الإنذار المبكر بالمجاعة (FEWS NET)، تنبيه بشأن اليمن (17 نوفمبر 2026)؛ المنظمة الدولية للهجرة – مصفوفة تتبع النزوح في اليمن، التحديث العاجل رقم 19 (18 نوفمبر 2026)؛ تحديث الوضع الصادر عن فريق تنسيق SLSC في اليمن (18 نوفمبر 2026).'
  - title: 7. التحديات التي تواجه عمليات المساعدات الإنسانية
    blocks:
    - p: 'تُبرز التقارير المصدرية والملاحظات الميدانية للوحدة التنفيذية التحديات الرئيسية التالية أمام الاستجابة الإنسانية:'
    - ol:
      - 'الأوضاع الأمنية: تتغير خطوط المواجهة بسرعة وتقترب من عدن عبر لحج، ما يهدد بزيادة أعداد الضحايا والنازحين وقطع طرق الإحالة والإمداد.'
      - 'القيود على الوصول الميداني: تخضع مدينة تعز لحصار فعلي، وفقدت مصفوفة تتبع النزوح إمكانية الوصول إلى الحديدة، واضطرت الوحدة التنفيذية إلى إيقاف عملها الميداني في عدن، ولا يمكن الحصول على البيانات الروتينية من المناطق الخاضعة لسيطرة سلطات الأمر الواقع.'
      - 'نقص التمويل: لم تُموَّل خطة الاستجابة الصحية لمدة 90 يومًا إلا بنسبة 35%، ولا تتوفر لفرق الإصابات المدعومة من منظمة الصحة العالمية تمويلات إلا حتى يناير 2027، وتبلغ فجوة المأوى والمواد غير الغذائية 22.2 مليون دولار.'
      - 'نقص الإمدادات والتحديات اللوجستية: تعاني مستشفيات تعز نقصًا حرجًا في الوقود والمستلزمات الجراحية وأدوية التخدير والعناية المركزة، مع غياب صيانة سيارات الإسعاف.'
      - 'تكرار النزوح: نزحت أسر كثيرة مرتين إلى أربع مرات، وانتقلت أسر عديدة سبق تسجيلها في عدن إلى لحج وأبين، ما يصعّب تتبع النزوح الثانوي.'
      - 'الحصول على بيانات محدثة وموثوقة: تتراوح نسبة اكتمال الإبلاغ اليومي عن الضحايا بين 58% و92%، ولا يمكن مقارنة بيانات التسجيل لدى الوحدة التنفيذية مباشرة ببيانات الحركة لدى مصفوفة تتبع النزوح، كما لا تُطابَق سجلات المساعدات مع قوائم آلية الاستجابة السريعة على مستوى الأسرة.'
      - 'الأسر التي لم تصلها المساعدات: لا تزال 8,511 أسرة (21%) مسجلة في قوائم آلية الاستجابة السريعة دون مساعدة، ويبقى وصول النازحين إلى الرعاية الصحية الأولية محدودًا في تعز وأبين وشبوة.'
      - 'فجوات الخدمات الصحية: لا تحظى رعاية الحروق والصحة النفسية والدعم النفسي الاجتماعي وإعادة التأهيل بتمويل كافٍ، ولا يتوفر تمويل لنقل حالات الإصابات المحالة.'
      - 'مخاطر تفشي الأمراض: رغم تراجع الكوليرا في المحافظات الخمس الأكثر تضررًا، تتوسع في تريم (وادي حضرموت) فاشية مركبة تجمع بين التسمم الغذائي والكوليرا، وترتفع حالات الإسهال المائي الحاد في حجة.'
    - src: 'المصادر: منظمة الصحة العالمية – اليمن، التقرير الموقفي رقم 12 بشأن تصاعد النزاع (17 نوفمبر 2026)؛ شبكة نظم الإنذار المبكر بالمجاعة (FEWS NET)، تنبيه بشأن اليمن (17 نوفمبر 2026)؛ المنظمة الدولية للهجرة – مصفوفة تتبع النزوح في اليمن، التحديث العاجل رقم 19 (18 نوفمبر 2026)؛ المنظمة الدولية للهجرة، تقرير التنقل: التصعيد في الشرق الأوسط وما بعده (19 نوفمبر 2026)؛ تحديث الوضع الصادر عن فريق تنسيق SLSC في اليمن (18 نوفمبر 2026).'
  - title: 8. توصيات لتحسين الوضع الإنساني في اليمن
    blocks:
    - h: 8.1 النداء الإنساني إلى المنظمات المحلية والدولية
      level: 1
      id: s9-1
    - p: تناشد الوحدة التنفيذية لإدارة مخيمات النازحين، وبصورة عاجلة، السلطات المحلية ووكالات الأمم المتحدة والمجموعات القطاعية الإنسانية والمنظمات الإنسانية الوطنية والدولية والجهات المانحة وشركاء التنفيذ لحشد الموارد والقدرات التشغيلية الفورية لصالح الأسر النازحة الموثقة في هذا التقرير.
    - p: تضع حركة النزوح الحالية الأسر النازحة حديثًا في أوضاع شديدة الهشاشة. فقد أُجبرت الأسر على ترك منازلها وسبل عيشها بسبب النزاع والتصعيد العسكري، ووصلت في عدة مواقع دون مأوى أو غذاء أو مياه كافية أو إمكانية الحصول على الخدمات الأساسية. وسيؤدي تأخر المساعدة إلى زيادة التعرض لمخاطر الحماية، وتعميق الهشاشة الاقتصادية، وفرض ضغط إضافي على المجتمعات المضيفة.
    - ol:
      - التعامل مع حالات النزوح الموثقة باعتبارها أولوية عاجلة للاستجابة الإنسانية، وتفعيل آليات الطوارئ المتاحة دون تأخير غير ضروري.
      - ضمان تحديد الأسر التي لم تُسجَّل لها أي مساعدة والتحقق منها وإحالتها فورًا إلى القطاع أو شريك الاستجابة المناسب.
      - حشد الموارد للمأوى الطارئ والغذاء والمياه والصرف الصحي والصحة والحماية والمساعدة النقدية والمواد غير الغذائية وغيرها من الاحتياجات الأسرية الأساسية.
      - دعم الاستجابة السريعة والتدخلات الطارئة مع إجراء التقييمات القطاعية المتخصصة بالتوازي.
      - تعزيز التنسيق بين مكاتب الوحدة التنفيذية في المحافظات المشمولة بالتقرير والشركاء الإنسانيين لتتبع مسارات النزوح الأولي والثانوي ومنع الازدواجية أو الاستبعاد.
      - توفير التمويل والدعم التشغيلي الكافيين لتوسيع نطاق تغطية الاستجابة ومعالجة الفجوات المتبقية.
      - إعطاء الأولوية للأطفال والنساء وكبار السن وذوي الإعاقة والأسر التي تعاني من أمراض مزمنة وغيرها من الأسر التي تواجه مخاطر حمائية أو إنسانية متزايدة.
      - ضمان ألا تبقى أي أسرة نازحة حديثًا دون الحد الأدنى من المساعدة الإنسانية بسبب تأخر التقييم أو نقص التمويل أو معوقات التنسيق.
      - الحفاظ على التحديث المستمر للبيانات والإبلاغ الشفاف لتمكين الشركاء الإنسانيين من توجيه المساعدة إلى الأسر والمواقع ذات الاحتياجات الأكبر التي لم تُلبَّ بعد.
    - h: 8.2 أبرز التوصيات الواردة في تقارير المنظمات الإنسانية
      level: 1
      id: s9-2
    - ol:
      - تقديم مساعدات غذائية إنسانية عاجلة للأسر في مدينة تعز المحاصرة، وفقًا لتنبيه شبكة FEWS NET.
      - حشد 22.2 مليون دولار لسد فجوتي المأوى والمواد غير الغذائية، و3.6 مليون دولار لإدارة المواقع وصيانتها (SLSC).
      - مراجعة خطط الطوارئ لمواجهة الزيادة المحتملة في أعداد المصابين مع اقتراب خط المواجهة من عدن، وتأمين طرق بديلة للإحالة والإمداد واستمرارية العمليات، وتخصيص الموارد اللازمة لذلك (منظمة الصحة العالمية).
      - تمويل نقاط تثبيت الإصابات ونقل الحالات المحالة ورعاية الحروق والصحة النفسية والدعم النفسي الاجتماعي وإعادة التأهيل، وضمان التمويل لما بعد يناير 2027 (منظمة الصحة العالمية).
      - استخدام طرق إيصال بديلة والتفاوض مع جميع الأطراف بشأن الوصول إلى المستشفيات على جانبي خط المواجهة (منظمة الصحة العالمية).
      - الوصول إلى 73,300 طفل لم تشملهم حملة الحصبة والحصبة الألمانية عبر التحصين الاستدراكي، ولا سيما في شبوة وحضرموت والمهرة وسقطرى (منظمة الصحة العالمية).
      - تنفيذ استجابة مشتركة في مجالات سلامة الغذاء والمياه والإصحاح وإدارة الحالات لمواجهة الفاشية في تريم (منظمة الصحة العالمية).
      - تعزيز تنسيق الاستجابة بين المحافظات في ظل تزايد التنقل بينها، وإيلاء اهتمام أكبر للاحتياجات المتغيرة للنازحين في مناطق الاستقبال (المنظمة الدولية للهجرة).
      - إجراء مراجعة أثناء التنفيذ بقيادة وزارة الصحة العامة والسكان قبل انتهاء خطة الاستجابة الحالية (منظمة الصحة العالمية).
    - src: 'المصادر: شبكة نظم الإنذار المبكر بالمجاعة (FEWS NET)، تنبيه بشأن اليمن (17 نوفمبر 2026)؛ تحديث الوضع الصادر عن فريق تنسيق SLSC في اليمن (18 نوفمبر 2026)؛ منظمة الصحة العالمية – اليمن، التقرير الموقفي رقم 12 بشأن تصاعد النزاع (17 نوفمبر 2026)؛ المنظمة الدولية للهجرة – مصفوفة تتبع النزوح في اليمن، التحديث العاجل رقم 19 (18 نوفمبر 2026).'
  - title: 9. الخاتمة
    in_toc: false
    blocks:
    - p: تكشف الحصيلة المجمعة عن حجم نزوح كبير في المحافظات العشر، إذ بلغ العدد 50,001 أسرة نازحة تضم 338,748 فردًا. ويعكس هذا العدد اتساع نطاق السكان الذين ينبغي أن تشملهم عمليات التحقق وتقييم الاحتياجات وتخطيط الاستجابة، وما يرتبط بذلك من ضغط على المأوى والخدمات الأساسية وقدرات المجتمعات المضيفة.
    - p: وتستضيف تعز ولحج العدد الأكبر من النازحين المسجلين، بواقع 274,169 فردًا، أي نحو 80.9% من الإجمالي. ويقتضي هذا التركز توسيع القدرة التشغيلية للشركاء في المحافظتين، مع توجيه التدخلات في بقية المحافظات بحسب شدة الاحتياج ومخاطر الحماية، وعدم الاكتفاء بحجم الأعداد معيارًا وحيدًا لتوزيع المساعدة.
    - p: وعليه، تدعو الوحدة التنفيذية الجهات المعنية والشركاء الإنسانيين والمانحين إلى حشد تمويل عاجل وكافٍ لاستجابة منسقة تشمل المأوى والغذاء والمياه والصرف الصحي والصحة والحماية والمساعدات النقدية والمواد الأساسية. وينبغي أن يقترن ذلك بتحديث السجلات، وتتبع النزوح الثانوي، وإزالة الازدواجية، والتحقق من الفجوات الفعلية، بما يضمن وصول المساعدة إلى الأسر الأشد احتياجًا ويحفظ كرامة النازحين ويخفف الأعباء عن المجتمعات المضيفة.

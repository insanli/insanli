  - title: 7. İnsani Yardım Çalışmalarında Karşılaşılan Zorluklar
    blocks:
    - p: 'Kaynak raporlar ve Yürütme Birimi''nin saha gözlemleri, insani yardım çalışmalarının karşılaştığı başlıca zorlukları şöyle ortaya koymaktadır:'
    - ol:
      - 'Güvenlik koşulları: Cephe hatları hızla değişmekte ve Lahic üzerinden Aden''e yaklaşmaktadır. Bu durum yaralı sayısını ve yerinden edilmeyi artırma, sevk ve ikmal güzergâhlarını kesme riski taşımaktadır.'
      - 'Saha erişimindeki kısıtlamalar: Taiz kenti fiilen kuşatma altındadır; El-Hudeyde''de IOM DTM''in erişimi kesilmiştir; Aden''de Yürütme Birimi saha faaliyetlerini durdurmak zorunda kalmıştır; fiilî yetkililerin kontrolündeki bölgelerden rutin veri alınamamaktadır.'
      - 'Finansman yetersizliği: 90 günlük sağlık müdahale planı %35 oranında finanse edilmiştir; DSÖ destekli travma ekipleri yalnızca Ocak 2027''ye kadar finanse edilmiştir; barınma ve NFI açığı 22,2 milyon $''dır.'
      - 'Lojistik ve malzeme sıkıntısı: Taiz''deki hastanelerde yakıt, cerrahi malzeme, anestezi ve yoğun bakım ilaçları kritik düzeyde azalmış, ambulansların bakımı yapılamamaktadır.'
      - 'Ailelerin sürekli yer değiştirmesi: Pek çok aile iki ila dört kez yerinden edilmiştir. Aden''de daha önce kayda alınan çok sayıda aile Lahic ve Ebyen''e geçmiş, bu da ikincil yer değiştirmelerin izlenmesini güçleştirmiştir.'
      - 'Güncel ve doğrulanmış veriye erişim: Günlük kayıp bildirimlerinin oranı %58 ile %92 arasında kalmaktadır. Yürütme Birimi''nin kayıt verileri ile IOM DTM''in hareket verileri doğrudan karşılaştırılamamakta, yardım kayıtları RRM listeleriyle aile bazında eşleştirilememektedir.'
      - 'Yardıma erişemeyen aileler: RRM listelerindeki 8.511 aile (%21) kayıtlı olduğu hâlde henüz yardım alamamıştır; Taiz, Ebyen ve Şebve''de yerinden edilmiş kişilerin temel sağlık hizmetlerine erişimi sınırlıdır.'
      - 'Sağlık hizmetlerindeki boşluklar: Yanık tedavisi, ruh sağlığı ve psikososyal destek ile rehabilitasyon hizmetleri yeterince finanse edilmemektedir; travma sevk sistemi için ayrılmış bir finansman bulunmamaktadır.'
      - 'Salgın hastalık riski: Kolera vakaları en çok etkilenen beş ilde azalmakla birlikte Hadramut Vadisi''ndeki Terim''de gıda zehirlenmesi ile kolera bulaşının birlikte görüldüğü karmaşık bir salgın büyümekte, Hacce''de ishal vakaları artmaktadır.'
    - src: 'Kaynaklar: DSÖ Yemen, Çatışmaların Tırmanması Durum Raporu No. 12 (17 Kasım 2026); FEWS NET Yemen Uyarısı (17 Kasım 2026); IOM Yemen DTM, Hızlı Güncelleme No. 19 (18 Kasım 2026); IOM, Orta Doğu ve Ötesinde Tırmanma – Hareketlilik Raporu (19 Kasım 2026); Yemen SLSC Durum Güncellemesi (18 Kasım 2026).'
  - title: 8. Yemen'deki İnsani Durumun İyileştirilmesine Yönelik Öneriler
    blocks:
    - h: 8.1. Yerel ve Uluslararası Kuruluşlara Çağrı
      level: 1
      id: s9-1
    - p: Ülke İçinde Yerinden Edilmiş Kişilerin Kamplarının Yönetiminden Sorumlu Yürütme Birimi; yerel yönetimleri, Birleşmiş Milletler kuruluşlarını, insani yardım koordinasyon gruplarını, ulusal ve uluslararası yardım kuruluşlarını, bağışçıları ve uygulayıcı ortakları, bu raporda kayıt altına alınan yerinden edilmiş ailelerin ihtiyaçlarının karşılanması için gerekli kaynakları ve saha kapasitesini acilen harekete geçirmeye çağırmaktadır.
    - p: 'Son dönemde artan çatışmalar ve askerî operasyonlar nedeniyle çok sayıda aile evlerini ve geçim kaynaklarını terk etmek zorunda kalmıştır. Yeni yerleştikleri bölgelere ulaşan ailelerin bir kısmı barınma imkânından, yeterli gıdadan, temiz sudan ve temel hizmetlerden yoksun durumdadır. Yardımların gecikmesi, bu ailelerin karşı karşıya olduğu insani ve koruma risklerini artıracak, ekonomik koşullarını daha da ağırlaştıracak ve yerinden edilmiş ailelere ev sahipliği yapan toplulukların yükünü artıracaktır. Bu nedenle ilgili kurum ve kuruluşların aşağıdaki adımları öncelikli olarak ele alması gerekmektedir:'
    - ol:
      - Kayıt altına alınan yerinden edilme vakalarının acil insani yardım kapsamında değerlendirilmesi ve mevcut acil müdahale mekanizmalarının gecikmeden devreye sokulması.
      - Henüz herhangi bir yardım almamış ailelerin belirlenmesi, bilgilerinin doğrulanması ve ihtiyaçlarına uygun yardım kuruluşlarına veya ilgili yardım sektörlerine yönlendirilmesi.
      - Acil barınma, gıda, temiz su, sanitasyon, sağlık, koruma, nakdî yardım ve temel ihtiyaç malzemelerinin karşılanması için gerekli kaynakların seferber edilmesi.
      - Acil yardım ve hızlı müdahale çalışmalarının desteklenmesi; ihtiyaç duyulan alanlarda ayrıntılı değerlendirmelerin de eş zamanlı olarak yürütülmesi.
      - Rapor kapsamındaki illerde görev yapan Yürütme Birimi ofisleri ile insani yardım kuruluşları arasındaki koordinasyonun güçlendirilmesi. Ailelerin ilk yer değiştirme hareketlerinin yanı sıra daha sonra yaşanan yeni yer değiştirmelerin de takip edilmesi; mükerrer yardımların ve ihtiyaç sahibi ailelerin yardım dışında kalmasının önlenmesi.
      - Yardım çalışmalarının daha geniş bir alana ulaşabilmesi ve karşılanmamış ihtiyaçların giderilebilmesi için yeterli finansman ve operasyonel desteğin sağlanması.
      - Çocuklara, kadınlara, yaşlılara, engelli bireylere, kronik hastalığı bulunanlara ve insani yardım ya da koruma açısından daha yüksek risk altında olan ailelere öncelik verilmesi.
      - Değerlendirme süreçlerinin uzaması, finansman yetersizliği veya koordinasyon sorunları nedeniyle yeni yerinden edilmiş hiçbir ailenin temel insani yardımlardan mahrum kalmamasının sağlanması.
      - Kayıtların düzenli olarak güncellenmesi ve bilgilerin şeffaf biçimde paylaşılması. Böylece insani yardım kuruluşlarının henüz karşılanmamış ihtiyaçları doğru belirlemesi ve yardımları en fazla ihtiyaç duyan ailelere ulaştırması.
    - h: 8.2. İnsani Yardım Kuruluşlarının Raporlarında Öne Çıkan Öneriler
      level: 1
      id: s9-2
    - ol:
      - FEWS NET'in uyarısı doğrultusunda kuşatma altındaki Taiz kentinde yaşayan hanelere acil insani gıda yardımı sağlanması.
      - Barınma ve NFI açığının kapatılması için gereken 22,2 milyon $ ile yerleşim alanlarının yönetimi ve bakımı için gereken 3,6 milyon $'ın sağlanması (SLSC).
      - Cephe hattının Aden'e yaklaşması karşısında yaralı sayısındaki olası artışa yönelik acil durum planlarının, alternatif sevk ve ikmal güzergâhlarının ve operasyonların sürekliliğinin gözden geçirilmesi ve bunlar için kaynak ayrılması (DSÖ).
      - Travma stabilizasyon noktaları, travma sevk sistemi, yanık tedavisi, ruh sağlığı ve psikososyal destek ile rehabilitasyon hizmetlerinin finanse edilmesi; Ocak 2027'den sonrası için de finansmanın güvence altına alınması (DSÖ).
      - Cephe hattının her iki tarafındaki hastanelere ulaşmak için alternatif teslimat yollarının kullanılması ve tüm taraflarla erişim müzakerelerinin yürütülmesi (DSÖ).
      - Kızamık–kızamıkçık kampanyasında ulaşılamayan 73.300 çocuğa, özellikle Şebve, Hadramut, El-Mehra ve Sokotra'da takip aşılamasıyla ulaşılması (DSÖ).
      - Terim'deki salgına karşı gıda güvenliği, su-sanitasyon ve vaka yönetimi alanlarında ortak müdahale yürütülmesi (DSÖ).
      - İller arası yer değiştirmelerin artması nedeniyle müdahalelerin iller arasında daha güçlü biçimde koordine edilmesi ve ailelerin yerleştiği bölgelerdeki değişen ihtiyaçlara daha fazla önem verilmesi (IOM).
      - Mevcut müdahale planı sona ermeden Sağlık Bakanlığı liderliğinde bir ara değerlendirme (Intra-Action Review) yapılması (DSÖ).
    - src: 'Kaynaklar: FEWS NET Yemen Uyarısı (17 Kasım 2026); Yemen SLSC Durum Güncellemesi (18 Kasım 2026); DSÖ Yemen, Çatışmaların Tırmanması Durum Raporu No. 12 (17 Kasım 2026); IOM Yemen DTM, Hızlı Güncelleme No. 19 (18 Kasım 2026).'
  - title: 9. Sonuç
    in_toc: false
    blocks:
    - p: Rapor kapsamında derlenen veriler, Yemen'in on ilinde yaşanan yerinden edilmenin boyutunu ortaya koymaktadır. Kayıtlara göre toplam 50.001 aileden oluşan 338.748 kişi yerinden edilmiştir. Bu sayı, ihtiyaç tespiti, kayıtların doğrulanması ve yardım planlamasının geniş bir nüfusu kapsaması gerektiğini göstermektedir. Aynı zamanda barınma imkânları, temel hizmetler ve yerinden edilmiş ailelere ev sahipliği yapan topluluklar üzerindeki baskının boyutuna da işaret etmektedir.
    - p: Yerinden edilmiş kişilerin en büyük bölümü Taiz ve Lahic illerinde bulunmaktadır. Bu iki ilde toplam 274.169 kişi kayıt altına alınmıştır. Bu sayı, raporda belirtilen genel toplamın yaklaşık %80,9'una karşılık gelmektedir. Söz konusu yoğunlaşma, özellikle bu iki ilde insani yardım kuruluşlarının saha çalışmalarını ve müdahale kapasitesini artırmasını gerekli kılmaktadır. Bununla birlikte, diğer illerdeki ihtiyaçlar da göz ardı edilmemeli; yardımların dağıtımında yalnızca yerinden edilmiş kişi sayısı değil, ailelerin içinde bulunduğu koşullar ve ihtiyaçların aciliyeti de dikkate alınmalıdır.
    - p: Bu çerçevede Yürütme Birimi; ilgili kurumları, insani yardım kuruluşlarını ve bağışçıları, barınma, gıda, su, sanitasyon, sağlık, koruma, nakdî yardım ve temel ihtiyaç malzemelerini kapsayan koordineli bir yardım çalışması için acil ve yeterli kaynak sağlamaya çağırmaktadır.
    - p: Yardımların ihtiyaç sahiplerine zamanında ve doğru biçimde ulaştırılabilmesi için kayıtların düzenli olarak güncellenmesi, ailelerin sonraki yer değiştirme hareketlerinin takip edilmesi, mükerrer kayıtların ayıklanması ve henüz karşılanmamış ihtiyaçların belirlenmesi gerekmektedir. Bu çalışmalar, yardımların en fazla ihtiyaç duyan ailelere ulaşmasına, yerinden edilmiş kişilerin onurunun korunmasına ve ev sahibi toplulukların üzerindeki yükün hafifletilmesine katkı sağlayacaktır.
    - contact:
      - 'Genel Merkez: Aden – Mansura, Rimi'
      - 'E-posta: info@exuye.org'
      - 'Telefon: 02356000'

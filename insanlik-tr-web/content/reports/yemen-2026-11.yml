    - h: 3.4 مواقع النزوح والمجتمعات المضيفة
      level: 1
      id: s4-14
    - p: وفقًا لبيانات رصد المواقع التي يتشاركها فريق تنسيق SLSC، أُنشئ 29 موقعًا جديدًا لاستضافة النازحين، واستقبل 86 موقعًا أسرًا نازحة جديدة خلال موجة النزوح الأخيرة، وتضم هذه المواقع نحو 10,000 أسرة نازحة حديثًا (قرابة 60,000 فرد). كما تحققت آلية الاستجابة السريعة منذ 1 أغسطس من 39,835 أسرة (206,864 فردًا) في 65 مديرية ضمن 10 محافظات.
    - p: وبحسب المنظمة الدولية للهجرة، يزيد الوافدون الجدد الطلب على الخدمات والموارد في المجتمعات المضيفة ومواقع النزوح التي كانت تعاني أصلًا من قيود في القدرة الاستيعابية، ولا تزال ندرة المياه مصدر قلق رئيسي في المواقع القائمة. وفي عدن تقيم بعض الأسر النازحة لدى أسر أخرى بينما تبقى أسر أخرى في العراء (انظر 5.1.1).

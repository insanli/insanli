    - h: 2.2. Sağlık Hizmetleri ve Temel Altyapı Üzerindeki Etkiler
      level: 1
      id: s3-2
    - p: HEOC'un 10 Kasım 2026 itibarıyla bildirdiği verilere göre 28 sağlık tesisi ve 7 ambulans hasar görmüş, 13 sağlık çalışanı etkilenmiştir (7 ölü, 6 yaralı). Taiz'deki iki sağlık tesisinin (Hena Sağlık Birimi ve Balan Sağlık Merkezi) 5 Kasım'da hasar gördüğü bildirilmiş, ancak bu tesisler henüz resmî sayıma eklenmemiştir. DSÖ, erişim kısıtlamaları nedeniyle bu verilerin bağımsız olarak doğrulanmasının güç olduğunu belirtmektedir.
    - p: Taiz kentindeki hastaneler yakıt, cerrahi malzeme, anestezi ve yoğun bakım ilaçları bakımından ciddi sıkıntı yaşamaktadır. Bu durum ameliyathanelerin çalışmasını ve yoğun bakım üniteleri için oksijen üretimini aksatmakta, ambulansların bakımı yapılamamaktadır. Kentte çöp toplama hizmetlerinin durması, biriken katı atıklar ve tıbbi atıklar salgın hastalık riskini artırmaktadır.
    - h: 2.3. Kuşatma Altındaki Taiz Kenti
      level: 1
      id: s3-3
    - p: FEWS NET'e göre Sana merkezli yetkililer 4 Ekim 2026'da Taiz kentini hükümet kontrolündeki bölgelere bağlayan son ana yolun kontrolünü ele geçirmiş ve kent fiilen kuşatma altına girmiştir. Çoğu daha önce başka bölgelerden kente sığınmış olan tahminen 600.000–750.000 kişi giderek ağırlaşan gıda, yakıt, yemek pişirme gazı ve su sıkıntısıyla karşı karşıyadır. Kente sınırlı miktarda gıda ve temel ürün ancak küçük dağ yollarından ulaşabilmektedir.
    - p: FEWS NET, kuşatmanın aylarca sürmesi ve koşulların ağırlaşması durumunda Taiz kentinde Şubat–Mayıs 2027 döneminde kıtlık (IPC Aşama 5) yaşanması yönünde ciddi bir risk bulunduğunu değerlendirmektedir. Kuşatma öncesinde dahi hanelerin en az %20'sinin gıda tüketim puanı yetersiz düzeydeydi ve beş yaş altı çocuklarda akut yetersiz beslenme oranının kritik düzeyde (%15–29,9) olduğu tahmin edilmekteydi.
    - h: 2.4. Kadınlar, Çocuklar ve Diğer Hassas Grupların Karşılaştığı Riskler
      level: 1
      id: s3-4
    - p: IOM'un 15–17 Kasım 2026 tarihlerinde Marib Vadisi ve El-Cufeyne'de 12 yerinden edilmiş ailede (58 kişi) yaptığı hızlı koruma değerlendirmesine göre değerlendirilen kişilerin %55'i çocuk, %50'si kadın ve kız çocuğudur. Ailelerin %27'sinin reisi kadındır ve ailelerin %80'i koruma sorunları bildirmiştir. Öne çıkan riskler; zorla yerinden edilme, yetersiz barınma, dul kadınların mahremiyetine ilişkin endişeler, engellilikle bağlantılı ihtiyaçlar, gelir yokluğu ve kalabalık ailelerdeki bakım yüküdür. Örneklem küçük olduğundan bu bulgular genel eğilime ilişkin bir gösterge niteliğindedir.
    - p: FEWS NET, Taiz kentinde beslenme durumundaki bozulmanın özellikle çocukları, hamile ve emziren kadınları ve yaşlıları etkileyeceğini öngörmektedir. DSÖ ise yanık vakalarının arttığını, buna karşın hastanelerin ilk müdahale ve pansumanın ötesinde tedavi sunmakta zorlandığını; ruh sağlığı ve psikososyal destek ile rehabilitasyon hizmetlerinin en zayıf halkalar olmaya devam ettiğini bildirmektedir.
    - src: 'Kaynaklar: DSÖ Yemen, Çatışmaların Tırmanması Durum Raporu No. 12 (17 Kasım 2026); FEWS NET Yemen Uyarısı (17 Kasım 2026); IOM Yemen DTM, Hızlı Güncelleme No. 19 (18 Kasım 2026).'
  - title: 3. İnsani Krizden Etkilenen Gruplar ve Coğrafi Dağılım

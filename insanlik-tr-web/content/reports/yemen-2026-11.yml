          - Kenti hükümet kontrolündeki bölgelere bağlayan son ana yol 4 Ekim 2026'dan bu yana kapalı; sınırlı miktarda gıda ve temel ürün küçük dağ yollarından ve yüksek maliyetle ulaşıyor
          - FEWS NET
        - - El-Hudeyde
          - 9 Eylül 2026'dan bu yana IOM DTM ekibinin erişimi yok; yerinden edilmiş kişi sayısı 8.244'te sabit
          - IOM DTM

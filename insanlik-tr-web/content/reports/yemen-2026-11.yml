    - h: 1.3 حركات العبور إلى خارج البلاد
      level: 1
      id: s2-3
    - p: وفقًا للمنظمة الدولية للهجرة، وصل 4,336 مواطنًا يمنيًا إلى جيبوتي حتى 18 نوفمبر 2026، معظمهم عبر أوبوك. وتشير المعلومات الميدانية إلى أن أغلبهم فرّوا من تدهور الأوضاع الأمنية، ولا سيما في مناطق باب المندب وذباب والخوخة والحديدة. كما سجلت المفوضية السامية للأمم المتحدة لشؤون اللاجئين وصول 4,269 قادمًا جديدًا من اليمن إلى جيبوتي والصومال حتى 16 نوفمبر 2026.
    - src: 'المصدر: المنظمة الدولية للهجرة، تقرير التنقل: التصعيد في الشرق الأوسط وما بعده (19 نوفمبر 2026)؛ المفوضية السامية للأمم المتحدة لشؤون اللاجئين، خريطة الوضع في اليمن (16 نوفمبر 2026).'
  - title: 2. الانتهاكات ضد المدنيين والعواقب الإنسانية للنزاع
    blocks:
    - p: جُمعت البيانات الواردة في هذا القسم من تقارير وكالات الأمم المتحدة والسلطات الصحية اليمنية. ونظرًا إلى عدم اكتمال الإبلاغ وتعذر الوصول إلى بعض المناطق، ينبغي اعتبار هذه الأرقام حدًا أدنى.
    - h: 2.1 ضحايا النزاع
      level: 1
      id: s3-1
    - p: وفقًا لمركز عمليات الطوارئ الصحية التابع لوزارة الصحة العامة والسكان، بلغ عدد الضحايا جراء النزاع 12,779 شخصًا حتى 16 نوفمبر 2026 (10,519 مصابًا و2,260 وفاة). وخلال ثمانية أيام فقط من 9 إلى 16 نوفمبر أُضيف 1,024 ضحية (862 مصابًا و162 وفاة)، بمعدل يومي يقارب 128 ضحية. ونظرًا إلى أن نسبة اكتمال الإبلاغ اليومي تراوحت بين 58% و92%، فإن هذه الأرقام تمثل حدًا أدنى.

  sections:
  - title: Executive Summary
    blocks:
    - p: This report presents the recorded displacement figures for ten governorates—Al Hodeidah, Taiz, Lahj, Aden, Abyan, Shabwah, Hadramawt, Al Mahrah, Marib and Ad Dali'—as of the update prepared on 12 November 2026.
    - p: A total of 50,001 displaced households, comprising 338,748 IDPs, have been recorded across the ten governorates. Taiz has the highest number of registered households, with 23,007 households comprising 156,898 IDPs, followed by Lahj with 15,160 households comprising 117,271 IDPs, Abyan with 4,540 households comprising 22,030 IDPs, and Aden with 3,741 households comprising 17,782 IDPs,. Together, Taiz and Lahj account for approximately 70.4% of all households and 75.9% of all IDPs. This underscores the importance of allocating resources according to the scale of displacement and actual needs, while ensuring coverage of the other governorates.
    - p: Accordingly, the Executive Unit urgently appeals to local authorities, United Nations agencies, humanitarian clusters, national and international humanitarian organisations, donors and implementing partners to mobilise resources and capacities to support displaced households.

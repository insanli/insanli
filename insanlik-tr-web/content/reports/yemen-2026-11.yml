    - src: 'المصدر: منظمة الصحة العالمية – اليمن، التقرير الموقفي رقم 12 بشأن تصاعد النزاع (17 نوفمبر 2026) (بيانات مركز عمليات الطوارئ الصحية). تُحتسب الأعداد حسب مكان الإبلاغ لا مكان الإصابة.'
    - h: 2.2 الآثار على الخدمات الصحية والبنية التحتية الأساسية
      level: 1
      id: s3-2
    - p: أفاد مركز عمليات الطوارئ الصحية حتى 10 نوفمبر 2026 بتضرر 28 منشأة صحية و7 سيارات إسعاف، وتأثر 13 عاملًا صحيًا (7 قتلى و6 مصابين). كما أُبلغ في 5 نوفمبر عن تضرر منشأتين صحيتين أخريين في تعز لم تُدرجا بعد في الحصيلة. وتشير منظمة الصحة العالمية إلى صعوبة التحقق المستقل من هذه البيانات بسبب قيود الوصول.
    - p: وتعاني مستشفيات مدينة تعز نقصًا حادًا في الوقود والمستلزمات الجراحية وأدوية التخدير والعناية المركزة، ما يعطل عمل غرف العمليات وتوليد الأكسجين لوحدات العناية المركزة، فضلًا عن غياب صيانة سيارات الإسعاف. كما يزيد توقف خدمات جمع النفايات وتراكم النفايات الصلبة والطبية من مخاطر انتشار الأمراض.
    - h: 2.3 مدينة تعز تحت الحصار
      level: 1
      id: s3-3
    - p: وفقًا لشبكة FEWS NET، سيطرت السلطات القائمة في صنعاء في 4 أكتوبر 2026 على آخر طريق رئيسي يربط مدينة تعز بالمناطق الخاضعة لسيطرة الحكومة، ما وضع المدينة فعليًا تحت الحصار. ويواجه ما يقدّر بنحو 600,000 إلى 750,000 شخص، كثير منهم نزحوا إلى المدينة من مناطق أخرى، نقصًا متفاقمًا في الغذاء والوقود وغاز الطهي والمياه. ولا تصل إلى المدينة سوى كميات محدودة من الغذاء والسلع الأساسية عبر طرق جبلية صغيرة.
    - p: وتقدّر الشبكة وجود خطر حقيقي لحدوث مجاعة (المرحلة الخامسة من التصنيف المرحلي المتكامل للأمن الغذائي) في مدينة تعز خلال الفترة من فبراير إلى مايو 2027 إذا طال الحصار واشتدت قيوده. وحتى قبل الحصار، كانت 20% على الأقل من الأسر تسجل درجة استهلاك غذائي ضعيفة، وكان معدل سوء التغذية الحاد لدى الأطفال دون الخامسة يُقدَّر عند مستويات حرجة (15–29.9%).
    - h: 2.4 المخاطر التي تواجه النساء والأطفال والفئات الأكثر ضعفًا
      level: 1
      id: s3-4
    - p: 'أظهر تقييم الحماية السريع الذي أجرته المنظمة الدولية للهجرة خلال الفترة 15–17 نوفمبر 2026 على 12 أسرة نازحة (58 فردًا) في مأرب الوادي والجفينة أن الأطفال شكّلوا 55% من المشمولين بالتقييم والنساء والفتيات 50%، وأن 27% من الأسر تعيلها نساء، وأن 80% من الأسر أبلغت عن مخاوف تتعلق بالحماية. ومن أبرز المخاطر: التهجير القسري، وعدم ملاءمة المأوى، ومخاوف الخصوصية لدى الأرامل، والاحتياجات المرتبطة بالإعاقة، وانعدام الدخل، وأعباء الرعاية في الأسر الكبيرة. ونظرًا إلى صغر حجم العينة، تُعد هذه النتائج مؤشرًا عامًا.'
    - p: وتتوقع شبكة FEWS NET أن يطال تدهور الحالة التغذوية في مدينة تعز الأطفال والنساء الحوامل والمرضعات وكبار السن بصورة خاصة. وتفيد منظمة الصحة العالمية بارتفاع حالات الحروق في حين لا تستطيع المستشفيات تقديم أكثر من التثبيت الأولي وتضميد الجروح، وبأن الصحة النفسية والدعم النفسي الاجتماعي وإعادة التأهيل لا تزال الحلقات الأضعف.
    - src: 'المصادر: منظمة الصحة العالمية – اليمن، التقرير الموقفي رقم 12 بشأن تصاعد النزاع (17 نوفمبر 2026)؛ شبكة نظم الإنذار المبكر بالمجاعة (FEWS NET)، تنبيه بشأن اليمن (17 نوفمبر 2026)؛ المنظمة الدولية للهجرة – مصفوفة تتبع النزوح في اليمن، التحديث العاجل رقم 19 (18 نوفمبر 2026).'
  - title: 3. الفئات المتأثرة بالأزمة الإنسانية والتوزيع الجغرافي

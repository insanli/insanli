    - h: 1.3. Ülke Dışına Yönelik Hareketler
      level: 1
      id: s2-3
    - p: IOM'a göre 18 Kasım 2026 itibarıyla 4.336 Yemen vatandaşı, büyük bölümü Obock üzerinden olmak üzere Cibuti'ye ulaşmıştır. Sahada toplanan bilgiler, bu kişilerin büyük kısmının özellikle Bab el-Mendeb, Zubab, Havha ve El-Hudeyde bölgelerindeki kötüleşen güvenlik koşulları nedeniyle ülkeden ayrıldığını göstermektedir. UNHCR ise 16 Kasım 2026 itibarıyla Cibuti ve Somali'ye Yemen'den 4.269 yeni kişinin ulaştığını kaydetmiştir.
    - src: 'Kaynak: IOM, Orta Doğu ve Ötesinde Tırmanma – Hareketlilik Raporu (19 Kasım 2026); UNHCR, Yemen Durum Haritası (16 Kasım 2026).'
  - title: 2. Sivillere Yönelik İhlaller ve Çatışmaların İnsani Sonuçları
    blocks:
    - p: Bu bölümdeki veriler Birleşmiş Milletler kuruluşlarının ve Yemen sağlık makamlarının raporlarından derlenmiştir. Raporlamanın eksik olduğu ve bazı bölgelere erişilemediği dikkate alındığında rakamların asgari düzeyi yansıttığı değerlendirilmektedir.
    - h: 2.1. Çatışmalara Bağlı Yaralı ve Ölü Sayıları
      level: 1
      id: s3-1
    - p: Yemen Halk Sağlığı ve Nüfus Bakanlığı'na bağlı Sağlık Acil Durum Operasyon Merkezi'nin (HEOC) verilerine göre 16 Kasım 2026 itibarıyla çatışmalar nedeniyle 12.779 kişi yaralanmış veya hayatını kaybetmiştir (10.519 yaralı, 2.260 ölü). Yalnızca 9–16 Kasım arasındaki sekiz günde bu sayıya 1.024 kişi (862 yaralı, 162 ölü) eklenmiş, günlük ortalama yaklaşık 128 kişi olmuştur. Günlük raporlama oranı %58 ile %92 arasında kaldığından bu rakamlar asgari düzeyi göstermektedir.

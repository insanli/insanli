    - p: بلغ الإجمالي الأسرة النازحة 50,001 تضم 338,748 فردًا في المحافظات العشر. وتتصدر تعز أعداد الأسر المسجلة بواقع 23,007 أسر تضم 156,898 فردًا، تليها لحج بواقع 15,160 أسرة تضم 117,271 فردًا، ثم ابين بواقع 4,540 أسرة تضم 22,030 فردًا، وعدن بواقع 3,741 أسرة تضم 17,782 فردًا. وتمثل تعز ولحج معًا نحو 76.3% من إجمالي الأسر و80.9% من إجمالي الأفراد، بما يبرز أهمية توجيه الموارد وفق حجم النزوح والاحتياجات الفعلية، مع ضمان تغطية المحافظات الأخرى.
    - p: وعليه، تناشد الوحدة التنفيذية بشكل عاجل السلطات المحلية ووكالات الأمم المتحدة والمجموعات القطاعية الإنسانية والمنظمات الإنسانية الوطنية والدولية والجهات المانحة وشركاء التنفيذ لحشد الموارد والقدرات لدعم الاسر النازحة.

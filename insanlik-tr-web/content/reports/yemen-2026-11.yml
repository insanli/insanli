    - h: 5.4 Proposed Priorities and Urgent Actions
      level: 1
      id: s6-9
    - p: The immediate objective should be to ensure that newly displaced households are not left without minimum life-saving assistance, while maintaining accurate registration, verification and coordination. Urgent response and sectoral assessments should proceed in parallel, rather than sequentially, wherever evident humanitarian needs already exist.
    - ol:
      - Prioritise all displaced households that have not received humanitarian assistance, with immediate attention to the most recently displaced and most vulnerable households.
      - Provide emergency shelter and shelter materials, prioritising households living in the open without accommodation of their own, and households currently dependent on host families.
      - Expand urgent food and cash assistance for households without food support or income.
      - Provide safe drinking water, emergency latrines, hygiene supplies, sanitation services and waste management at reception sites and displacement gatherings.
      - Activate or expand Rapid Response Mechanism support for eligible newly displaced households, and cross-check beneficiary lists to prevent duplication.
      - Conduct rapid multisectoral assessments while delivering urgent assistance, particularly in newly established reception areas.
      - Mobilise health partners to provide essential health services, medicines, first aid and referrals.
      - Mobilise protection partners to identify and refer cases involving children, women, older persons, persons with disabilities, persons living with chronic illnesses and other groups at heightened risk.
      - Support the provision of non-food items and basic household necessities and, where possible, livelihood-related needs for households that have lost their income and productive assets.
      - Strengthen daily/weekly tracking of displacement and response, clearly distinguishing between planned and implemented interventions, and recording unique household counts after removing duplicates.
      - Strengthen preparedness for potential additional waves of displacement from conflict-affected areas.
  - title: 6. Delivery of Humanitarian Aid and Access
    blocks:
    - h: 6.1 Aid Delivery and Logistics Hubs
      level: 1
      id: s7-1
    - p: Aden is a key hub for aid delivery, as it hosts the main referral hospitals, the Health Emergency Operations Centre and the warehouse supplying the health response. WHO has delivered 19.6 MT of medicines and medical supplies to Khalifa Hospital, Al-Neshma Hospital and the Al-Mudhaffar diarrhoea treatment centre in Taiz. In the shelter sector, partners hold 4,115 shelter kits and tents and 8,271 full NFI kits in stock, and 5,250 partial NFI kits are awaiting distribution. The advance of the front line towards Aden puts referral and supply routes at risk.
    - h: 6.2 Areas with Restricted Access
      level: 1
      id: s7-2
    - table:
        head:
        - Area
        - Access situation
        - Source
        rows:
        - - Taiz City
          - The last major road linking the city to government-held areas has been cut since 4 October 2026; limited food and essentials arrive via small mountain roads at high cost
          - FEWS NET
        - - Al Hodeidah
          - IOM DTM has had no access since 9 September 2026; the IDP figure remains steady at 8,244
          - IOM DTM
        - - Aden
          - The Executive Unit halted field operations because of access constraints; the front line is approaching Aden
          - Executive Unit, WHO
        - - Areas under the control of the de facto authorities
          - No access to routine health data; hospitals reported to be short of medical and surgical supplies
          - WHO
        - - Remote areas of Hajjah
          - Treatment for acute watery diarrhoea and cholera hard to reach
          - WHO
        fold: false
    - p: To reach hospitals on both sides of the front line, WHO recommends alternative delivery routes, including delivery through partners, cross-line movements and humanitarian flights, together with access negotiations with all parties.
    - src: 'Sources: WHO Yemen, Conflict Escalation Situation Report #12 (17 November 2026); FEWS NET, Yemen Alert (17 November 2026); IOM Yemen DTM, Flash Update #19 (18 November 2026); Yemen SLSC Situation Update (18 November 2026).'
  - title: 7. Challenges Faced in Humanitarian Aid Operations
    blocks:
    - p: 'The source reports and the Executive Unit''s field observations point to the following main challenges facing the humanitarian response:'
    - ol:
      - 'Security: Front lines are shifting rapidly and approaching Aden through Lahj, which risks increasing casualties and displacement and cutting referral and supply routes.'
      - 'Restricted field access: Taiz City is under a de facto siege; IOM DTM has lost access to Al Hodeidah; the Executive Unit had to halt field operations in Aden; and routine data cannot be obtained from areas under the control of the de facto authorities.'
      - 'Insufficient funding: The 90-day health response plan is 35% funded; WHO-supported trauma deployments are funded only until January 2027; and the shelter and NFI gap stands at $22.2 million.'
      - 'Logistics and supply shortages: Hospitals in Taiz face critical shortages of fuel, surgical supplies and anaesthesia and ICU medicines, and ambulances lack maintenance.'
      - 'Repeated displacement: Many families have been displaced two to four times, and many households previously recorded in Aden have moved to Lahj and Abyan, making secondary displacement difficult to track.'
      - 'Access to up-to-date, verified data: Daily casualty reporting completeness ranges from 58% to 92%; the Executive Unit''s registration data and IOM DTM''s movement data are not directly comparable; and assistance records are not matched household by household to the RRM lists.'
      - 'Households not reached: 8,511 households (21%) on the RRM lists are registered but have not yet received assistance, and IDPs'' access to primary health care remains limited in Taiz, Abyan and Shabwah.'
      - 'Gaps in health services: Burn care, mental health and psychosocial support and rehabilitation are not adequately funded, and trauma referral dispatch is not funded.'
      - 'Outbreak risk: While cholera is declining in the five most-affected governorates, a complex outbreak combining food poisoning and cholera is growing in Tarim (Hadramawt Al-Wadi), and acute watery diarrhoea is rising in Hajjah.'
    - src: 'Sources: WHO Yemen, Conflict Escalation Situation Report #12 (17 November 2026); FEWS NET, Yemen Alert (17 November 2026); IOM Yemen DTM, Flash Update #19 (18 November 2026); IOM, Escalation in the Middle East and Beyond – Mobility Report (19 November 2026); Yemen SLSC Situation Update (18 November 2026).'
  - title: 8. Recommendations for Improving the Humanitarian Situation in Yemen
    blocks:
    - h: 8.1 Humanitarian Appeal to Local and International Organisations
      level: 1
      id: s9-1
    - p: The Executive Unit for IDPs Camp Management urgently appeals to local authorities, United Nations agencies, humanitarian clusters, national and international humanitarian organisations, donors and implementing partners to mobilise immediate resources and operational capacities for the displaced households documented in this report.
    - p: Current displacement is placing newly displaced households in highly vulnerable situations. Families have been forced to leave their homes and livelihoods because of conflict and military escalation and, in several locations, have arrived without shelter, food, sufficient water or access to basic services. Delays in assistance will increase exposure to protection risks, deepen economic vulnerability and place further pressure on host communities.
    - ol:
      - Treat the documented displacement cases as an urgent humanitarian response priority and activate available emergency mechanisms without unnecessary delay.
      - Ensure that households with no recorded assistance are identified, verified and immediately referred to the appropriate sector or response partner.
      - Mobilise resources for emergency shelter, food, water, sanitation, health, protection, cash assistance, non-food items and other essential household needs.
      - Support rapid response and emergency interventions while conducting specialised sectoral assessments in parallel.
      - Strengthen coordination between Executive Unit offices in the governorates covered by this report and humanitarian partners to track primary and secondary displacement and prevent duplication or exclusion.
      - Provide sufficient funding and operational support to expand response coverage and address the remaining gaps.
      - Prioritise children, women, older persons, persons with disabilities, households with members living with chronic illnesses, and other households facing heightened protection or humanitarian risks.
      - Ensure that no newly displaced household remains without minimum humanitarian assistance because of delayed assessments, insufficient funding or coordination constraints.
      - Maintain continuous data updates and transparent reporting to enable humanitarian partners to direct assistance to households and locations with the greatest unmet needs.
    - h: 8.2 Key Recommendations from Humanitarian Agencies' Reports
      level: 1
      id: s9-2
    - ol:
      - Provide urgent humanitarian food assistance to households in besieged Taiz City, in line with the FEWS NET alert.
      - Mobilise the $22.2 million needed to close the shelter and NFI gaps and the $3.6 million needed for site management and maintenance (SLSC).
      - As the front line approaches Aden, review and resource contingency plans for a casualty surge, alternative referral and supply routes and the continuity of operations (WHO).
      - Fund trauma stabilization points, trauma referral dispatch, burn care, mental health and psychosocial support and rehabilitation, and secure funding beyond January 2027 (WHO).
      - Use alternative delivery routes and pursue access negotiations with all parties to reach hospitals on both sides of the front line (WHO).
      - Reach the 73,300 children missed by the measles–rubella campaign through follow-up vaccination, particularly in Shabwah, Hadramawt, Al Mahrah and Socotra (WHO).
      - Carry out joint food-safety, WASH and case-management action against the outbreak in Tarim (WHO).
      - Strengthen coordination of the response across governorates, given the growing share of inter-governorate movements, and pay greater attention to the evolving needs of displaced people in receiving areas (IOM).
      - Conduct an Intra-Action Review under the leadership of the Ministry of Public Health and Population before the current response plan ends (WHO).
    - src: 'Sources: FEWS NET, Yemen Alert (17 November 2026); Yemen SLSC Situation Update (18 November 2026); WHO Yemen, Conflict Escalation Situation Report #12 (17 November 2026); IOM Yemen DTM, Flash Update #19 (18 November 2026).'
  - title: 9. Conclusion
    in_toc: false
    blocks:
    - p: The consolidated figures reveal substantial displacement across the ten governorates, totalling 50,001 displaced households comprising 338,748 IDPs. This figure reflects the scale of the population that should be covered by verification, needs assessments and response planning, and the associated pressure on shelter, basic services and the capacities of host communities.
    - p: Taiz and Lahj host the largest number of registered displaced persons, with 274,169 IDPs, or approximately 80.9% of the total. This concentration requires partners to expand their operational capacity in both governorates, while directing interventions in the remaining governorates according to the severity of needs and protection risks, rather than using population figures as the sole criterion for allocating assistance.
    - p: Accordingly, the Executive Unit calls upon the relevant stakeholders, humanitarian partners and donors to mobilise urgent and sufficient funding for a coordinated response covering shelter, food, water, sanitation, health, protection, cash assistance and essential items. This should be accompanied by updated records, tracking of secondary displacement, removal of duplicates and verification of actual gaps, to ensure that assistance reaches the households most in need, preserves the dignity of displaced persons and eases the burden on host communities.
    - contact:
      - 'Head Office: Aden – Al Mansurah – Remi'
      - 'Contact: 02356000'
      - 'Email: info@exuye.org'

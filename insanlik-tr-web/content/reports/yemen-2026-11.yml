          - Yürütme Birimi erişim kısıtlamaları nedeniyle saha faaliyetlerini durdurdu; cephe hattı Aden'e yaklaşıyor
          - Yürütme Birimi, DSÖ
        - - Fiilî yetkililerin kontrolündeki bölgeler
          - Rutin sağlık verilerine erişim yok; hastanelerde tıbbi ve cerrahi malzeme eksikliği bildiriliyor
          - DSÖ
        - - Hacce'nin uzak bölgeleri
          - İshal ve kolera tedavisine erişim güç
          - DSÖ
        fold: false
    - p: DSÖ, cephe hattının her iki tarafındaki hastanelere ulaşabilmek için ortaklar aracılığıyla teslimat, cepheler arası geçişler ve insani yardım uçuşları gibi alternatif teslimat yollarının kullanılmasını ve tüm taraflarla erişim müzakerelerinin yürütülmesini önermektedir.

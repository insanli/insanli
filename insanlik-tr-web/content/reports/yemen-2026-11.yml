    - h: 2.2 Impact on Health Services and Basic Infrastructure
      level: 1
      id: s3-2
    - p: As of 10 November 2026, the HEOC reported damage to 28 health facilities and 7 ambulances, and 13 health workers affected (7 killed and 6 injured). Two facilities in Taiz (Hena Health Unit and Balan Health Centre) were reported damaged on 5 November but are not yet included in the count. WHO notes that independent verification remains difficult because of access constraints.
    - p: Hospitals in Taiz City face severe shortages of fuel, surgical supplies and anaesthesia and ICU medicines. These shortages are disrupting operating theatres and oxygen generation for intensive care units, and ambulances lack maintenance. The lapse of waste collection services and the accumulation of solid and medical waste are increasing the risk of disease.
    - h: 2.3 Taiz City under Siege
      level: 1
      id: s3-3
    - p: According to FEWS NET, on 4 October 2026 the Sana'a-based authorities captured the last major road linking Taiz City to government-held areas, effectively placing the city under a de facto siege. An estimated 600,000–750,000 people, many already displaced to the city from elsewhere, face worsening shortages of food, fuel, cooking gas and water. Limited quantities of food and essentials reach the city only via small mountain roads.
    - p: FEWS NET assesses a credible risk of Famine (IPC Phase 5) in Taiz City from February to May 2027 if the siege is prolonged and tightened. Even before the siege, at least 20% of households had a poor Food Consumption Score, and acute malnutrition among children under five was estimated to be at Critical levels (15–29.9%).
    - h: 2.4 Risks Facing Women, Children and Other Vulnerable Groups
      level: 1
      id: s3-4
    - p: An IOM Protection Rapid Assessment of 12 displaced households (58 people) in Marib Al Wadi and Al Jufainah on 15–17 November 2026 found that children made up 55% of those assessed and women and girls 50%. 27% of households were female-headed, and 80% reported protection concerns. Key risks included forced displacement, inadequate shelter, privacy concerns affecting widowed women, disability-related needs, lack of income and caregiving responsibilities in large households. As the sample is small, these findings are indicative.
    - p: FEWS NET expects the deterioration in nutritional status in Taiz City to affect children, pregnant and lactating women and the elderly in particular. WHO reports that burn cases are rising while hospitals can offer little beyond initial stabilization and wound dressing, and that mental health and psychosocial support and rehabilitation remain the weakest links.
    - src: 'Sources: WHO Yemen, Conflict Escalation Situation Report #12 (17 November 2026); FEWS NET, Yemen Alert (17 November 2026); IOM Yemen DTM, Flash Update #19 (18 November 2026).'

  - title: 1. Yemen'deki İnsani Durum ve Zorunlu Yerinden Edilme
    blocks:
    - p: Bu rapor, Yemen'de devam eden çatışmalar nedeniyle on ilde yaşanan zorunlu yerinden edilme hareketlerini ve bunun yol açtığı insani sorunları ele almaktadır. Çatışmalar nedeniyle çok sayıda aile, yaşadığı bölgeyi ve evini terk etmek zorunda kalmış; konutlarını, kişisel eşyalarını, geçim kaynaklarını, hayvanlarını ve düzenli gelirlerini kaybetmiştir. Bu kayıplar, ailelerin yaşam koşullarını daha da ağırlaştırmış ve temel ihtiyaçlarını kendi imkânlarıyla karşılamalarını güçleştirmiştir.
    - p: Yerinden edilmenin yol açtığı insani ihtiyaçlar yalnızca barınmayla sınırlı değildir. Yaşadıkları yerleri terk etmek zorunda kalan aileler, çoğu zaman yeterli gıdaya, temiz içme suyuna, temel sağlık hizmetlerine ve hijyen koşullarına erişememektedir. Bunun yanı sıra koruma hizmetlerine, temel ihtiyaç malzemelerine ve geçimlerini sürdürebilmeleri için nakdî desteğe de ihtiyaç duymaktadırlar.
    - p: Yürütme Birimi, bu koşullar altında yürütülecek insani yardım çalışmalarının hızlı, koordineli ve sahadaki gerçek ihtiyaçlara dayalı olması gerektiğini vurgulamaktadır. Bu çalışmaların temel amacı; can kayıplarını önlemek, insanların onurunu korumak, karşı karşıya oldukları riskleri azaltmak, ailelerin yaşam koşullarının daha fazla kötüleşmesini engellemek ve yerinden edilmiş nüfusa ev sahipliği yapan toplulukların üzerindeki yükü hafifletmektir.
    - h: 1.1. Çatışmaların Seyri ve İnsani Sonuçları
      level: 1
      id: s2-1
    - p: FEWS NET'in 17 Kasım 2026 tarihli uyarısına göre Yemen'deki çatışmalar, Temmuz 2026'dan bu yana cephe hatlarının sık sık değiştiği ve birden fazla cephede süren yüksek yoğunluklu bir savaşa dönüşmüştür. Taiz ve Lahic illeri çatışmaların merkezi hâline gelmiştir. IOM'a göre Eylül 2026 başından itibaren özellikle Batı Kıyısı'nda, Taiz ve El-Hudeyde illerinde çatışmalar yoğunlaşmış; Makbine, Mevza, Muha ve çevresindeki cephe ilçelerinde şiddetli çatışmalar yaşanmıştır.
    - p: DSÖ'nün 17 Kasım 2026 tarihli durum raporuna göre cephe hattı Lahic ili üzerinden hızla ilerleyerek Aden'e yaklaşmaktadır. Aden; ana sevk hastanelerine, Sağlık Acil Durum Operasyon Merkezi'ne (HEOC) ve sağlık müdahalesini besleyen depoya ev sahipliği yapmaktadır. Cephe hattındaki yeni hareketlerin yaralı akışını ve yerinden edilmeyi değiştirmesi, sevk ve ikmal güzergâhlarını kesintiye uğratması beklenmektedir.
    - p: Çatışmaların insani sonuçları yalnızca yerinden edilmeyle sınırlı değildir. Taiz kenti Ekim ayından bu yana fiilî kuşatma altındadır ve kentte gıda, yakıt, yemek pişirme gazı ve su sıkıntısı derinleşmektedir. Hastaneler yakıt ve ilaç eksikliği nedeniyle hizmet vermekte zorlanmakta, kolera ve diğer salgın hastalık riskleri sürmektedir. Pek çok aile iki ila dört kez yerinden edilmiş, bir kısmı beş yılı aşkın süredir yaşadığı yerleşim alanlarını terk etmek zorunda kalmıştır. Bu durum, zaten kapasitesinin üzerinde yük taşıyan ev sahibi topluluklar ve yerleşim alanları üzerindeki baskıyı artırmaktadır.
    - h: 1.2. Ülke Genelinde Yerinden Edilmenin Boyutu
      level: 1
      id: s2-2
    - p: IOM Yemen Yerinden Edilme İzleme Matrisi'nin (DTM) 18 Kasım 2026 tarihli verilerine göre çatışmaların tırmandığı Haziran 2026'dan bu yana toplam 357.658 kişi (59.602 aile) yerinden edilmiştir. Bunların yaklaşık 356.602'si (59.426 aile) 1 Ağustos–17 Kasım 2026 döneminde yerinden edilmiştir. Yerinden edilme Haziran–Ağustos döneminde görece düşük seyretmiş, Eylül başında keskin biçimde artmış ve günlük en yüksek sayıya 9 Eylül'de 15.186 kişiyle ulaşmıştır. Haftalık yerinden edilme Kasım ortası itibarıyla yaklaşık 3.150 aile düzeyindedir. DTM, 1 Ocak 2026'dan bu yana toplam 369.012 kişinin yerinden edildiğini kaydetmiştir.
    - p: Yürütme Birimi'nin bu raporda yer alan 338.748 kişilik (50.001 aile) verisi bir kayıt sayımıdır. DSÖ'nün de belirttiği gibi bu veri, yerinden edilme hareketlerini izleyen IOM DTM verileriyle doğrudan karşılaştırılamaz.

  - title: 4. Humanitarian Situation of Displaced Households
    blocks:
    - p: Qualitative information received from the governorates indicates difficult displacement conditions and multisectoral needs. This update demonstrates the scale of the registered displaced population across the ten governorates.
    - h: 4.1 Shelter and Accommodation
      level: 1
      id: s5-1
    - p: Shelter and accommodation are a core response priority. Some displaced households in Aden rely on accommodation provided by other families, while others remain in the open without shelter at the time of writing. The current scale of displacement requires verification of housing conditions, identification of the households most in need, and support for host communities.
    - h: 4.2 Food and Basic Needs
      level: 1
      id: s5-2
    - p: All reports indicate that food and shelter are urgent needs, while food items and essential supplies are identified as priority needs for displaced households.
    - h: 4.3 Water, Sanitation and Hygiene
      level: 1
      id: s5-3
    - p: Safe drinking water, sanitation, hygiene supplies, emergency latrines and waste management are identified as urgent needs, particularly in newly established displacement sites and gatherings.
    - h: 4.4 Health and Protection
      level: 1
      id: s5-4
    - p: Displaced households face limited access to health and protection services. Priority attention is required for children, women, older persons, persons with disabilities, households with members living with chronic illnesses, and other highly vulnerable households. Reports received from the governorates call for health and protection assessments, referrals, the provision of medicines and first aid, psychosocial support where needed, and a stronger protection response.
    - h: 4.5 Livelihoods and Economic Vulnerability
      level: 1
      id: s5-5
    - p: The loss of, or damage to, sources of income, property, livestock and other livelihood assets has increased the economic vulnerability of displaced households. Many households therefore require immediate life-saving assistance, together with support to reduce the adverse economic effects of displacement and reliance on host communities that are already under severe pressure.
  - title: 5. Actions Taken by the Executive Unit
    blocks:
    - ul:
      - Establishing an operations room in the governorate branch and field teams at district level to monitor displacement developments.
      - Receiving newly displaced persons and registering households through field visits to areas of arrival and displacement gatherings.
      - Conducting initial verification of household numbers and locations, and collecting information on displacement conditions and immediate needs.
      - Monitoring and assessing immediate needs, continuously updating displacement data, and preparing and submitting lists of displaced persons.
      - Submitting reports to the leadership of the Executive Unit, local authorities, relevant stakeholders and humanitarian partners to expedite verification, referrals and response.
      - Following up on response coverage and households not reached, monitoring interventions, and updating the remaining gaps to improve targeting and reduce duplication.
      - Continuing field monitoring and reporting, and following up on the circumstances of displaced persons and the areas to which they have moved following recent events in certain districts of Taiz and Al Hodeidah.
    - p: In addition, the Executive Unit established a response monitoring team at its head office to follow displacement developments in the affected governorates and issued reports to United Nations clusters and local and international organisations.
  - title: 6. Proposed Priorities and Urgent Actions
    blocks:
    - p: The immediate objective should be to ensure that newly displaced households are not left without minimum life-saving assistance, while maintaining accurate registration, verification and coordination. Urgent response and sectoral assessments should proceed in parallel, rather than sequentially, wherever evident humanitarian needs already exist.
    - ol:
      - Prioritise all displaced households that have not received humanitarian assistance, with immediate attention to the most recently displaced and most vulnerable households.
      - Provide emergency shelter and shelter materials, prioritising households living in the open without accommodation of their own, and households currently dependent on host families.
      - Expand urgent food and cash assistance for households without food support or income.
      - Provide safe drinking water, emergency latrines, hygiene supplies, sanitation services and waste management at reception sites and displacement gatherings.
      - Activate or expand Rapid Response Mechanism support for eligible newly displaced households, and cross-check beneficiary lists to prevent duplication.
      - Conduct rapid multisectoral assessments while delivering urgent assistance, particularly in newly established reception areas.
      - Mobilise health partners to provide essential health services, medicines, first aid and referrals.
      - Mobilise protection partners to identify and refer cases involving children, women, older persons, persons with disabilities, persons living with chronic illnesses and other groups at heightened risk.
      - Support the provision of non-food items and basic household necessities and, where possible, livelihood-related needs for households that have lost their income and productive assets.
      - Strengthen daily/weekly tracking of displacement and response, clearly distinguishing between planned and implemented interventions, and recording unique household counts after removing duplicates.
      - Strengthen preparedness for potential additional waves of displacement from conflict-affected areas.
  - title: 7. Recommendations and Humanitarian Appeal to Local and International Organisations
    blocks:
    - p: The Executive Unit for IDPs Camp Management urgently appeals to local authorities, United Nations agencies, humanitarian clusters, national and international humanitarian organisations, donors and implementing partners to mobilise immediate resources and operational capacities for the displaced households documented in this report.
    - p: Current displacement is placing newly displaced households in highly vulnerable situations. Families have been forced to leave their homes and livelihoods because of conflict and military escalation and, in several locations, have arrived without shelter, food, sufficient water or access to basic services. Delays in assistance will increase exposure to protection risks, deepen economic vulnerability and place further pressure on host communities.
    - ol:
      - Treat the documented displacement cases as an urgent humanitarian response priority and activate available emergency mechanisms without unnecessary delay.
      - Ensure that households with no recorded assistance are identified, verified and immediately referred to the appropriate sector or response partner.
      - Mobilise resources for emergency shelter, food, water, sanitation, health, protection, cash assistance, non-food items and other essential household needs.
      - Support rapid response and emergency interventions while conducting specialised sectoral assessments in parallel.
      - Strengthen coordination between Executive Unit offices in the governorates covered by this report and humanitarian partners to track primary and secondary displacement and prevent duplication or exclusion.
      - Provide sufficient funding and operational support to expand response coverage and address the remaining gaps.
      - Prioritise children, women, older persons, persons with disabilities, households with members living with chronic illnesses, and other households facing heightened protection or humanitarian risks.
      - Ensure that no newly displaced household remains without minimum humanitarian assistance because of delayed assessments, insufficient funding or coordination constraints.
      - Maintain continuous data updates and transparent reporting to enable humanitarian partners to direct assistance to households and locations with the greatest unmet needs.
  - title: 8. Conclusion
    blocks:
    - p: The consolidated figures reveal substantial displacement across the ten governorates, totalling 50,001 displaced households comprising 338,748 IDPs. This figure reflects the scale of the population that should be covered by verification, needs assessments and response planning, and the associated pressure on shelter, basic services and the capacities of host communities.
    - p: Taiz and Lahj host the largest number of registered displaced persons, with 274,169 IDPs, or approximately 75.9% of the total. This concentration requires partners to expand their operational capacity in both governorates, while directing interventions in the remaining governorates according to the severity of needs and protection risks, rather than using population figures as the sole criterion for allocating assistance.
    - p: Accordingly, the Executive Unit calls upon the relevant stakeholders, humanitarian partners and donors to mobilise urgent and sufficient funding for a coordinated response covering shelter, food, water, sanitation, health, protection, cash assistance and essential items. This should be accompanied by updated records, tracking of secondary displacement, removal of duplicates and verification of actual gaps, to ensure that assistance reaches the households most in need, preserves the dignity of displaced persons and eases the burden on host communities.
    - end: End of Report
    - contact:
      - "Head Office: Aden – Al Mansurah – Remi"
      - "Contact: 02356000"
      - "Email: info@exuye.org"

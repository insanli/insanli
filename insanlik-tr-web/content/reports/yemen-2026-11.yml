    - h: 3.4 Displacement Sites and Host Communities
      level: 1
      id: s4-14
    - p: According to site monitoring data shared by the SLSC coordination team, 29 new IDP hosting sites have been established and 86 sites have received newly displaced families during the latest wave of displacement. These sites host about 10,000 newly displaced households (around 60,000 people). The Rapid Response Mechanism (RRM) has verified 39,835 households (206,864 people) in 65 districts of 10 governorates since 1 August.
    - p: According to IOM, new arrivals are increasing demand for services and resources in host communities and displacement sites that were already facing capacity constraints, and water scarcity remains a key concern in existing sites. In Aden, some displaced households are staying with other families while others remain in the open (see 5.1.1).
    - src: 'Source: Yemen SLSC Situation Update (18 November 2026); IOM, Escalation in the Middle East and Beyond – Mobility Report (19 November 2026).'
  - title: 4. National and International Humanitarian Aid Operations in Yemen
    blocks:
    - h: 4.1 Overall Status of International Humanitarian Aid
      level: 1
      id: s5-1
    - p: According to the Health Cluster, as of 17 November 2026, 26 health partners had reached more than 111,500 IDPs in 44 districts of 9 governorates, through 49 verified mobile medical teams and IDP temporary health points and support to 73 fixed health facilities. WHO supports 32 trauma and emergency care deployments in 6 governorates, and UNICEF-supported primary health care has reached 58,270 people in displaced and host communities.
    - p: In shelter and non-food items, of the 39,835 households on the Rapid Response Mechanism (RRM) lists, 31,324 (79%) have been registered and assisted, while 8,511 (21%) are registered but have not yet received assistance. All households assessed by IOM's protection teams received crisis counselling and psychological first aid, and those in need were referred to protection case management, cash for protection and health, WASH and shelter services. Organisations including Médecins Sans Frontières (MSF), the International Committee of the Red Cross (ICRC), Islamic Relief Yemen, the Field Medical Foundation, UNFPA and INTERSOS also contribute to the response.
    - h: 4.2 Humanitarian Funding and Funding Gaps
      level: 1
      id: s5-2
    - p: The source reports show that funding remains the main constraint on the response. The 90-day health response plan ending on 31 December 2026 was only 35% funded as of 10 November, and $22.2 million is needed to close the gaps in shelter and non-food items.

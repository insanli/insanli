# Yemen – rows added to the Quick Funding (Acil Müdahaleler) page, from the Excel
# "اليمن | قائمة المشاريع والتدخلات الإنسانية الموحّدة" (7 November 2026).
# Every text is written as ["Turkish", "English", "Arabic"].
# The build adds each row at the end of its table (sector) on the Yemen page, in all three languages.
#   price    = unit cost (USD)          funding = "Funding From" (if missing: same as price)
#   min      = "Recommended Minimum"    (if missing: Flexible)
#   kit      = also gets a "View contents" page (see kits: at the end of this file)

labels:
  flexible: ["Esnek", "Flexible", "مرن"]
  beneficiaries: ["Faydalanıcı: ", "Beneficiaries: ", "المستفيدون: "]
  duration: ["Süre: ", "Duration: ", "المدة: "]


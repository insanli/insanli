  - value: 5.2M
    label: نازحون داخليًا
  - value: 18.3M
    label: أشخاص يواجهون انعدام الأمن الغذائي الحاد
  - value: 2.2M
    label: أطفال دون الخامسة يعانون من سوء التغذية الحاد
  sections:
  - kind: context
    kicker: السياق الحالي
    title: نظرة عامة على الوضع
    text: تدهورت الأزمة الإنسانية في اليمن بصورة حادة مع تجدد القتال ووقوع موجات نزوح جديدة وتفاقم انعدام الأمن الغذائي والتراجع الاقتصادي واستمرار الضغط على الخدمات الأساسية. ولا يزال ملايين الأشخاص نازحين ويعتمدون بدرجة كبيرة على المساعدات الإنسانية، فيما تؤدي الاضطرابات في الأسواق والتجارة والوصول الإنساني إلى زيادة المخاطر على الأسر الأكثر هشاشة. كما يواصل سوء التغذية وتفشي الأمراض فرض ضغوط إضافية على نظام صحي هش أصلًا.
  - kind: needs
    kicker: الاحتياجات الإنسانية
    title: الاحتياجات الإنسانية ذات الأولوية
    text: تشمل الاحتياجات ذات الأولوية المساعدات الغذائية والتغذوية الطارئة، ومياه الشرب الآمنة وخدمات الصرف الصحي، والرعاية الصحية الأساسية، والمأوى ومواد الإغاثة الأساسية للأسر النازحة حديثًا والأكثر هشاشة. ويحتاج الأطفال والأسر النازحة والمجتمعات المتأثرة بتجدد القتال إلى اهتمام خاص.
  - kind: priorities
    kicker: أولويات الاستجابة
    title: أولويات الاستجابة الرئيسية
    text: تشمل الأولويات الفورية توسيع نطاق المساعدات الغذائية والتغذوية، ودعم الأسر النازحة حديثًا بالمأوى والمواد الأساسية، والحفاظ على الوصول إلى المياه الآمنة والرعاية الصحية، وحماية الوصول الإنساني ومسارات الإمداد. وينبغي أن تبقى الاستجابة مرنة مع استمرار تغير أنماط النزوح والاحتياجات.
  note: تعكس الأرقام أحدث البيانات الإنسانية المتاحة لفترة التقرير. وتشمل المصادر تحديثات الوضع الإنساني الرسمية والتقارير القطاعية الصادرة عن مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية وبرنامج الأغذية العالمي ومنظمة الصحة العالمية واليونيسف.

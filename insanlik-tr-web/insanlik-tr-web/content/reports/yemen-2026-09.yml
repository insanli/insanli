  country_name: اليمن
  title: اليمن — نظرة عامة على الوضع الإنساني
  summary: تدهورت الأزمة الإنسانية في اليمن بصورة حادة مع تجدد القتال ووقوع موجات نزوح جديدة وتفاقم انعدام الأمن الغذائي والتراجع الاقتصادي واستمرار الضغط على الخدمات الأساسية. ولا يزال ملايين الأشخاص نازحين ويعتمدون بدرجة كبيرة على المساعدات الإنسانية، فيما تؤدي…
  figures:
  - value: 22M
